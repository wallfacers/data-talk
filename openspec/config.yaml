schema: spec-driven

context: |
  DataTalk is an AI-powered intelligent database collaboration platform: Tauri v2 + React 19 frontend, Spring Boot 3.5 + Java 21 backend, OpenCode HTTP for AI communication, SQLite for metadata.

  Architecture: domain → application → infrastructure → adapter (4-layer, outer depends on inner, never reverse). Adding an Action = @DataTalkAction-annotated ActionHandler bean, zero core code changes.

  Protocol: Streamable HTTP — POST response upgrades to SSE; server pushes action.invoke, client replies with action_result. Event model: DtEvent sealed interface, 22 event types.

  Frontend: React 19, TanStack Router/Query, Zustand (per feature), shadcn/ui components. Stage state is session-independent/global — useStageStore tabs/open/maximized/activeTabId are single values, not per-session maps. Switching active session does not change stage tabs.

  Backend: Java 21 virtual threads, JdbcTemplate, Flyway migrations. Modules loaded from ~/.m2 not target/classes — after editing domain/application/infrastructure, use mvn install -pl <module> -am -DskipTests.

  Testing: JUnit 5 + AssertJ + WireMock 3.x (FakeOpenCodeServer) for backend, vitest for frontend.

  Database: SQLite metadata + dynamic JDBC user DBs (MySQL/PG/H2 + 16 first-class kinds: sqlite, oracle, sqlserver, mariadb, apache_doris, starrocks, clickhouse, hive, trino, presto, duckdb, tidb, opengauss, oceanbase, kingbase, dameng, gaussdb). Any DB change MUST read docs/DATA_SOURCE_TYPE_COMPATIBILITY.md.

  Frontend UI changes MUST read client/DESIGN.md first and explicitly cite applicable design constraints.

  BUG tracking: docs/bugs/ centralized. E2E-discovered deviations MUST create BUG files (never verbal-only). Before any bug fix, grep docs/bugs/ first. Before any new plan, check open BUGs for overlap.

  Temporary files: MUST go under tmp/ (git-ignored). Forbidden: repo root, client/, server/, docs/, system /tmp, ~/. Exception: BUG evidence PNGs ≤500KB at docs/bugs/assets/<BUG-ID>/.

  Ingestion: payloads at ~/.data-talk/ingestion/<jobId>/payload.<ext>, 500MB cap, staging file then atomic rename. IngestionConfirmedToken in-memory only (5-min TTL). E2E requires SPRING_PROFILES_ACTIVE=e2e (never in production).

rules:
  proposal:
    - Keep it concise (1-2 pages). Focus on WHY not HOW — implementation details belong in design.md.
    - Identify affected code, APIs, dependencies, and systems in the Impact section.
    - If the change touches database/data-source types, MUST consult docs/DATA_SOURCE_TYPE_COMPATIBILITY.md and document compatibility impact.
    - If the change touches client/ UI, MUST reference client/DESIGN.md constraints in a Design Inputs section.
    - Check docs/bugs/index.md for open BUGs in the affected module area — list any that overlap in Risks.

  specs:
    - Use normative language: SHALL/MUST for requirements. Each requirement MUST have at least one scenario.
    - Scenarios MUST use #### Scenario: header (exactly 4 hashtags). Use GIVEN/WHEN/THEN or WHEN/THEN format.
    - Delta operations: ADDED (new), MODIFIED (changed — include FULL updated requirement text), REMOVED (include Reason + Migration), RENAMED (FROM:/TO:).
    - Specs should be testable — each scenario is a potential test case.

  design:
    - Only create design.md when: cross-cutting change, new external dependency, significant data model change, security/performance/migration complexity, or ambiguity needing upfront technical decisions.
    - Must include: Context, Goals/Non-Goals, Decisions (with rationale — why X over Y?), Risks/Trade-offs, Migration Plan, Open Questions.
    - For backend: note whether Flyway migration needed, which modules affected, any sealed interface/switch exhaustiveness impact.
    - For frontend: cite client/DESIGN.md token usage and explicit design constraints.

  tasks:
    - Each task MUST be a checkbox: - [ ] X.Y Task description
    - Group under ## numbered headings. Order by dependency.
    - Tasks should be small enough to complete in one session.
    - Must include verification step: compile/typecheck/test for each task group.
    - Backend tasks: note when mvn install -pl <module> -am -DskipTests is needed (domain/application/infrastructure edits).
    - Frontend tasks: note Design Inputs from client/DESIGN.md where applicable.
    - If change touches database type compatibility, include a checklist item for docs/DATA_SOURCE_TYPE_COMPATIBILITY.md update.
