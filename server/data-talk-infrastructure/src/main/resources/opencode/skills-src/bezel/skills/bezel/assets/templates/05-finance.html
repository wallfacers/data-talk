<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js 'unsafe-inline';
               style-src 'unsafe-inline';
               img-src data: https: blob:;
               font-src https://cdn.jsdelivr.net/ https://fonts.googleapis.com https://fonts.gstatic.com;
               connect-src __BEZEL_SERVER_ORIGIN__;
               frame-ancestors 'self';
               base-uri 'none';
               form-action 'none'">
<meta name="__JSON_HASH__" content="">
<title>财务数据分析中心</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ===== Tokens: base + Monument style + Finance industry ===== */
:root {
  /* Spacing */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-3.5: 14px;
  --sp-4: 16px;
  --sp-6: 24px;
  --sp-8: 32px;

  /* Color RGB channels */
  --bg-rgb: 12, 25, 41;
  --accent-primary-rgb: 201, 168, 76;
  --accent-secondary-rgb: 74, 144, 217;

  /* Bezel color tokens */
  --bezel-bg-app: #0c1929;
  --bezel-accent-primary: #c9a84c;
  --bezel-accent-secondary: #4a90d9;
  --bezel-accent-success: #4caf7a;
  --bezel-accent-danger: #d94a4a;
  --bezel-text-strong: #e2e8f0;
  --bezel-text-muted: #8a96a8;
  --bezel-font-stack: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;

  /* Card tokens */
  --card-radius: 2px;
  --card-bg: rgba(var(--bg-rgb), 0.75);
  --card-border: 2px double rgba(var(--accent-primary-rgb), 0.50);
  --card-shadow: inset 0 0 0 4px var(--bezel-bg-app), inset 0 0 0 5px rgba(var(--accent-primary-rgb), 0.20);
  --card-padding: 16px;
  --card-blur: 0;

  /* Motion tokens */
  --motion-duration: 200ms;
  --motion-easing: linear;
  --motion-ambient: none;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-duration: 0ms;
    --motion-ambient: none;
  }
}

/* ===== Reset ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100vw; height: 100vh; overflow: hidden;
  background: var(--bezel-bg-app);
  font-family: var(--bezel-font-stack);
  color: var(--bezel-text-strong);
}

/* ===== Background texture ===== */
.bg-texture {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 0L20 10L10 20L0 10Z' fill='none' stroke='rgba(255,255,255,0.5)' stroke-width='0.5'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 20px 20px;
}

/* ===== Dashboard layout ===== */
.dashboard {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  padding: 16px;
  gap: 16px;
  align-items: center;
}

/* ===== Header (Title Layer) ===== */
.header {
  text-align: center;
  padding: 8px 0 12px 0;
  flex-shrink: 0;
}
.header h1 {
  font-family: var(--bezel-font-stack);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: var(--bezel-text-strong);
  margin: 0;
}
.header .decorative-line {
  width: 60px;
  height: 2px;
  background: var(--bezel-accent-primary);
  margin: 8px auto 0 auto;
}
.header .clock {
  font-family: var(--bezel-font-stack);
  font-size: 12px;
  color: var(--bezel-text-muted);
  font-variant-numeric: tabular-nums;
  margin-top: 4px;
}

/* ===== KPI row ===== */
.row-kpi {
  display: flex;
  width: 100%;
  gap: 16px;
  justify-content: center;
  flex-shrink: 0;
}
.kpi-frame {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 14px 20px;
  border: 2px double rgba(var(--accent-primary-rgb), 0.40);
  border-radius: 2px;
  background: rgba(var(--bg-rgb), 0.60);
  min-width: 140px;
  position: relative;
  transition: border-color var(--motion-duration) var(--motion-easing);
}
.kpi-frame::after {
  content: '';
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(var(--accent-primary-rgb), 0.15);
  pointer-events: none;
}
.kpi-frame:hover {
  border-color: rgba(var(--accent-primary-rgb), 0.70);
}
.kpi-frame .value {
  font-family: var(--bezel-font-stack);
  font-size: 28px;
  font-weight: 700;
  color: var(--bezel-text-strong);
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.kpi-frame .label {
  font-family: var(--bezel-font-stack);
  font-size: 11px;
  color: var(--bezel-text-muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: center;
  margin-top: 4px;
}
.kpi-frame .delta {
  font-family: var(--bezel-font-stack);
  font-size: 11px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-align: center;
  margin-top: 2px;
}
.kpi-frame .delta.up { color: var(--bezel-accent-success); }
.kpi-frame .delta.down { color: var(--bezel-accent-danger); }

/* ===== Chart rows ===== */
.row-charts-large {
  display: flex;
  width: 100%;
  gap: 16px;
  flex: 1;
  min-height: 0;
}
.row-charts-small {
  display: flex;
  width: 100%;
  gap: 16px;
  flex: 0 0 auto;
  height: 30%;
  min-height: 0;
}
.row-charts-large > *,
.row-charts-small > * {
  flex: 1;
}

/* ===== Card component ===== */
.card {
  background: var(--card-bg);
  border-radius: var(--card-radius);
  border: var(--card-border);
  padding: var(--card-padding);
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: var(--card-shadow);
  min-height: 0;
  transition: border-color var(--motion-duration) var(--motion-easing),
              box-shadow var(--motion-duration) var(--motion-easing);
}
.card::after {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(var(--accent-primary-rgb), 0.15);
  border-radius: 1px;
  pointer-events: none;
}
.card:hover {
  border-color: rgba(var(--accent-primary-rgb), 0.70);
  box-shadow: inset 0 0 0 4px var(--bezel-bg-app), inset 0 0 0 5px rgba(var(--accent-primary-rgb), 0.35);
}

/* ===== Card title ===== */
.card-title {
  font-family: var(--bezel-font-stack);
  font-size: 13px;
  font-weight: 400;
  color: var(--bezel-text-strong);
  text-align: center;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(var(--accent-primary-rgb), 0.25);
  flex-shrink: 0;
}

/* ===== Chart container ===== */
.chart-box {
  flex: 1;
  min-height: 0;
  position: relative;
}
</style>
</head>
<body>
<div class="bg-texture"></div>
<div class="dashboard">
  <!-- ===== TITLE LAYER ===== -->
  <div class="header">
    <h1>财务数据分析中心</h1>
    <div class="decorative-line"></div>
    <div class="clock" id="clock">--</div>
  </div>

  <!-- ===== KPI LAYER ===== -->
  <div class="row-kpi">
    <div class="kpi-frame">
      <div class="label">年度总收入</div>
      <div class="value" data-target="8.42" data-decimal="2" data-suffix="亿">0</div>
      <div class="delta up">&#9650; 15.3%</div>
    </div>
    <div class="kpi-frame">
      <div class="label">净利润</div>
      <div class="value" data-target="1.56" data-decimal="2" data-suffix="亿">0</div>
      <div class="delta up">&#9650; 28.5%</div>
    </div>
    <div class="kpi-frame">
      <div class="label">净利润率</div>
      <div class="value" data-target="18.6" data-decimal="1" data-suffix="%">0</div>
      <div class="delta up">&#9650; 2.1pp</div>
    </div>
    <div class="kpi-frame">
      <div class="label">应收账款</div>
      <div class="value" data-target="1.28" data-decimal="2" data-suffix="亿">0</div>
      <div class="delta down">&#9660; 3.8%</div>
    </div>
    <div class="kpi-frame">
      <div class="label">预算执行率</div>
      <div class="value" data-target="94.2" data-decimal="1" data-suffix="%">0</div>
      <div class="delta up">&#9650; 1.5pp</div>
    </div>
  </div>

  <!-- ===== CHART LAYER: 2 large ===== -->
  <div class="row-charts-large">
    <div class="card">
      <div class="card-title">月度收入与利润趋势</div>
      <div class="chart-box" id="chart-trend"></div>
    </div>
    <div class="card">
      <div class="card-title">收入结构分析</div>
      <div class="chart-box" id="chart-revenue"></div>
    </div>
  </div>

  <!-- ===== CHART LAYER: 4 small ===== -->
  <div class="row-charts-small">
    <div class="card">
      <div class="card-title">费用构成明细</div>
      <div class="chart-box" id="chart-cost"></div>
    </div>
    <div class="card">
      <div class="card-title">资产负债结构</div>
      <div class="chart-box" id="chart-assets"></div>
    </div>
    <div class="card">
      <div class="card-title">应收账款账龄分布</div>
      <div class="chart-box" id="chart-aging"></div>
    </div>
    <div class="card">
      <div class="card-title">预算执行仪表盘</div>
      <div class="chart-box" id="chart-budget"></div>
    </div>
  </div>
</div>

<script>
/* ==================== BEZEL CONFIG ==================== */
window.__BEZEL_CONFIG__ = {
  dashboardId: "05-finance",
  style: "monument",
  defaultIntervalMs: 30000,
  pauseOnHidden: true,
  widgets: [
    { id: "chart-trend", patternId: "finance.monthly-trend", endpoint: "/api/dashboards/05-finance/widgets/chart-trend/data", intervalMs: null, params: {}, paramRefs: [] },
    { id: "chart-revenue", patternId: "finance.revenue-structure", endpoint: "/api/dashboards/05-finance/widgets/chart-revenue/data", intervalMs: null, params: {}, paramRefs: [] },
    { id: "chart-cost", patternId: "finance.cost-breakdown", endpoint: "/api/dashboards/05-finance/widgets/chart-cost/data", intervalMs: null, params: {}, paramRefs: [] },
    { id: "chart-assets", patternId: "finance.asset-liability", endpoint: "/api/dashboards/05-finance/widgets/chart-assets/data", intervalMs: null, params: {}, paramRefs: [] },
    { id: "chart-aging", patternId: "finance.ar-aging", endpoint: "/api/dashboards/05-finance/widgets/chart-aging/data", intervalMs: null, params: {}, paramRefs: [] },
    { id: "chart-budget", patternId: "finance.budget-gauge", endpoint: "/api/dashboards/05-finance/widgets/chart-budget/data", intervalMs: null, params: {}, paramRefs: [] }
  ]
};

/* ==================== POLLING SCHEDULER IIFE ==================== */
(function() {
  var cfg = window.__BEZEL_CONFIG__;
  if (!cfg) return;
  var charts = {};
  var timers = {};
  var paused = false;

  function bindWidget(w) {
    var el = document.getElementById(w.id);
    if (!el) return;
    charts[w.id] = echarts.init(el);
    schedule(w);
  }

  function schedule(w) {
    var interval = w.intervalMs || cfg.defaultIntervalMs || 10000;
    timers[w.id] = setTimeout(function tick() {
      if (paused) { timers[w.id] = setTimeout(tick, interval); return; }
      try {
        fetch(w.endpoint, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ params: w.params || {} })
        }).then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        }).then(function(data) {
          applyWidgetData(w, data);
        }).catch(function(e) {
          parent.postMessage({ type: 'error', widgetId: w.id, message: String(e) }, '*');
        });
      } catch (e) {
        parent.postMessage({ type: 'error', widgetId: w.id, message: String(e) }, '*');
      }
      timers[w.id] = setTimeout(tick, interval);
    }, interval);
  }

  function applyWidgetData(w, data) {
    var ch = charts[w.id];
    if (!ch) return;
    ch.setOption({ dataset: { source: data.rows } }, { lazyUpdate: true });
  }

  if (cfg.pauseOnHidden !== false) {
    document.addEventListener('visibilitychange', function() { paused = document.hidden; });
  }

  window.addEventListener('message', function(ev) {
    var m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'refresh/pause') paused = true;
    if (m.type === 'refresh/resume') paused = false;
    if (m.type === 'params/update') {
      cfg.widgets.forEach(function(w) { w.params = Object.assign({}, w.params || {}, m.params); });
    }
  });

  cfg.widgets.forEach(bindWidget);
  parent.postMessage({ type: 'ready', jsonHash: document.querySelector('meta[name=__JSON_HASH__]') ? document.querySelector('meta[name=__JSON_HASH__]').content : null }, '*');
})();

/* ==================== CLOCK ==================== */
function tickClock() {
  var now = new Date();
  var pad = function(n) { return String(n).padStart(2, '0'); };
  document.getElementById('clock').textContent =
    now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' +
    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
}
setInterval(tickClock, 1000);
tickClock();

/* ==================== KPI COUNT-UP ==================== */
function countUp(el, target, duration) {
  duration = duration || 600;
  var start = 0;
  var startTime = null;
  var suffix = el.dataset.suffix || '';
  var decimal = parseInt(el.dataset.decimal) || 0;
  function tick(ts) {
    if (!startTime) startTime = ts;
    var p = Math.min((ts - startTime) / duration, 1);
    el.textContent = (target * p).toFixed(decimal) + suffix;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
document.querySelectorAll('.kpi-frame .value[data-target]').forEach(function(el) {
  countUp(el, parseFloat(el.dataset.target));
});

/* ==================== ECHARTS COMMON ==================== */
var goldColor = '#c9a84c';
var blueColor = '#4a90d9';
var textMuted = '#8a96a8';
var textStrong = '#e2e8f0';
var fontFamily = "'Noto Serif SC','PingFang SC','Microsoft YaHei',serif";

var commonTooltip = {
  backgroundColor: 'rgba(12,25,41,0.92)',
  borderColor: 'rgba(201,168,76,0.4)',
  textStyle: { color: textStrong, fontSize: 12, fontFamily: fontFamily },
  padding: [8, 12]
};

var allCharts = [];

/* ==================== 1. MONTHLY TREND (BAR + LINE) ==================== */
(function() {
  var ch = echarts.init(document.getElementById('chart-trend'));
  ch.setOption({
    tooltip: Object.assign({}, commonTooltip, {
      trigger: 'axis',
      axisPointer: { type: 'cross' }
    }),
    legend: {
      data: ['收入', '利润率'],
      top: 0, right: 0, itemGap: 12,
      textStyle: { fontSize: 11, color: textMuted, fontFamily: fontFamily }
    },
    grid: { left: 48, right: 48, top: 32, bottom: 20 },
    xAxis: {
      type: 'category',
      data: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
      axisLabel: { fontSize: 10, color: textMuted, fontFamily: fontFamily },
      axisLine: { lineStyle: { color: 'rgba(138,150,168,0.3)' } },
      axisTick: { show: false },
      splitLine: { show: false }
    },
    yAxis: [
      {
        type: 'value', name: '收入(亿)',
        nameTextStyle: { fontSize: 10, color: textMuted },
        axisLabel: { fontSize: 10, color: textMuted },
        axisLine: { show: false }, axisTick: { show: false },
        splitLine: { lineStyle: { type: 'dashed', color: 'rgba(138,150,168,0.1)' } }
      },
      {
        type: 'value', name: '利润率(%)',
        nameTextStyle: { fontSize: 10, color: textMuted },
        axisLabel: { fontSize: 10, color: textMuted, formatter: '{value}%' },
        axisLine: { show: false }, axisTick: { show: false },
        splitLine: { show: false }
      }
    ],
    series: [
      {
        name: '收入', type: 'bar', barWidth: '50%',
        itemStyle: { color: goldColor, borderRadius: 0 },
        emphasis: { itemStyle: { color: blueColor } },
        label: { show: true, position: 'top', fontSize: 9, fontFamily: fontFamily, color: textMuted },
        data: [0.52,0.48,0.61,0.58,0.72,0.69,0.75,0.82,0.79,0.88,0.85,0.73]
      },
      {
        name: '利润率', type: 'line', yAxisIndex: 1,
        smooth: false, symbol: 'circle', symbolSize: 6, showSymbol: true,
        lineStyle: { width: 2, color: blueColor },
        itemStyle: { color: blueColor, borderWidth: 2, borderColor: '#0c1929' },
        areaStyle: null,
        data: [14.2,13.8,16.5,15.1,18.3,17.5,18.8,19.2,18.6,20.1,19.5,18.0]
      }
    ]
  });
  allCharts.push(ch);
})();

/* ==================== 2. REVENUE STRUCTURE (DONUT PIE) ==================== */
(function() {
  var ch = echarts.init(document.getElementById('chart-revenue'));
  ch.setOption({
    tooltip: Object.assign({}, commonTooltip, {
      trigger: 'item', formatter: '{b}: {c}亿 ({d}%)'
    }),
    legend: {
      orient: 'vertical', right: 0, top: 'middle', itemGap: 8,
      textStyle: { fontSize: 11, color: textMuted, fontFamily: fontFamily }
    },
    series: [{
      type: 'pie', radius: ['42%','68%'], center: ['38%','50%'],
      label: { show: true, color: textStrong, fontSize: 11, fontFamily: fontFamily, formatter: '{b}\n{d}%' },
      labelLine: { lineStyle: { color: 'rgba(138,150,168,0.4)' } },
      itemStyle: { borderColor: '#0c1929', borderWidth: 2, borderRadius: 0 },
      data: [
        { value: 7.12, name: '主营业务', itemStyle: { color: goldColor } },
        { value: 0.98, name: '投资收益', itemStyle: { color: blueColor } },
        { value: 0.32, name: '其他收入', itemStyle: { color: '#1e3a5f' } }
      ]
    }]
  });
  allCharts.push(ch);
})();

/* ==================== 3. COST BREAKDOWN (HORIZONTAL BAR) ==================== */
(function() {
  var ch = echarts.init(document.getElementById('chart-cost'));
  var categories = ['财务费用','研发费用','管理费用','销售费用'];
  var values = [0.12, 0.35, 0.38, 0.42];
  var colors = ['#1e3a5f', blueColor, '#8a6e2f', goldColor];
  ch.setOption({
    tooltip: Object.assign({}, commonTooltip, {
      trigger: 'axis', axisPointer: { type: 'shadow' },
      formatter: function(params) {
        var p = params[0];
        return p.name + '<br/>' + p.value + '亿';
      }
    }),
    grid: { left: 70, right: 40, top: 8, bottom: 12 },
    xAxis: {
      type: 'value',
      axisLabel: { fontSize: 10, color: textMuted, fontFamily: fontFamily },
      axisLine: { show: false }, axisTick: { show: false },
      splitLine: { lineStyle: { type: 'dashed', color: 'rgba(138,150,168,0.1)' } }
    },
    yAxis: {
      type: 'category', data: categories,
      axisLabel: { fontSize: 11, color: textMuted, fontFamily: fontFamily },
      axisLine: { lineStyle: { color: 'rgba(138,150,168,0.3)' } },
      axisTick: { show: false }
    },
    series: [{
      type: 'bar', barWidth: '55%',
      data: categories.map(function(name, i) {
        return { value: values[i], itemStyle: { color: colors[i], borderRadius: 0 } };
      }),
      label: { show: true, position: 'right', color: textStrong, fontSize: 10, fontFamily: fontFamily, formatter: '{c}亿' }
    }]
  });
  allCharts.push(ch);
})();

/* ==================== 4. ASSET LIABILITY (STACKED BAR) ==================== */
(function() {
  var ch = echarts.init(document.getElementById('chart-assets'));
  ch.setOption({
    tooltip: Object.assign({}, commonTooltip, {
      trigger: 'axis', axisPointer: { type: 'shadow' }
    }),
    legend: {
      data: ['流动资产','非流动资产','流动负债','非流动负债','所有者权益'],
      top: 0, right: 0, itemGap: 6,
      textStyle: { fontSize: 9, color: textMuted, fontFamily: fontFamily }
    },
    grid: { left: 40, right: 10, top: 30, bottom: 16 },
    xAxis: {
      type: 'category', data: ['Q1','Q2','Q3','Q4'],
      axisLabel: { fontSize: 10, color: textMuted, fontFamily: fontFamily },
      axisLine: { lineStyle: { color: 'rgba(138,150,168,0.3)' } },
      axisTick: { show: false }, splitLine: { show: false }
    },
    yAxis: {
      type: 'value', name: '亿',
      nameTextStyle: { fontSize: 10, color: textMuted },
      axisLabel: { fontSize: 10, color: textMuted },
      axisLine: { show: false }, axisTick: { show: false },
      splitLine: { lineStyle: { type: 'dashed', color: 'rgba(138,150,168,0.1)' } }
    },
    series: [
      { name: '流动资产', type: 'bar', stack: 'assets', itemStyle: { color: goldColor, borderRadius: 0 }, data: [4.2,4.5,4.7,4.8] },
      { name: '非流动资产', type: 'bar', stack: 'assets', itemStyle: { color: '#e8d5a3', borderRadius: 0 }, data: [5.1,5.3,5.4,5.5] },
      { name: '流动负债', type: 'bar', stack: 'liab', itemStyle: { color: '#d94a4a', borderRadius: 0 }, data: [2.8,2.9,3.0,3.1] },
