<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>能源环保监控中心</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #0a1f14;
    color: #e8f5e9;
  }

  /* ===== 波浪背景 ===== */
  .wave-bg {
    position: fixed; bottom: 0; left: 0; width: 100%; height: 180px;
    z-index: 0; pointer-events: none; opacity: 0.25;
  }
  .wave-bg svg {
    width: 100%; height: 100%; display: block;
  }
  .wave-bg path {
    fill: #22c55e;
    animation: waveMove 8s ease-in-out infinite alternate;
  }
  @keyframes waveMove {
    0%   { transform: translateX(-20px) translateY(0); }
    100% { transform: translateX(20px) translateY(-10px); }
  }

  /* ===== 顶层容器 ===== */
  .dashboard {
    position: relative; z-index: 1;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    padding: 12px 16px;
    gap: 10px;
  }

  /* ===== 头部 ===== */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .header-title {
    font-size: 22px; font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #22c55e, #0ea5e9);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header-clock {
    font-size: 14px; color: #94a3b8; font-variant-numeric: tabular-nums;
  }

  /* ===== KPI 行 ===== */
  .kpi-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    flex-shrink: 0;
  }
  .kpi-card {
    background: rgba(34, 197, 94, 0.06);
    border: 1px solid rgba(34, 197, 94, 0.18);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex; align-items: center; gap: 14px;
    transition: border-color .3s, background .3s;
  }
  .kpi-card:hover {
    border-color: rgba(34, 197, 94, 0.35);
    background: rgba(34, 197, 94, 0.10);
  }
  .kpi-icon {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .kpi-icon.leaf { background: rgba(34,197,94,0.15); color: #22c55e; }
  .kpi-icon.drop  { background: rgba(14,165,233,0.15); color: #0ea5e9; }
  .kpi-icon.sun   { background: rgba(245,158,11,0.15); color: #f59e0b; }
  .kpi-icon.star  { background: rgba(168,85,247,0.15); color: #a855f7; }

  .kpi-info { flex: 1; }
  .kpi-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
  .kpi-value { font-size: 22px; font-weight: 700; color: #f0fdf4; }
  .kpi-trend {
    font-size: 12px; font-weight: 600; margin-top: 2px;
    display: flex; align-items: center; gap: 4px;
  }
  .trend-up   { color: #22c55e; }
  .trend-down { color: #f87171; }

  /* ===== 主体 3 列 ===== */
  .main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1.05fr 1fr 1.05fr; gap: 12px;
  }
  .panel {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .panel-title {
    font-size: 13px; font-weight: 600; color: #e2e8f0;
    margin-bottom: 6px; padding-left: 6px;
    border-left: 3px solid #22c55e;
    flex-shrink: 0;
  }
  .panel-title.blue { border-left-color: #0ea5e9; }
  .panel-title.yellow { border-left-color: #f59e0b; }
  .chart-box { flex: 1; min-height: 0; position: relative; }

  /* ===== 能源流拓扑 ===== */
  .flow-wrap {
    display: flex; align-items: center; justify-content: center;
    gap: 0; padding: 10px 0;
  }
  .flow-node {
    width: 72px; height: 72px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: #fff;
    border: 2px solid rgba(255,255,255,0.15);
    background: radial-gradient(circle at 30% 30%, rgba(34,197,94,0.25), rgba(10,31,20,0.9));
    box-shadow: 0 0 18px rgba(34,197,94,0.12);
    position: relative; z-index: 2; flex-shrink: 0;
  }
  .flow-node .flow-label { font-size: 10px; color: #cbd5e1; margin-top: 2px; font-weight: 400; }
  .flow-connector {
    position: relative; width: 60px; height: 2px; background: rgba(34,197,94,0.25);
    overflow: hidden; flex-shrink: 0;
  }
  .flow-connector::after {
    content: '';
    position: absolute; top: 0; left: -40px; width: 40px; height: 100%;
    background: linear-gradient(90deg, transparent, #22c55e, transparent);
    animation: flowMove 2s linear infinite;
  }
  @keyframes flowMove {
    0%   { left: -40px; }
    100% { left: 100%; }
  }

  /* ===== 底部 ===== */
  .bottom {
    flex-shrink: 0;
    display: grid; grid-template-columns: 1.6fr 1fr; gap: 12px; height: 170px;
  }
  .gauge-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .gauge-cell { display: flex; flex-direction: column; align-items: center; }
  .gauge-cell .g-label { font-size: 11px; color: #94a3b8; margin-top: 4px; }

  /* ===== 时间轴 ===== */
  .timeline-wrap { overflow-y: auto; padding-right: 4px; }
  .timeline-wrap::-webkit-scrollbar { width: 4px; }
  .timeline-wrap::-webkit-scrollbar-thumb { background: rgba(34,197,94,0.3); border-radius: 2px; }
  .tl-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .tl-dot {
    width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex-shrink: 0;
    box-shadow: 0 0 6px currentColor;
  }
  .tl-dot.red    { background: #ef4444; color: #ef4444; }
  .tl-dot.orange { background: #f97316; color: #f97316; }
  .tl-dot.yellow { background: #eab308; color: #eab308; }
  .tl-time { font-size: 11px; color: #64748b; width: 72px; flex-shrink: 0; }
  .tl-text { font-size: 12px; color: #e2e8f0; line-height: 1.4; }

  /* ===== 数据故事条 ===== */
  .story-bar {
    flex-shrink: 0;
    background: rgba(34,197,94,0.08);
    border: 1px solid rgba(34,197,94,0.15);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px; color: #bbf7d0;
    display: flex; align-items: center; gap: 10px;
  }
  .story-bar .tag {
    background: rgba(34,197,94,0.2); color: #22c55e;
    font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600;
  }
  .story-bar .warn { color: #f87171; }
</style>
</head>
<body>

<!-- 波浪背景 -->
<div class="wave-bg">
  <svg viewBox="0 0 1440 180" preserveAspectRatio="none">
    <path d="M0,120 C240,60 480,160 720,100 C960,40 1200,140 1440,80 L1440,180 L0,180 Z"/>
  </svg>
</div>

<div class="dashboard">
  <!-- 头部 -->
  <div class="header">
    <div class="header-title">能源环保监控中心</div>
    <div class="header-clock" id="clock">--</div>
  </div>

  <!-- 数据故事 -->
  <div class="story-bar">
    <span class="tag">数据洞察</span>
    <span>清洁能源占比升至 <strong>42%</strong>（▲5pp），碳排放同比下降 <strong>8%</strong>，<span class="warn">2 个工厂超标</span>需关注。</span>
  </div>

  <!-- KPI -->
  <div class="kpi-row">
    <div class="kpi-card">
      <div class="kpi-icon leaf">&#127807;</div>
      <div class="kpi-info">
        <div class="kpi-label">总能耗</div>
        <div class="kpi-value" data-target="28470000" data-suffix="万 kWh" data-divide="10000">0</div>
        <div class="kpi-trend trend-up">▲ 3.2%</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon drop">&#128167;</div>
      <div class="kpi-info">
        <div class="kpi-label">碳排放</div>
        <div class="kpi-value" data-target="1256" data-suffix=" 吨 CO₂">0</div>
        <div class="kpi-trend trend-down">▼ 8%</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon sun">&#9728;&#65039;</div>
      <div class="kpi-info">
        <div class="kpi-label">清洁能源占比</div>
        <div class="kpi-value" data-target="42" data-suffix="%">0</div>
        <div class="kpi-trend trend-up">▲ 5pp</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon star">&#11088;</div>
      <div class="kpi-info">
        <div class="kpi-label">环保评分</div>
        <div class="kpi-value" data-target="87" data-suffix="">0</div>
        <div class="kpi-trend trend-up">▲ 3</div>
      </div>
    </div>
  </div>

  <!-- 主体 -->
  <div class="main">
    <!-- 左列 -->
    <div class="col" style="display:flex;flex-direction:column;gap:10px;">
      <div class="panel" style="flex:1.2;">
        <div class="panel-title">能耗趋势</div>
        <div class="chart-box" id="chart-trend"></div>
      </div>
      <div class="panel" style="flex:1;">
        <div class="panel-title blue">各工厂能耗对比</div>
        <div class="chart-box" id="chart-factory"></div>
      </div>
    </div>

    <!-- 中列 -->
    <div class="col" style="display:flex;flex-direction:column;gap:10px;">
      <div class="panel" style="flex:0 0 110px;">
        <div class="panel-title yellow">能源流拓扑</div>
        <div class="flow-wrap">
          <div class="flow-node">发电<div class="flow-label">Plant</div></div>
          <div class="flow-connector"></div>
          <div class="flow-node">传输<div class="flow-label">Grid</div></div>
          <div class="flow-connector"></div>
          <div class="flow-node">分配<div class="flow-label">Dist</div></div>
          <div class="flow-connector"></div>
          <div class="flow-node">消耗<div class="flow-label">Load</div></div>
        </div>
      </div>
      <div class="panel" style="flex:1.3;">
        <div class="panel-title">能源类型占比</div>
        <div class="chart-box" id="chart-pie"></div>
      </div>
      <div class="panel" style="flex:1;">
        <div class="panel-title blue">节能减排目标达成追踪</div>
        <div class="chart-box" id="chart-target"></div>
      </div>
    </div>

    <!-- 右列 -->
    <div class="col" style="display:flex;flex-direction:column;gap:10px;">
      <div class="panel" style="flex:1;">
        <div class="panel-title">碳排放趋势</div>
        <div class="chart-box" id="chart-carbon"></div>
      </div>
      <div class="panel" style="flex:1;">
        <div class="panel-title yellow">空气质量指数 (AQI)</div>
        <div class="chart-box" id="chart-aqi"></div>
      </div>
    </div>
  </div>

  <!-- 底部 -->
  <div class="bottom">
    <div class="panel">
      <div class="panel-title">环保指标达标率</div>
      <div class="gauge-row" id="gauge-row"></div>
    </div>
    <div class="panel">
      <div class="panel-title">异常排放事件时间轴</div>
      <div class="timeline-wrap" id="timeline"></div>
    </div>
  </div>
</div>

<script>
/* ================= 工具 ================= */
const $ = id => document.getElementById(id);

function formatNum(n) {
  return n.toLocaleString('zh-CN');
}

/* ================= 时钟 ================= */
function updateClock() {
  const now = new Date();
  $('clock').textContent = now.toLocaleString('zh-CN', {
    year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  });
}
setInterval(updateClock, 1000);
updateClock();

/* ================= KPI 滚动动画 ================= */
function animateKPI(el) {
  const target = +el.dataset.target;
  const suffix = el.dataset.suffix || '';
  const divide = +el.dataset.divide || 1;
  const duration = 1500;
  const start = performance.now();
  function step(now) {
    const p = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - p, 3);
    const val = target * ease;
    const display = divide > 1 ? (val / divide).toFixed(0) : (Number.isInteger(target) ? Math.round(val).toLocaleString('zh-CN') : val.toFixed(1));
    el.textContent = display + suffix;
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
document.querySelectorAll('.kpi-value').forEach(animateKPI);

/* ================= ECharts 暗色主题 ================= */
const darkTheme = {
  backgroundColor: 'transparent',
  textStyle: { color: '#cbd5e1' },
  title: { textStyle: { color: '#e2e8f0' } },
  legend: { textStyle: { color: '#94a3b8' } },
  tooltip: {
    backgroundColor: 'rgba(10,31,20,0.95)',
    borderColor: 'rgba(34,197,94,0.3)',
    textStyle: { color: '#e2e8f0' }
  },
  grid: { borderColor: 'rgba(255,255,255,0.06)' },
  categoryAxis: {
    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
    axisLabel: { color: '#94a3b8' },
    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.04)' } }
  },
  valueAxis: {
    axisLine: { lineStyle: { color: 'rgba(255,255,255,0.1)' } },
    axisLabel: { color: '#94a3b8' },
    splitLine: { lineStyle: { color: 'rgba(255,255,255,0.04)' } }
  }
};

/* ================= 图表 1: 能耗趋势 (堆叠面积) ================= */
const chartTrend = echarts.init($('chart-trend'));
const months = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
chartTrend.setOption({
  ...darkTheme,
  tooltip: { trigger: 'axis', ...darkTheme.tooltip },
  legend: { data: ['火电','水电','风电','光伏','核电'], bottom: 0, textStyle: { fontSize: 11 } },
  grid: { left: 10, right: 10, top: 10, bottom: 28, containLabel: true },
  xAxis: { type: 'category', boundaryGap: false, data: months },
  yAxis: { type: 'value', name: '万kWh', nameTextStyle: { color: '#64748b', fontSize: 11 } },
  series: [
    { name: '火电', type: 'line', stack: 'Total', areaStyle: {}, smooth: true, data: [420,380,350,300,280,260,290,310,340,370,400,430], itemStyle: { color: '#64748b' } },
    { name: '水电', type: 'line', stack: 'Total', areaStyle: {}, smooth: true, data: [180,190,220,260,300,350,380,360,320,280,220,190], itemStyle: { color: '#0ea5e9' } },
    { name: '风电', type: 'line', stack: 'Total', areaStyle: {}, smooth: true, data: [80,90,110,140,170,200,220,210,180,150,110,90], itemStyle: { color: '#22c55e' } },
    { name: '光伏', type: 'line', stack: 'Total', areaStyle: {}, smooth: true, data: [40,55,80,120,160,200,240,230,190,140,90,50], itemStyle: { color: '#f59e0b' } },
    { name: '核电', type: 'line', stack: 'Total', areaStyle: {}, smooth: true, data: [100,100,100,100,100,100,100,100,100,100,100,100], itemStyle: { color: '#a855f7' } }
  ]
});

/* ================= 图表 2: 工厂能耗对比 (横向条形) ================= */
const chartFactory = echarts.init($('chart-factory'));
chartFactory.setOption({
  ...darkTheme,
  tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, ...darkTheme.tooltip },
  grid: { left: 10, right: 24, top: 10, bottom: 10, containLabel: true },
  xAxis: { type: 'value', name: '万kWh', nameTextStyle: { color: '#64748b', fontSize: 11 } },
  yAxis: { type: 'category', data: ['E工厂','D工厂','C工厂','B工厂','A工厂'], axisLabel: { fontSize: 11 } },
  series: [{
    type: 'bar', data: [
      { value: 320, itemStyle: { color: '#22c55e' } },
      { value: 450, itemStyle: { color: '#0ea5e9' } },
      { value: 580, itemStyle: { color: '#f59e0b' } },
      { value: 720, itemStyle: { color: '#ef4444' } },
      { value: 610, itemStyle: { color: '#a855f7' } }
    ],
    barWidth: 14, label: { show: true, position: 'right', color: '#cbd5e1', fontSize: 11 }
  }]
});

/* ================= 图表 3: 碳排放趋势 (折线+目标线) ================= */
const chartCarbon = echarts.init($('chart-carbon'));
chartCarbon.setOption({
  ...darkTheme,
  tooltip: { trigger: 'axis', ...darkTheme.tooltip },
  legend: { data: ['实际排放','目标线'], bottom: 0, textStyle: { fontSize: 11 } },
  grid: { left: 10, right: 10, top: 10, bottom: 28, containLabel: true },
  xAxis: { type: 'category', data: months },
  yAxis: { type: 'value', name: '吨CO₂', nameTextStyle: { color: '#64748b', fontSize: 11 } },
  series: [
    { name: '实际排放', type: 'line', smooth: true, data: [145,138,132,125,118,110,108,112,120,128,135,142], itemStyle: { color: '#ef4444' }, areaStyle: { color: 'rgba(239,68,68,0.1)' } },
    { name: '目标线', type: 'line', smooth: false, symbol: 'none', lineStyle: { type: 'dashed', color: '#22c55e', width: 2 }, data: [140,135,130,125,120,115,110,105,100,95,90,85], markLine: { silent: true, symbol: 'none', lineStyle: { type: 'dashed', color: '#22c55e' }, data: [{ type: 'average', name: '平均目标' }] } }
  ]
});

/* ================= 图表 4: 能源类型占比 (动态饼图) ================= */
const chartPie = echarts.init($('chart-pie'));
chartPie.setOption({
  ...darkTheme,
  tooltip: { trigger: 'item', ...darkTheme.tooltip },
  legend: { orient: 'vertical', right: 10, top: 'center', textStyle: { fontSize: 11 } },
  series: [{
    type: 'pie', radius: ['38%', '65%'], center: ['38%', '50%'],
    animationType: 'scale', animationEasing: 'elasticOut', animationDelay: idx => idx * 120,
    label: { show: true, color: '#e2e8f0', formatter: '{b}\n{d}%' },
    labelLine: { lineStyle: { color: 'rgba(255,255,255,0.2)' } },
    data: [
      { value: 35, name: '火电', itemStyle: { color: '#64748b' } },
      { value: 22, name: '水电', itemStyle: { color: '#0ea5e9' } },
      { value: 15, name: '风电', itemStyle: { color: '#22c55e' } },
      { value: 13, name: '光伏', itemStyle: { color: '#f59e0b' } },
      { value: 15, name: '核电', itemStyle: { color: '#a855f7' } }
    ]
  }]
});

/* ================= 图表 5: 节能减排目标达成追踪 ================= */
const chartTarget = echarts.init($('chart-target'));
chartTarget.setOption({
  ...darkTheme,
  tooltip: { trigger: 'axis', ...darkTheme.tooltip },
  legend: { data: ['实际值','目标值'], bottom: 0, textStyle: { fontSize: 11 } },
  grid: { left: 10, right: 10, top: 10, bottom: 28, containLabel: true },
  xAxis: { type: 'category', data: ['Q1','Q2','Q3','Q4'] },
  yAxis: { type: 'value', name: '完成率%', max: 120, nameTextStyle: { color: '#64748b', fontSize: 11 } },
  series: [
    { name: '实际值', type: 'line', smooth: true, data: [92, 88, 95, 87], itemStyle: { color: '#0ea5e9' }, areaStyle: { color: 'rgba(14,165,233,0.12)' } },
    { name: '目标值', type: 'line', symbol: 'none', lineStyle: { type: 'dashed', color: '#22c55e' }, data: [90, 90, 90, 90] }
  ]
});

/* ================= 图表 6: AQI 热力图 ================= */
const chartAqi = echarts.init($('chart-aqi'));
const aqiPoints = ['监测点A','监测点B','监测点C','监测点D','监测点E','监测点F'];
const aqiHours = ['00','04','08','12','16','20'];
const aqiData = [];
for (let i = 0; i < aqiPoints.length; i++) {
  for (let j = 0; j < aqiHours.length; j++) {
    aqiData.push([j, i, Math.round(30 + Math.random() * 90)]);
  }
}
chartAqi.setOption({
  ...darkTheme,
  tooltip: { position: 'top', ...darkTheme.tooltip },
  grid: { left: 10, right: 10, top: 10, bottom: 10, containLabel: true },
  xAxis: { type: 'category', data: aqiHours, splitArea: { show: true, areaStyle: { color: ['rgba(255,255,255,0.02)','rgba(255,255,255,0.04)'] } } },
  yAxis: { type: 'category', data: aqiPoints, splitArea: { show: true } },
  visualMap: {
    min: 0, max: 150, calculable: false,
    orient: 'horizontal', left: 'center', bottom: 0, itemWidth: 10, itemHeight: 80,
    inRange: { color: ['#22c55e','#f59e0b','#ef4444'] },
    textStyle: { color: '#94a3b8', fontSize: 10 }
  },
  series: [{
    type: 'heatmap', data: aqiData, label: { show: true, fontSize: 10, color: '#fff' },
    itemStyle: { borderColor: '#0a1f14', borderWidth: 2 }
  }]
});

/* ================= 图表 7~10: 4 个小型仪表盘 ================= */
const gaugeNames = ['排放达标率','能耗达标率','水耗达标率','固废达标率'];
const gaugeValues = [92, 87, 95, 78];
const gaugeColors = ['#22c55e','#0ea5e9','#f59e0b','#ef4444'];
const gaugeRow = $('gauge-row');
const gaugeCharts = [];

gaugeNames.forEach((name, i) => {
  const cell = document.createElement('div');
  cell.className = 'gauge-cell';
  const box = document.createElement('div');
  box.style.cssText = 'width:100%;height:110px;';
  const label = document.createElement('div');
  label.className = 'g-label';
  label.textContent = name;
  cell.appendChild(box);
  cell.appendChild(label);
  gaugeRow.appendChild(cell);

  const g = echarts.init(box);
  g.setOption({
    ...darkTheme,
    series: [{
      type: 'gauge', radius: '90%',
      startAngle: 210, endAngle: -30,
      min: 0, max: 100,
      splitNumber: 5,
      axisLine: { lineStyle: { width: 8, color: [[gaugeValues[i]/100, gaugeColors[i]], [1, 'rgba(255,255,255,0.08)']] } },
      pointer: { length: '50%', width: 3, itemStyle: { color: gaugeColors[i] } },
      axisTick: { distance: -10, length: 4, lineStyle: { color: 'rgba(255,255,255,0.15)' } },
      splitLine: { distance: -10, length: 8, lineStyle: { color: 'rgba(255,255,255,0.15)' } },
      axisLabel: { distance: 14, color: '#94a3b8', fontSize: 9 },
      detail: { valueAnimation: true, fontSize: 18, fontWeight: 700, color: gaugeColors[i], offsetCenter: [0, '60%'], formatter: '{value}%' },
      data: [{ value: gaugeValues[i] }]
    }]
  });
  gaugeCharts.push(g);
});

/* ================= Resize 监听 ================= */
const allCharts = [chartTrend, chartFactory, chartCarbon, chartPie, chartTarget, chartAqi, ...gaugeCharts];
