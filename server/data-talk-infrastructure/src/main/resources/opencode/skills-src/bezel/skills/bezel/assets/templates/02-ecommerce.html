<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商运营实时监控中心</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: #0d0a07;
    font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #e0e8f0;
  }

  /* 粒子背景 */
  #particles {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }

  /* 顶部栏 */
  .topbar {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    height: 72px; padding: 0 24px;
    background: rgba(20,14,10,0.6);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,68,68,0.25);
  }
  .logo { display: flex; flex-direction: column; gap: 2px; }
  .logo h1 { font-size: 22px; font-weight: 700; color: #ffc107; letter-spacing: 2px; }
  .logo span { font-size: 11px; color: #ff6b35; letter-spacing: 1px; text-transform: uppercase; }

  .kpi-row {
    display: flex; gap: 16px; align-items: center;
  }
  .kpi-pill {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 140px; height: 52px; padding: 0 18px;
    background: rgba(255,68,68,0.08);
    border: 1px solid rgba(255,68,68,0.35);
    border-radius: 28px;
    backdrop-filter: blur(8px);
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .kpi-pill:hover { transform: scale(1.05); border-color: #ff4444; box-shadow: 0 0 14px rgba(255,68,68,0.35); }
  .kpi-pill .label { font-size: 11px; color: #8899aa; margin-bottom: 2px; }
  .kpi-pill .value { font-size: 20px; font-weight: 700; color: #ffc107; font-variant-numeric: tabular-nums; }
  .kpi-pill .value.big { font-size: 28px; color: #ff4444; }
  .kpi-pill .trend { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .trend.up { color: #ff4444; }
  .trend.down { color: #00e676; }

  .clock {
    font-size: 15px; font-weight: 600; color: #ffc107;
    font-variant-numeric: tabular-nums; letter-spacing: 1px;
    min-width: 170px; text-align: right;
  }

  /* 主体 */
  .main {
    position: relative; z-index: 5;
    display: flex; gap: 16px;
    height: calc(100vh - 72px - 56px);
    padding: 16px 16px 0 16px;
  }
  .col-left {
    width: 38%; display: flex; flex-direction: column; gap: 14px;
  }
  .col-right {
    width: 62%; display: flex; flex-direction: column; gap: 14px;
  }
  .row { display: flex; gap: 14px; flex: 1; min-height: 0; }
  .row.half { flex: 1.15; }

  /* 卡片 */
  .card {
    flex: 1; min-width: 0; min-height: 0;
    background: rgba(30,20,14,0.55);
    border: 1px solid rgba(255,68,68,0.18);
    border-radius: 12px;
    backdrop-filter: blur(12px);
    padding: 12px 14px;
    display: flex; flex-direction: column;
    transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
  }
  .card:hover { transform: scale(1.02); border-color: rgba(255,68,68,0.55); box-shadow: 0 0 18px rgba(255,68,68,0.15); }
  .card-title {
    font-size: 13px; font-weight: 700; color: #ffc107;
    margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
    letter-spacing: 1px;
  }
  .card-title::before {
    content: ''; display: inline-block; width: 4px; height: 14px;
    background: linear-gradient(180deg, #ff4444, #ff6b35); border-radius: 2px;
  }
  .card-body { flex: 1; min-height: 0; position: relative; }

  /* 漏斗 */
  .funnel-wrap { display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 100%; padding: 0 4px; }
  .funnel-step {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .funnel-bar {
    width: 100%; border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff; font-weight: 700;
    font-size: 13px; padding: 8px 4px; text-align: center; line-height: 1.3;
    background: linear-gradient(135deg, rgba(255,68,68,0.85), rgba(255,107,53,0.85));
    box-shadow: 0 4px 14px rgba(255,68,68,0.25);
    transition: transform .25s ease;
  }
  .funnel-bar:hover { transform: translateY(-4px); }
  .funnel-bar small { font-size: 10px; font-weight: 400; opacity: .9; }
  .funnel-arrow {
    display: flex; flex-direction: column; align-items: center; color: #ff6b35;
    font-size: 11px; font-weight: 600; min-width: 44px; text-align: center;
  }
  .funnel-arrow .arr { font-size: 16px; color: #ff4444; }

  /* 跑马灯 */
  .marquee-bar {
    position: relative; z-index: 10;
    height: 56px; display: flex; align-items: center;
    background: rgba(20,14,10,0.7);
    border-top: 1px solid rgba(255,68,68,0.25);
    overflow: hidden;
  }
  .marquee-track {
    display: flex; white-space: nowrap;
    animation: marquee 25s linear infinite;
  }
  .marquee-item {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0 28px; font-size: 13px; color: #e0e8f0;
  }
  .marquee-item .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #ff4444;
    box-shadow: 0 0 6px #ff4444; animation: pulse 1.2s ease-in-out infinite;
  }
  .marquee-item .time { color: #8899aa; font-size: 11px; }
  .marquee-item .name { color: #ffc107; font-weight: 600; }
  .marquee-item .amount { color: #ff6b35; font-weight: 700; font-variant-numeric: tabular-nums; }
  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .4; transform: scale(.6); }
  }
</style>
</head>

<script>
/* ================= 粒子背景 ================= */
(function() {
  const c = document.getElementById('particles');
  const ctx = c.getContext('2d');
  let W, H, particles = [];
  function resize() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 2 + 0.5,
      vy: -(Math.random() * 0.6 + 0.2),
      alpha: Math.random() * 0.5 + 0.1,
      color: Math.random() > 0.5 ? '255,68,68' : '255,193,7'
    });
  }
  function draw() {
    ctx.clearRect(0,0,W,H);
    particles.forEach(p => {
      p.y += p.vy;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ================= 时钟 ================= */
function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
}
setInterval(updateClock, 1000);
updateClock();

/* ================= KPI 滚动动画 ================= */
function animateKPI(el) {
  const target = parseFloat(el.dataset.target);
  const suffix = el.dataset.suffix || '';
  const isFloat = String(el.dataset.target).includes('.');
  const duration = 1500;
  const start = performance.now();
  function step(now) {
    const t = Math.min((now - start) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3);
    const val = target * ease;
    el.textContent = (isFloat ? val.toFixed(1) : Math.round(val).toLocaleString()) + suffix;
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
document.querySelectorAll('.kpi-pill .value').forEach(animateKPI);

/* ================= 跑马灯 ================= */
const orders = [

  {t:'14:29:55',n:'雅诗兰黛小棕瓶',a:'¥935'},
];
function buildMarquee() {

}

/* ================= ECharts 暗色通用配置 ================= */

};

/* 3. 地图 */

      {name:'河北',value:8200},{name:'陕西',value:7500},{name:'重庆',value:7100},{name:'辽宁',value:6400},
      {name:'云南',value:5800},{name:'江西',value:5200},{name:'广西',value:4800},{name:'山西',value:4200},
      {name:'吉林',value:3600},{name:'贵州',value:3400},{name:'甘肃',value:2800},{name:'内蒙古',value:2600},
      {name:'新疆',value:2200},{name:'海南',value:1900},{name:'宁夏',value:1200},{name:'青海',value:900},

/* 4. GMV 趋势 & 订单量 */
const chartTrend = echarts.init(document.getElementById('chart-trend'));
const hours = Array.from({length:24},(_,i)=>`${String(i).padStart(2,'0')}:00`);
const gmvData = [45,38,32,28,25,30,42,68,95,128,156,182,210,195,178,165,188,215,245,268,285,240,180,120];
const orderData = [1.2,1.0,0.8,0.7,0.6,0.9,1.5,2.8,4.2,6.1,7.8,9.5,11.2,10.5,9.2,8.5,9.8,11.5,13.2,14.8,15.6,12.8,9.2,6.1];

/* 5. 留存 Cohort */

const cohortDays = ['Day 0','Day 1','Day 3','Day 7','Day 14','Day 30'];

const cohortRaw = [
  [100,45,35,28,22,18],
  [100,46,36,29,23,19],
  [100,44,34,27,21,17],
  [100,47,37,30,24,20],
  [100,43,33,26,20,16],
  [100,48,38,31,25,21],
  [100,45,35,28,22,18],
];
const cohortData = [];
for (let i=0;i<cohortDates.length;i++)
  for (let j=0;j<cohortDays.length;j++)
    cohortData.push([i, j, cohortRaw[i][j]]);
chartCohort.setOption({
  tooltip: { ...commonTooltip, formatter: p => `${cohortDates[p.value[0]]} ${cohortDays[p.value[1]]}<br/>留存率: ${p.value[2]}%` },
  grid: { left: 52, right: 8, top: 8, bottom: 28 },
  xAxis: { type:'category', data:cohortDates, axisLabel:{color:darkSub,fontSize:10}, axisLine:{lineStyle:{color:'rgba(136,153,170,0.2)'}}, axisTick:{show:false} },
  yAxis: { type:'category', data:cohortDays, axisLabel:{color:darkSub,fontSize:10}, axisLine:{show:false}, axisTick:{show:false}, splitLine:{show:false} },
  visualMap: {
    min:0, max:100, show:false,
    inRange:{ color: ['#1a0f0a','#3e1a12','#7a2e1e','#b83e28','#e05038','#ff4444','#ff6b35','#ffc107'] }
  },
  series: [{
    type:'heatmap', data:cohortData, label:{show:true,color:'#fff',fontSize:10,formatter:p=>p.value[2]+'%'},
    itemStyle:{borderColor:'#0d0a07',borderWidth:2,borderRadius:4}
  }]
});
charts.push(chartCohort);

/* 6. 关联矩阵 */
const chartMatrix = echarts.init(document.getElementById('chart-matrix'));
const matrixCats = ['手机','美妆','家电','服装','食品','母婴','运动','家居'];
const matrixData = [];
for (let i=0;i<matrixCats.length;i++)
  for (let j=0;j<matrixCats.length;j++) {
    let v = Math.random()*0.6+0.1;
    if (i===j) v = 1.0;
    if (Math.abs(i-j)===1) v = Math.random()*0.25+0.55;
    matrixData.push([j, i, parseFloat(v.toFixed(2))]);
  }
chartMatrix.setOption({
  tooltip: { ...commonTooltip, formatter: p => `${matrixCats[p.value[1]]} x ${matrixCats[p.value[0]]}<br/>关联度: ${p.value[2]}` },
  grid: { left: 52, right: 8, top: 8, bottom: 28 },
  xAxis: { type:'category', data:matrixCats, axisLabel:{color:darkSub,fontSize:9,rotate:30}, axisLine:{show:false}, axisTick:{show:false}, splitLine:{show:false} },
  yAxis: { type:'category', data:matrixCats, axisLabel:{color:darkSub,fontSize:9}, axisLine:{show:false}, axisTick:{show:false}, splitLine:{show:false} },
  visualMap: {
    min:0, max:1, show:false,
    inRange:{ color: ['#1a0f0a','#3e1a12','#7a2e1e','#b83e28','#e05038','#ff4444','#ff6b35','#ffc107'] }
  },
  series: [{
    type:'heatmap', data:matrixData,
    itemStyle:{borderColor:'#0d0a07',borderWidth:2,borderRadius:3}
  }]
});
charts.push(chartMatrix);

/* 7. 仪表盘 */
const chartGauge = echarts.init(document.getElementById('chart-gauge'));
chartGauge.setOption({
  series: [{
    type:'gauge', startAngle:200, endAngle:-20, min:0, max:100,
    splitNumber:10,
    itemStyle:{color:'#ff4444'},
    progress:{show:true, width:14},
    pointer:{show:true, length:'65%', width:5, itemStyle:{color:'#ffc107'}},
    axisLine:{lineStyle:{width:14, color:[[0.5,'#5c6bc0'],[0.8,'#ff6b35'],[1,'#ff4444']]}},
    axisTick:{show:false}, splitLine:{length:8, lineStyle:{width:1,color:'#8899aa'}},
    axisLabel:{distance:18, color:darkSub, fontSize:10, formatter:v=>v===0||v===50||v===100?v:''},
    anchor:{show:true, showAbove:true, size:16, itemStyle:{borderColor:'#ff4444',borderWidth:2,color:'#0d0a07'}},
    title:{show:false}, detail:{
      valueAnimation:true, fontSize:22, color:'#ffc107', fontWeight:700,
      offsetCenter:[0,'70%'], formatter:'{value}%'
    },
    data:[{value:78}]
  }]
});
charts.push(chartGauge);

/* 8. 客单价分布 */
const chartAtv = echarts.init(document.getElementById('chart-atv'));
chartAtv.setOption({
  tooltip: commonTooltip,
  grid: { left: 8, right: 18, top: 8, bottom: 24, containLabel: true },
  xAxis: { type:'category', data:['50-100','100-200','200-300','300-500','500+'], axisLabel:{color:darkSub,fontSize:10}, axisLine:{lineStyle:{color:'rgba(136,153,170,0.2)'}}, axisTick:{show:false} },
  yAxis: { type:'value', axisLabel:{color:darkSub,fontSize:10}, splitLine:{...darkGrid.lineStyle}, axisLine:{show:false}, axisTick:{show:false} },
  series: [{
    type:'bar', data:[12.5,28.3,35.6,18.4,5.2], barWidth:16,
    itemStyle:{ borderRadius:[4,4,0,0], color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#ffc107'},{offset:1,color:'rgba(255,193,7,0.15)'}]) },
    label:{show:true,position:'top',color:darkSub,fontSize:10,formatter:'{c}%'}
  }]
});
charts.push(chartAtv);

/* resize */
window.addEventListener('resize', () => charts.forEach(c => c.resize()));
</script>
</body>
</html>
