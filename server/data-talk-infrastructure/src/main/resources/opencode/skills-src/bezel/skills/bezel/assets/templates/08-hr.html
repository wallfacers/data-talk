<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人力资源分析中心</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #1f2937; color: #e5e7eb; }
    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .dashboard { position: relative; z-index: 1; width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 12px 16px; gap: 12px; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
    .header h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #f97316; text-shadow: 0 0 12px rgba(249,115,22,0.35); }
    .clock { font-size: 14px; color: #9ca3af; font-variant-numeric: tabular-nums; }
    .kpi-row { display: flex; gap: 12px; }
    .kpi-card { flex: 1; background: rgba(31,41,55,0.7); border: 1px solid rgba(75,85,99,0.5); border-radius: 10px; padding: 14px 16px; text-align: center; transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; backdrop-filter: blur(6px); }
    .kpi-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.35); border-color: rgba(249,115,22,0.45); }
    .kpi-label { font-size: 12px; color: #9ca3af; margin-bottom: 6px; }
    .kpi-value { font-size: 26px; font-weight: 700; color: #f3f4f6; line-height: 1.2; }
    .kpi-sub { font-size: 12px; margin-top: 4px; font-weight: 500; }
    .kpi-sub.up { color: #22c55e; }
    .kpi-sub.down { color: #ef4444; }
    .kpi-sub.neutral { color: #9ca3af; }
    .main { flex: 1; display: flex; gap: 12px; min-height: 0; }
    .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .col-left { width: 25%; }
    .col-center { width: 50%; }
    .col-right { width: 25%; }
    .card { flex: 1; background: rgba(31,41,55,0.7); border: 1px solid rgba(75,85,99,0.5); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; min-height: 0; transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; backdrop-filter: blur(6px); }
    .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.3); border-color: rgba(59,130,246,0.4); }
    .card-title { font-size: 13px; font-weight: 600; color: #f97316; margin-bottom: 8px; padding-left: 6px; border-left: 3px solid #f97316; flex-shrink: 0; }
    .chart { flex: 1; min-height: 0; }
    .structure-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: 1; min-height: 0; }
    .mini-chart { min-height: 0; }
    .funnel-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .funnel { display: flex; align-items: center; gap: 6px; }
    .funnel-step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .funnel-bar { background: linear-gradient(180deg, #3b82f6, #1d4ed8); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; box-shadow: 0 2px 8px rgba(59,130,246,0.35); transition: transform 0.2s ease; }
    .funnel-bar:hover { transform: scale(1.05); }
    .funnel-label { font-size: 11px; color: #9ca3af; }
    .funnel-arrow { color: #6b7280; font-size: 14px; }
    .funnel-rate { font-size: 10px; color: #f97316; font-weight: 600; }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="dashboard">
    <div class="header">
      <h1>人力资源分析中心</h1>
      <div class="clock" id="clock">--</div>
    </div>
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">总人数</div>
        <div class="kpi-value" data-target="1247" data-suffix="人">0</div>
        <div class="kpi-sub neutral">全公司在职</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">本月入职</div>
        <div class="kpi-value" data-target="28" data-suffix="人">0</div>
        <div class="kpi-sub up">▲ 12%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">本月离职</div>
        <div class="kpi-value" data-target="15" data-suffix="人" style="color:#ef4444">0</div>
        <div class="kpi-sub down">▼ 8%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">人均效能</div>
        <div class="kpi-value" data-target="38.5" data-suffix="万/人" data-decimal="1">0</div>
        <div class="kpi-sub up">▲ 5.2%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">招聘完成率</div>
        <div class="kpi-value" data-target="78" data-suffix="%">0</div>
        <div class="kpi-sub down">▼ 5pp</div>
      </div>
    </div>
    <div class="main">
      <div class="col col-left">
        <div class="card">
          <div class="card-title">人员结构</div>
          <div class="structure-grid">
            <div class="mini-chart" id="chart-age"></div>
            <div class="mini-chart" id="chart-edu"></div>
            <div class="mini-chart" id="chart-level"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">人才九宫格</div>
          <div class="chart" id="chart-nine"></div>
        </div>
      </div>
      <div class="col col-center">
        <div class="card" style="flex:1;">
          <div class="card-title">组织架构力导向图</div>
          <div class="chart" id="chart-org"></div>
        </div>
      </div>
      <div class="col col-right">
        <div class="card">
          <div class="card-title">离职趋势（12个月）</div>
          <div class="chart" id="chart-turnover"></div>
        </div>
        <div class="card">
          <div class="card-title">招聘漏斗</div>
          <div class="funnel-wrap">
            <div class="funnel">
              <div class="funnel-step">
                <div class="funnel-bar" style="width:72px;height:64px;">500</div>
                <div class="funnel-label">简历</div>
              </div>
              <div class="funnel-step">
                <div class="funnel-arrow">→</div>
                <div class="funnel-rate">24%</div>
              </div>
              <div class="funnel-step">
                <div class="funnel-bar" style="width:64px;height:56px;">120</div>
                <div class="funnel-label">面试</div>
              </div>
              <div class="funnel-step">
                <div class="funnel-arrow">→</div>
                <div class="funnel-rate">37.5%</div>
              </div>
              <div class="funnel-step">
                <div class="funnel-bar" style="width:56px;height:48px;">45</div>
                <div class="funnel-label">Offer</div>
              </div>
              <div class="funnel-step">
                <div class="funnel-arrow">→</div>
                <div class="funnel-rate">62.2%</div>
              </div>
              <div class="funnel-step">
                <div class="funnel-bar" style="width:48px;height:40px;">28</div>
                <div class="funnel-label">入职</div>
              </div>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">员工满意度趋势</div>
          <div class="chart" id="chart-sat"></div>
        </div>
        <div class="card">
          <div class="card-title">薪酬带宽对标</div>
          <div class="chart" id="chart-pay"></div>
        </div>
        <div class="card">
          <div class="card-title">AI 离职风险预测热力</div>
          <div class="chart" id="chart-risk"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ---------- Background network canvas ----------
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resizeCanvas() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    const DOT_COUNT = 80;
    const CONNECT_DIST = 140;
    const dots = Array.from({length: DOT_COUNT}, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
      r: Math.random() * 1.5 + 0.8
    }));
    function drawBg() {
      ctx.clearRect(0,0,W,H);
      for (let i=0;i<DOT_COUNT;i++) {
        const d = dots[i];
        d.x += d.vx; d.y += d.vy;
        if (d.x < 0 || d.x > W) d.vx *= -1;
        if (d.y < 0 || d.y > H) d.vy *= -1;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(148,163,184,0.25)';
        ctx.fill();
      }
      for (let i=0;i<DOT_COUNT;i++) {
        for (let j=i+1;j<DOT_COUNT;j++) {
          const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < CONNECT_DIST) {
            ctx.beginPath();
            ctx.moveTo(dots[i].x, dots[i].y);
            ctx.lineTo(dots[j].x, dots[j].y);
            ctx.strokeStyle = `rgba(148,163,184,${0.12 * (1 - dist/CONNECT_DIST)})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(drawBg);
    }
    drawBg();

    // ---------- Clock ----------
    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2,'0');
      document.getElementById('clock').textContent = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ---------- KPI rolling animation ----------
    document.querySelectorAll('.kpi-value').forEach(el => {
      const target = parseFloat(el.dataset.target);
      const suffix = el.dataset.suffix || '';
      const decimal = parseInt(el.dataset.decimal || '0', 10);
      const duration = 1200;
      const start = performance.now();
      function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        const val = target * ease;
        el.textContent = (decimal ? val.toFixed(decimal) : Math.round(val).toLocaleString()) + suffix;
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });

    // ---------- ECharts common theme ----------
    const darkTheme = {
      backgroundColor: 'transparent',
      textStyle: { fontFamily: "'PingFang SC','Microsoft YaHei',sans-serif" },
      title: { textStyle: { color: '#e5e7eb' } },
      legend: { textStyle: { color: '#9ca3af' } },
      tooltip: { backgroundColor: 'rgba(17,24,39,0.92)', borderColor: '#374151', textStyle: { color: '#e5e7eb' } }
    };
    function makeChart(dom, option) {
      const chart = echarts.init(dom, null, { renderer: 'canvas' });
      chart.setOption({ ...darkTheme, ...option });
      window.addEventListener('resize', () => chart.resize());
      return chart;
    }

    // ---------- 6. Org force graph ----------
    const depts = ['研发部','销售部','市场部','运营部','财务部','人力部','产品部','客服部'];
    const deptSizes = [320,180,95,140,60,45,110,85];
    const deptRisk = [2,1,0,1,0,0,1,0]; // 0=green 1=yellow 2=red
    const riskColors = ['#22c55e','#f59e0b','#ef4444'];
    const orgNodes = depts.map((name,i)=>({id:String(i),name,value:deptSizes[i],symbolSize:Math.sqrt(deptSizes[i])*3.2,itemStyle:{color:riskColors[deptRisk[i]]},label:{show:true,color:'#e5e7eb',fontSize:12}}));
    const orgLinks = [];
    for (let i=0;i<depts.length;i++) for (let j=i+1;j<depts.length;j++) if (Math.random()>0.55) orgLinks.push({source:String(i),target:String(j),lineStyle:{color:'rgba(148,163,184,0.25)',width:1}});
    makeChart(document.getElementById('chart-org'), {
      tooltip: { formatter: p => p.dataType==='node'?`${p.data.name}<br/>人数：${p.data.value}`:'' },
      series: [{
        type: 'graph', layout: 'force', roam: true, draggable: true,
        data: orgNodes, links: orgLinks,
        force: { repulsion: 380, edgeLength: [60,140], gravity: 0.06 },
        emphasis: { focus: 'adjacency', lineStyle: { width: 2, color: '#f97316' } },
        lineStyle: { curveness: 0.15 }
      }]
    });

    // ---------- 7. Personnel structure (3 mini pies) ----------
    const pieCommon = {
      type: 'pie', radius: ['42%','68%'], center: ['50%','55%'],
      label: { show: true, color: '#e5e7eb', fontSize: 10, formatter: '{b}\n{d}%' },
      labelLine: { lineStyle: { color: '#6b7280' } }
    };
    makeChart(document.getElementById('chart-age'), {
      title: { text: '年龄', left: 'center', top: 0, textStyle: { color: '#9ca3af', fontSize: 11 } },
      series: [{ ...pieCommon, data: [
        {value: 210, name: '25岁以下', itemStyle:{color:'#3b82f6'}},
        {value: 520, name: '26-35岁', itemStyle:{color:'#f97316'}},
        {value: 380, name: '36-45岁', itemStyle:{color:'#22c55e'}},
        {value: 137, name: '45岁以上', itemStyle:{color:'#8b5cf6'}}
      ]}]
    });
    makeChart(document.getElementById('chart-edu'), {
      title: { text: '学历', left: 'center', top: 0, textStyle: { color: '#9ca3af', fontSize: 11 } },
      series: [{ ...pieCommon, data: [
        {value: 180, name: '硕士及以上', itemStyle:{color:'#3b82f6'}},
        {value: 720, name: '本科', itemStyle:{color:'#f97316'}},
        {value: 280, name: '大专', itemStyle:{color:'#22c55e'}},
        {value: 67, name: '其他', itemStyle:{color:'#8b5cf6'}}
      ]}]
    });
    makeChart(document.getElementById('chart-level'), {
      title: { text: '职级', left: 'center', top: 0, textStyle: { color: '#9ca3af', fontSize: 11 } },
      series: [{ ...pieCommon, data: [
        {value: 45, name: '高管', itemStyle:{color:'#ef4444'}},
        {value: 180, name: '总监', itemStyle:{color:'#f97316'}},
        {value: 420, name: '经理', itemStyle:{color:'#3b82f6'}},
        {value: 602, name: '专员', itemStyle:{color:'#22c55e'}}
      ]}]
    });

    // ---------- 8. Turnover trend ----------
    const months = ['6月','7月','8月','9月','10月','11月','12月','1月','2月','3月','4月','5月'];
    const turnoverData = [18,22,19,25,21,28,24,20,16,14,15,15];
    makeChart(document.getElementById('chart-turnover'), {
      tooltip: { trigger: 'axis' },
      grid: { left: 36, right: 12, top: 24, bottom: 20 },
      xAxis: { type: 'category', data: months, axisLine: { lineStyle: { color: '#4b5563' } }, axisLabel: { color: '#9ca3af', fontSize: 10 } },
      yAxis: { type: 'value', splitLine: { lineStyle: { color: 'rgba(75,85,99,0.3)' } }, axisLabel: { color: '#9ca3af', fontSize: 10 } },
      series: [{
        type: 'line', data: turnoverData, smooth: true, symbol: 'circle', symbolSize: 6,
        lineStyle: { color: '#ef4444', width: 2 }, itemStyle: { color: '#ef4444' },
        areaStyle: { color: { type: 'linear', x:0,y:0,x2:0,y2:1, colorStops:[{offset:0,color:'rgba(239,68,68,0.25)'},{offset:1,color:'rgba(239,68,68,0.02)'}] } }
      }]
    });

    // ---------- 10. Satisfaction trend ----------
    makeChart(document.getElementById('chart-sat'), {
      tooltip: { trigger: 'axis' },
      grid: { left: 36, right: 12, top: 24, bottom: 20 },
      xAxis: { type: 'category', data: ['Q1','Q2','Q3','Q4'], axisLine: { lineStyle: { color: '#4b5563' } }, axisLabel: { color: '#9ca3af', fontSize: 10 } },
      yAxis: { type: 'value', min: 3, max: 5, splitLine: { lineStyle: { color: 'rgba(75,85,99,0.3)' } }, axisLabel: { color: '#9ca3af', fontSize: 10 } },
      series: [{
        type: 'line', data: [4.12,4.25,4.18,4.35], smooth: true, symbol: 'circle', symbolSize: 7,
        lineStyle: { color: '#22c55e', width: 2.5 }, itemStyle: { color: '#22c55e' },
        markLine: { silent: true, data: [{yAxis:4.2}], lineStyle:{color:'rgba(249,115,22,0.6)',type:'dashed'}, label:{show:false} }
      }]
    });

    // ---------- 11. Nine-box grid ----------
    const nineData = [
      [1,1,8],[1,2,12],[1,3,6],[1,4,3],[1,5,2],
      [2,1,10],[2,2,22],[2,3,18],[2,4,9],[2,5,5],
      [3,1,6],[3,2,28],[3,3,35],[3,4,20],[3,5,8],
      [4,1,4],[4,2,15],[4,3,30],[4,4,42],[4,5,18],
      [5,1,2],[5,2,8],[5,3,18],[5,4,35],[5,5,22]
    ];
    const nineLabels = ['待提升','一般','骨干','明星','超明星'];
    makeChart(document.getElementById('chart-nine'), {
      tooltip: { formatter: p => `绩效 ${p.data[0]} · 潜力 ${p.data[1]}<br/>人数：${p.data[2]}` },
      grid: { left: 36, right: 18, top: 18, bottom: 28 },
      xAxis: { type: 'value', min: 0.5, max: 5.5, splitLine: { show: false }, axisLine: { lineStyle: { color: '#4b5563' } }, axisLabel: { color: '#9ca3af', fontSize: 10, formatter: v => v>=1&&v<=5?String(v):'' }, name: '绩效', nameTextStyle: { color: '#9ca3af', fontSize: 10 } },
      yAxis: { type: 'value', min: 0.5, max: 5.5, splitLine: { show: false }, axisLine: { lineStyle: { color: '#4b5563' } }, axisLabel: { color: '#9ca3af', fontSize: 10, formatter: v => v>=1&&v<=5?String(v):'' }, name: '潜力', nameTextStyle: { color: '#9ca3af', fontSize: 10 } },
      series: [{
        type: 'scatter', data: nineData,
        symbolSize: d => Math.sqrt(d[2])*5.5,
        itemStyle: { color: d => {
          const s = d.data[0]+d.data[1];
          if (s>=9) return '#ef4444';
          if (s>=7) return '#f97316';
          if (s>=5) return '#3b82f6';
          return '#6b7280';
        }, opacity: 0.85 },
        markArea: {
          silent: true,
          data: [
            [{xAxis:0.5,yAxis:0.5},{xAxis:2.5,yAxis:2.5,itemStyle:{color:'rgba(107,114,128,0.08)'}}],
            [{xAxis:2.5,yAxis:0.5},{xAxis:4.5,yAxis:2.5,itemStyle:{color:'rgba(59,130,246,0.08)'}}],
            [{xAxis:4.5,yAxis:0.5},{xAxis:5.5,yAxis:2.5,itemStyle:{color:'rgba(249,115,22,0.08)'}}],
            [{xAxis:0.5,yAxis:2.5},{xAxis:2.5,yAxis:4.5,itemStyle:{color:'rgba(59,130,246,0.08)'}}],
            [{xAxis:2.5,yAxis:2.5},{xAxis:4.5,yAxis:4.5,itemStyle:{color:'rgba(34,197,94,0.08)'}}],
            [{xAxis:4.5,yAxis:2.5},{xAxis:5.5,yAxis:4.5,itemStyle:{color:'rgba(249,115,22,0.08)'}}],
            [{xAxis:0.5,yAxis:4.5},{xAxis:2.5,yAxis:5.5,itemStyle:{color:'rgba(249,115,22,0.08)'}}],
            [{xAxis:2.5,yAxis:4.5},{xAxis:4.5,yAxis:5.5,itemStyle:{color:'rgba(249,115,22,0.08)'}}],
            [{xAxis:4.5,yAxis:4.5},{xAxis:5.5,yAxis:5.5,itemStyle:{color:'rgba(239,68,68,0.08)'}}]
          ]
        },
        markLine: {
          silent: true, symbol: 'none',
          lineStyle: { color: 'rgba(148,163,184,0.35)', type: 'dashed', width: 1 },
          data: [{xAxis:2.5},{xAxis:4.5},{yAxis:2.5},{yAxis:4.5}]
        }
      }]
    });

    // ---------- 12. Pay bandwidth boxplot ----------
    const levels = ['P3','P4','P5','P6','P7'];
    const boxData = [
      [8,10,12,14,18],
      [12,15,18,22,28],
      [18,24,30,38,48],
      [30,40,52,65,85],
      [50,68,88,110,145]
    ];
    const market50 = [11,17,29,50,82];
    makeChart(document.getElementById('chart-pay'), {
      tooltip: { trigger: 'item', formatter: p => p.seriesType==='boxplot'?`${p.name}<br/>最低：${p.data[1]}万<br/>Q1：${p.data[2]}万<br/>中位：${p.data[3]}万<br/>Q3：${p.data[4]}万<br/>最高：${p.data[5]}万`:'' },
      grid: { left: 36, right: 18, top: 24, bottom: 24 },
      xAxis: { type: 'category', data: levels, axisLine: { lineStyle: { color: '#4b5563' } }, axisLabel: { color: '#9ca3af', fontSize: 10 } },
      yAxis: { type: 'value', name: '万/年', nameTextStyle: { color: '#9ca3af', fontSize: 10 }, splitLine: { lineStyle: { color: 'rgba(75,85,99,0.3)' } }, axisLabel: { color: '#9ca3af', fontSize: 10 } },
      series: [
        { type: 'boxplot', data: boxData.map((d,i)=>({name:levels[i],value:d})), itemStyle: { color: 'rgba(59,130,246,0.25)', borderColor: '#3b82f6', borderWidth: 1.5 } },
        { type: 'line', data: market50, symbol: 'diamond', symbolSize: 8, lineStyle: { color: '#f97316', width: 2, type: 'dashed' }, itemStyle: { color: '#f97316' }, markLine: { silent: true, data: [], label: { show: false } } }
      ]
    });

    // ---------- 13. AI risk heatmap ----------
    const riskMatrix = [
      [0,0,1,2,3],[0,1,1,2,2],[1,1,2,2,3],[0,0,1,1,2],[0,1,1,2,2],[0,0,0,1,1],[0,1,2,2,3],[0,0,1,1,2]
    ];
    const riskColorsHM = ['#22c55e','#f59e0b','#f97316','#ef4444'];
    makeChart(document.getElementById('chart-risk'), {
      tooltip: { formatter: p => `${depts[p.data[1]]} · ${levels[p.data[0]]}<br/>风险等级：${['低','中','高','极高'][p.data[2]]}` },
      grid: { left: 72, right: 12, top: 8, bottom: 24 },
      xAxis: { type: 'category', data: levels, axisLine: { lineStyle: { color: '#4b5563' } }, axisLabel: { color: '#9ca3af', fontSize: 10 } },
      yAxis: { type: 'category', data: depts, axisLine: { lineStyle: { color: '#4b5563' } }, axisLabel: { color: '#9ca3af', fontSize: 10 } },
      visualMap: { min: 0, max: 3, show: false, inRange: { color: riskColorsHM } },
      series: [{
        type: 'heatmap', data: riskMatrix.flatMap((row, y) => row.map((v, x) => [x, y, v])),
        label: { show: true, color: '#fff', fontSize: 10, formatter: p => ['低','中','高','极高'][p.data[2]] },
        itemStyle: { borderColor: '#1f2937', borderWidth: 2, borderRadius: 4 }
      }]
    });
  </script>
</body>
