<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/ https://__BEZEL_SERVER_ORIGIN__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://__BEZEL_SERVER_ORIGIN__; frame-ancestors 'self';">
<meta name="__JSON_HASH__" content="">
<title>SaaS 运营监控中心</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    --bg-rgb: 15,20,32;
    --accent-primary-rgb: 20,184,166;
    --accent-secondary-rgb: 99,102,241;
    --bezel-bg-app: #0a0f1a;
    --bezel-accent-primary: #14b8a6;
    --bezel-accent-secondary: #6366f1;
    --bezel-text-strong: #e2e8f0;
    --bezel-text-muted: #94a3b8;
    --bezel-font-stack: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --card-radius: 4px;
    --card-bg: rgba(var(--bg-rgb), 0.85);
    --card-border: none;
    --card-shadow: none;
    --card-padding: 10px;
    --card-blur: 0;
    --motion-duration: 150ms;
    --motion-easing: cubic-bezier(0.4, 0, 0.2, 1);
    --motion-ambient: none;
  }
  @media (prefers-reduced-motion: reduce) {
    :root {
      --motion-duration: 0ms;
      --motion-ambient: none;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: linear-gradient(135deg, var(--bezel-bg-app) 0%, rgba(var(--accent-primary-rgb), 0.03) 100%);
    font-family: var(--bezel-font-stack);
    color: var(--bezel-text-strong);
  }

  /* Grid layout */
  .dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 80px 1fr 1fr 1fr;
    gap: 6px;
    padding: 6px;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    grid-template-areas:
      "title   kpi1    kpi2    kpi3"
      "retention retention waterfall plan"
      "heatmap  heatmap  api     api"
      "churn    churn    journey  journey";
  }

  /* Card base */
  .card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    border: var(--card-border);
    padding: var(--card-padding);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    transition: transform var(--motion-duration) var(--motion-easing);
  }
  .card:hover {
    transform: translateY(-2px);
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--bezel-text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .card-body {
    flex: 1;
    min-height: 0;
    position: relative;
  }

  /* Title cell */
  .cell-title {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 12px;
    background: var(--card-bg);
    border-radius: var(--card-radius);
  }
  .cell-title h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--bezel-accent-primary);
    letter-spacing: 2px;
  }
  .cell-title .subtitle {
    font-size: 10px;
    color: var(--bezel-text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .cell-title .clock {
    font-size: 12px;
    color: var(--bezel-text-muted);
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }

  /* KPI blocks */
  .kpi-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    background: var(--card-bg);
    border-radius: var(--card-radius);
  }
  .kpi-block .value {
    font-size: 32px;
    font-weight: 700;
    color: var(--bezel-text-strong);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .kpi-block .value.teal {
    color: var(--bezel-accent-primary);
  }
  .kpi-block .value.indigo {
    color: var(--bezel-accent-secondary);
  }
  .kpi-block .label {
    font-size: 10px;
    color: var(--bezel-text-muted);
    margin-top: 4px;
  }
  .kpi-block .trend {
    font-size: 10px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
    color: #34d399;
  }

  /* Grid area assignments */
  .area-title     { grid-area: title; }
  .area-kpi1      { grid-area: kpi1; }
  .area-kpi2      { grid-area: kpi2; }
  .area-kpi3      { grid-area: kpi3; }
  .area-retention { grid-area: retention; }
  .area-waterfall { grid-area: waterfall; }
  .area-plan      { grid-area: plan; }
  .area-heatmap   { grid-area: heatmap; }
  .area-api       { grid-area: api; }
  .area-churn     { grid-area: churn; }
  .area-journey   { grid-area: journey; }

  /* Journey flow */
  .journey-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    height: 100%;
    padding: 0 8px;
  }
  .j-step {
    flex: 1;
    text-align: center;
  }
  .j-step .j-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin: 0 auto 4px;
  }
  .j-step .j-label {
    font-size: 10px;
    color: var(--bezel-text-muted);
  }
  .j-step .j-rate {
    font-size: 16px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .j-arrow {
    color: #475569;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="dashboard">
  <!-- Title cell -->
  <div class="area-title cell-title" role="region" aria-label="Dashboard title">
    <h1>SaaS 运营监控</h1>
    <div class="subtitle">SaaS Operations Center</div>
    <div class="clock" id="clock">--:--:--</div>
  </div>

  <!-- KPI 1: WAU -->
  <div class="area-kpi1 kpi-block" role="region" aria-label="KPI: WAU">
    <div class="value teal" data-target="24856" data-decimal="0">0</div>
    <div class="label">活跃用户 WAU</div>
    <div class="trend">+8.2%</div>
  </div>

  <!-- KPI 2: MRR -->
  <div class="area-kpi2 kpi-block" role="region" aria-label="KPI: MRR">
    <div class="value indigo" data-target="1380" data-suffix="万" data-decimal="0">0</div>
    <div class="label">MRR</div>
    <div class="trend">+8.3%</div>
  </div>

  <!-- KPI 3: NPS -->
  <div class="area-kpi3 kpi-block" role="region" aria-label="KPI: NPS">
    <div class="value" data-target="68" data-decimal="0">0</div>
    <div class="label">NPS</div>
    <div class="trend">+10</div>
  </div>

  <!-- Retention -->
  <div class="area-retention card" role="region" aria-label="User retention rate">
    <div class="card-title">用户留存率</div>
    <div class="card-body" id="chart-retention"></div>
  </div>

  <!-- Waterfall -->
  <div class="area-waterfall card" role="region" aria-label="MRR waterfall">
    <div class="card-title">MRR / ARR 瀑布图</div>
    <div class="card-body" id="chart-waterfall"></div>
  </div>

  <!-- Plan distribution -->
  <div class="area-plan card" role="region" aria-label="Plan subscription distribution">
    <div class="card-title">套餐订阅分布</div>
    <div class="card-body" id="chart-plan"></div>
  </div>

  <!-- Feature heatmap -->
  <div class="area-heatmap card" role="region" aria-label="Feature adoption heatmap">
    <div class="card-title">功能采用率热力图</div>
    <div class="card-body" id="chart-heatmap"></div>
  </div>

  <!-- API Performance -->
  <div class="area-api card" role="region" aria-label="API performance trend">
    <div class="card-title">API 性能趋势 24h</div>
    <div class="card-body" id="chart-api"></div>
  </div>

  <!-- Churn prediction -->
  <div class="area-churn card" role="region" aria-label="Churn rate prediction">
    <div class="card-title">Churn Rate 预测</div>
    <div class="card-body" id="chart-churn"></div>
  </div>

  <!-- Journey map -->
  <div class="area-journey card" role="region" aria-label="User journey map">
    <div class="card-title">用户旅程地图</div>
    <div class="card-body">
      <div class="journey-wrap">
        <div class="j-step">
          <div class="j-dot" style="background:#14b8a6"></div>
          <div class="j-label">注册</div>
          <div class="j-rate" style="color:#14b8a6">100%</div>
        </div>
        <div class="j-arrow">&#8594;</div>
        <div class="j-step">
          <div class="j-dot" style="background:#6366f1"></div>
          <div class="j-label">激活</div>
          <div class="j-rate" style="color:#6366f1">65%</div>
        </div>
        <div class="j-arrow">&#8594;</div>
        <div class="j-step">
          <div class="j-dot" style="background:#f472b6"></div>
          <div class="j-label">付费</div>
          <div class="j-rate" style="color:#f472b6">28%</div>
        </div>
        <div class="j-arrow">&#8594;</div>
        <div class="j-step">
          <div class="j-dot" style="background:#a78bfa"></div>
          <div class="j-label">留存</div>
          <div class="j-rate" style="color:#a78bfa">22%</div>
        </div>
        <div class="j-arrow">&#8594;</div>
        <div class="j-step">
          <div class="j-dot" style="background:#34d399"></div>
          <div class="j-label">推荐</div>
          <div class="j-rate" style="color:#34d399">8%</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ==================== BEZEL CONFIG ==================== */
window.__BEZEL_CONFIG__ = {
  dashboardId: "04-saas",
  style: "mosaic",
  refreshInterval: 30000,
  widgets: [
    { id: "retention", type: "line" },
    { id: "waterfall", type: "bar" },
    { id: "plan", type: "pie" },
    { id: "heatmap", type: "heatmap" },
    { id: "api", type: "line" },
    { id: "churn", type: "line" }
  ]
};

/* ==================== POLLING SCHEDULER ==================== */
(function() {
  var cfg = window.__BEZEL_CONFIG__;
  var interval = cfg.refreshInterval || 30000;
  function poll() {
    cfg.widgets.forEach(function(w) {
      var url = "/api/dashboards/" + cfg.dashboardId + "/widgets/" + w.id + "/data";
      fetch(url).then(function(r) { return r.json(); }).then(function(data) {
        window.dispatchEvent(new CustomEvent("bezel:data:" + w.id, { detail: data }));
      }).catch(function() {});
    });
  }
  setInterval(poll, interval);
})();

/* ==================== CLOCK ==================== */
function tickClock() {
  var now = new Date();
  var pad = function(n) { return String(n).padStart(2, '0'); };
  document.getElementById('clock').textContent =
    now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' +
    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
}
setInterval(tickClock, 1000);
tickClock();

/* ==================== KPI COUNT-UP ==================== */
function countUp(el, target, duration) {
  duration = duration || 800;
  var suffix = el.dataset.suffix || '';
  var decimal = parseInt(el.dataset.decimal) || 0;
  var startTime = null;
  function tick(ts) {
    if (!startTime) startTime = ts;
    var p = Math.min((ts - startTime) / duration, 1);
    var ease = 1 - Math.pow(1 - p, 3);
    var val = target * ease;
    el.textContent = (decimal > 0 ? val.toFixed(decimal) : Math.round(val).toLocaleString()) + suffix;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
document.querySelectorAll('.kpi-block .value[data-target]').forEach(function(el) {
  countUp(el, parseFloat(el.dataset.target));
});

/* ==================== ECHARTS COMMON ==================== */
var commonTooltip = {
  backgroundColor: 'rgba(10,15,26,0.92)',
  borderColor: 'rgba(148,163,184,0.25)',
  textStyle: { color: '#e2e8f0', fontSize: 12 },
  padding: [8, 12]
};
var darkSub = '#94a3b8';
var charts = [];

/* ==================== 1. RETENTION LINES ==================== */
var chartRetention = echarts.init(document.getElementById('chart-retention'));
var cohorts = ['C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'C7'];
var days = ['Day 0', 'Day 7', 'Day 30', 'Day 60', 'Day 90', 'Day 180', 'Day 365'];
var retData = [
  [100, 55, 38, 30, 25, 18, 12], [100, 58, 40, 32, 27, 19, 13],
  [100, 60, 42, 34, 28, 20, 14], [100, 62, 44, 35, 29, 21, 15],
  [100, 64, 46, 37, 30, 22, 16], [100, 65, 48, 38, 31, 23, 17],
  [100, 68, 50, 40, 33, 24, 18]
];
var retColors = ['#14b8a6', '#6366f1', '#f472b6', '#a78bfa', '#34d399', '#fbbf24', '#f87171'];
chartRetention.setOption({
  tooltip: Object.assign({}, commonTooltip, { trigger: 'axis' }),
  legend: { data: cohorts, top: 0, textStyle: { color: darkSub, fontSize: 10 } },
  grid: { left: 32, right: 8, top: 28, bottom: 20 },
  xAxis: { type: 'category', boundaryGap: false, data: days, axisLabel: { color: darkSub, fontSize: 9 }, axisLine: { lineStyle: { color: 'rgba(148,163,184,0.15)' } }, axisTick: { show: false } },
  yAxis: { type: 'value', name: '%', max: 100, nameTextStyle: { color: darkSub, fontSize: 9 }, axisLabel: { color: darkSub, fontSize: 9 }, splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } }, axisLine: { show: false }, axisTick: { show: false } },
  series: cohorts.map(function(c, i) {
    return {
      name: c, type: 'line', smooth: false, step: 'end', symbol: 'none',
      lineStyle: { width: 1.5, color: retColors[i] },
      areaStyle: { color: retColors[i], opacity: 0.06 },
      data: retData[i]
    };
  })
});
charts.push(chartRetention);

/* ==================== 2. MRR WATERFALL ==================== */
var chartWaterfall = echarts.init(document.getElementById('chart-waterfall'));
var wfMonths = ['1月', '2月', '3月', '4月', '5月', '6月'];
var wfAdd   = [1200, 180, 150, 140, 160, 190];
var wfExp   = [0, 80, 90, 100, 110, 130];
var wfCon   = [0, -30, -40, -35, -45, -50];
var wfChurn = [0, -50, -60, -55, -65, -70];
var wfNet   = wfAdd.map(function(v, i) { return v + wfExp[i] + wfCon[i] + wfChurn[i]; });
chartWaterfall.setOption({
  tooltip: Object.assign({}, commonTooltip, {
    trigger: 'axis', axisPointer: { type: 'shadow' },
    formatter: function(params) {
      var h = '<div style="font-weight:700;margin-bottom:4px">' + params[0].axisValue + ' MRR</div>';
      params.forEach(function(p) {
        if (p.seriesName !== 'net') h += '<div>' + p.marker + ' ' + p.seriesName + ': <b>' + (p.value > 0 ? '+' : '') + p.value + '万</b></div>';
      });
      return h;
    }
  }),
  legend: { data: ['new', 'expand', 'shrink', 'churn', 'net'], top: 0, textStyle: { color: darkSub, fontSize: 10 } },
  grid: { left: 32, right: 8, top: 28, bottom: 20, containLabel: false },
  xAxis: { type: 'category', data: wfMonths, axisLabel: { color: darkSub, fontSize: 9 }, axisLine: { lineStyle: { color: 'rgba(148,163,184,0.15)' } }, axisTick: { show: false } },
  yAxis: { type: 'value', name: '万元', nameTextStyle: { color: darkSub, fontSize: 9 }, axisLabel: { color: darkSub, fontSize: 9 }, splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } }, axisLine: { show: false }, axisTick: { show: false } },
  series: [
    { name: 'new', type: 'bar', stack: 'total', itemStyle: { color: '#34d399', borderRadius: [0, 0, 0, 0] }, data: wfAdd },
    { name: 'expand', type: 'bar', stack: 'total', itemStyle: { color: '#6366f1', borderRadius: [0, 0, 0, 0] }, data: wfExp },
    { name: 'shrink', type: 'bar', stack: 'total', itemStyle: { color: '#fbbf24', borderRadius: [0, 0, 0, 0] }, data: wfCon },
    { name: 'churn', type: 'bar', stack: 'total', itemStyle: { color: '#f87171', borderRadius: [0, 0, 0, 0] }, data: wfChurn },
    { name: 'net', type: 'line', symbol: 'circle', symbolSize: 4, step: 'end',
      lineStyle: { color: '#14b8a6', width: 1.5 }, itemStyle: { color: '#14b8a6' }, data: wfNet }
  ]
});
charts.push(chartWaterfall);

/* ==================== 3. PLAN PIE ==================== */
var chartPlan = echarts.init(document.getElementById('chart-plan'));
chartPlan.setOption({
  tooltip: Object.assign({}, commonTooltip, { trigger: 'item', formatter: '{b}: {c} ({d}%)' }),
  legend: { orient: 'vertical', right: 4, top: 'center', textStyle: { color: darkSub, fontSize: 9 }, itemWidth: 8, itemHeight: 8 },
  series: [{
    type: 'pie', radius: ['40%', '65%'], center: ['35%', '50%'],
    avoidLabelOverlap: false,
    label: { show: false },
    itemStyle: { borderRadius: 0, borderColor: '#0a0f1a', borderWidth: 2 },
    emphasis: { label: { show: true, fontSize: 12, fontWeight: 'bold', color: '#e2e8f0' } },
    data: [
      { value: 4200, name: 'Free', itemStyle: { color: '#94a3b8' } },
      { value: 6800, name: 'Pro', itemStyle: { color: '#6366f1' } },
      { value: 3100, name: 'Enterprise', itemStyle: { color: '#14b8a6' } },
      { value: 1200, name: 'Custom', itemStyle: { color: '#f472b6' } }
    ]
  }]
});
charts.push(chartPlan);

/* ==================== 4. FEATURE HEATMAP ==================== */
var chartHeatmap = echarts.init(document.getElementById('chart-heatmap'));
var hmX = ['仪表盘', '报表', 'API', '协作', '自动化', '集成', '移动端', '告警'];
var hmY = ['新用户', '成长中', '成熟期', '流失风险'];
var hmRaw = [
  [0,0,92],[0,1,78],[0,2,65],[0,3,35],
  [1,0,45],[1,1,88],[1,2,95],[1,3,40],
  [2,0,30],[2,1,55],[2,2,85],[2,3,60],
  [3,0,25],[3,1,48],[3,2,72],[3,3,20],
  [4,0,15],[4,1,42],[4,2,68],[4,3,55],
  [5,0,20],[5,1,50],[5,2,80],[5,3,45],
  [6,0,35],[6,1,60],[6,2,75],[6,3,30],
  [7,0,40],[7,1,70],[7,2,90],[7,3,50]
];
chartHeatmap.setOption({
  tooltip: Object.assign({}, commonTooltip, { position: 'top', formatter: function(p) { return hmY[p.value[1]] + ' · ' + hmX[p.value[0]] + ': <b>' + p.value[2] + '%</b>'; } }),
  grid: { left: 52, right: 8, top: 8, bottom: 28 },
  xAxis: { type: 'category', data: hmX, axisLabel: { color: darkSub, fontSize: 8, rotate: 25 }, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } },
  yAxis: { type: 'category', data: hmY, axisLabel: { color: darkSub, fontSize: 9 }, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } },
  visualMap: {
    min: 0, max: 100, show: false,
    inRange: { color: ['#0a0f1a', '#14b8a6', '#6366f1', '#f472b6'] }
  },
  series: [{
    type: 'heatmap', data: hmRaw,
    label: { show: true, color: '#e2e8f0', fontSize: 9, fontWeight: 600, formatter: function(p) { return p.value[2] + '%'; } },
    itemStyle: { borderColor: '#0a0f1a', borderWidth: 2, borderRadius: 2 }
  }]
});
charts.push(chartHeatmap);

/* ==================== 5. API PERFORMANCE ==================== */
var chartApi = echarts.init(document.getElementById('chart-api'));
var hours = [];
for (var hi = 0; hi < 24; hi++) hours.push(String(hi).padStart(2, '0') + ':00');
var p50 = [45,42,40,38,36,35,34,35,38,42,48,52,55,58,56,54,52,50,48,46,44,42,41,40];
var p95 = [120,110,105,100,95,92,90,95,105,115,125,135,140,138,135,130,128,125,122,118,115,112,110,108];
var p99 = [220,200,190,180,170,165,160,170,185,200,215,230,240,235,230,225,220,215,210,205,200,195,190,185];
chartApi.setOption({
  tooltip: Object.assign({}, commonTooltip, { trigger: 'axis' }),
  legend: { data: ['P50', 'P95', 'P99'], top: 0, textStyle: { color: darkSub, fontSize: 10 } },
  grid: { left: 32, right: 8, top: 28, bottom: 20 },
  xAxis: { type: 'category', boundaryGap: false, data: hours, axisLabel: { color: darkSub, fontSize: 9, interval: 3 }, axisLine: { lineStyle: { color: 'rgba(148,163,184,0.15)' } }, axisTick: { show: false } },
  yAxis: { type: 'value', name: 'ms', nameTextStyle: { color: darkSub, fontSize: 9 }, axisLabel: { color: darkSub, fontSize: 9 }, splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } }, axisLine: { show: false }, axisTick: { show: false } },
  series: [
    { name: 'P50', type: 'line', smooth: false, step: 'end', symbol: 'none', lineStyle: { width: 1.5, color: '#34d399' }, data: p50 },
    { name: 'P95', type: 'line', smooth: false, step: 'end', symbol: 'none', lineStyle: { width: 1.5, color: '#6366f1' }, data: p95 },
    { name: 'P99', type: 'line', smooth: false, step: 'end', symbol: 'none', lineStyle: { width: 1.5, color: '#f472b6' }, areaStyle: { color: 'rgba(244,114,182,0.06)' }, data: p99 }
  ]
});
charts.push(chartApi);

/* ==================== 6. CHURN PREDICTION ==================== */
var chartChurn = echarts.init(document.getElementById('chart-churn'));
var churnMonths = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月','1月p','2月p','3月p'];
var churnHist = [2.8,2.7,2.6,2.5,2.4,2.5,2.6,2.7,2.8,2.9,3.0,3.1,null,null,null];
var churnPred = [null,null,null,null,null,null,null,null,null,null,null,null,3.2,3.3,3.4];
chartChurn.setOption({
  tooltip: Object.assign({}, commonTooltip, {
    trigger: 'axis',
    formatter: function(params) {
      var p = params[0];
      if (p.value == null) return '';
      return p.axisValue + '<br/>Churn: <b>' + p.value + '%</b>';
    }
  }),
  grid: { left: 32, right: 8, top: 16, bottom: 24 },
  xAxis: { type: 'category', boundaryGap: false, data: churnMonths, axisLabel: { color: darkSub, fontSize: 8, interval: 0, rotate: 30 }, axisLine: { lineStyle: { color: 'rgba(148,163,184,0.15)' } }, axisTick: { show: false } },
  yAxis: { type: 'value', name: '%', min: 2, max: 4, nameTextStyle: { color: darkSub, fontSize: 9 }, axisLabel: { color: darkSub, fontSize: 9 }, splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } }, axisLine: { show: false }, axisTick: { show: false } },
  series: [
    { name: '历史', type: 'line', smooth: false, step: 'end', symbol: 'circle', symbolSize: 3,
      lineStyle: { width: 1.5, color: '#f472b6' }, itemStyle: { color: '#f472b6' }, data: churnHist },
    { name: '预测', type: 'line', smooth: false, step: 'end', symbol: 'diamond', symbolSize: 4,
      lineStyle: { width: 1.5, color: '#f472b6', type: 'dashed' }, itemStyle: { color: '#f472b6' }, data: churnPred }
  ]
});
charts.push(chartChurn);

/* ==================== RESIZE ==================== */
window.addEventListener('resize', function() {
  charts.forEach(function(c) { c && c.resize(); });
});
</script>
</body>
</html>
