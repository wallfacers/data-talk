<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线教育数据中心</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.6);
      --card-border: rgba(148, 163, 184, 0.12);
      --yellow: #facc15;
      --green: #22c55e;
      --blue: #3b82f6;
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* 顶部黄色光晕 */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 60vw; height: 200px;
      background: radial-gradient(ellipse at center top, rgba(250, 204, 21, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* 书本纹理感 */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(250, 204, 21, 0.015) 2px,
          rgba(250, 204, 21, 0.015) 3px
        );
      pointer-events: none;
      z-index: 0;
    }

    .dashboard {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      gap: 10px;
    }

    /* 顶部标题区 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--yellow), #fbbf24);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 0 30px rgba(250, 204, 21, 0.2);
    }

    .header-clock {
      font-size: 14px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }

    /* KPI 胶囊 */
    .kpi-row {
      display: flex;
      gap: 12px;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .kpi-pill {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }

    .kpi-pill:hover {
      transform: translateY(-2px);
      border-color: rgba(250, 204, 21, 0.3);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 0 12px rgba(250, 204, 21, 0.08);
    }

    .kpi-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .kpi-icon.yellow { background: rgba(250, 204, 21, 0.15); color: var(--yellow); }
    .kpi-icon.green { background: rgba(34, 197, 94, 0.15); color: var(--green); }
    .kpi-icon.blue { background: rgba(59, 130, 246, 0.15); color: var(--blue); }

    .kpi-info { flex: 1; }
    .kpi-label { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
    .kpi-value-wrap { display: flex; align-items: baseline; gap: 8px; }
    .kpi-value { font-size: 22px; font-weight: 700; color: var(--text); }
    .kpi-unit { font-size: 12px; color: var(--text-secondary); font-weight: 400; }
    .kpi-delta { font-size: 12px; font-weight: 600; }
    .kpi-delta.up { color: var(--green); }

    /* 主体三栏 */
    .main-body {
      flex: 1;
      display: flex;
      gap: 12px;
      min-height: 0;
    }

    .col-left, .col-right {
      width: 27.5%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .col-center {
      width: 45%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    /* 卡片 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }

    .card:hover {
      border-color: rgba(250, 204, 21, 0.2);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .card-title::before {
      content: '';
      width: 3px;
      height: 14px;
      border-radius: 2px;
      background: var(--yellow);
    }

    .card-body {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .chart-container {
      width: 100%;
      height: 100%;
    }

    /* 学习路径步骤条 */
    .path-flow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
      gap: 4px;
    }

    .path-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex: 1;
      position: relative;
    }

    .path-step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 14px;
      right: -50%;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--yellow), rgba(250, 204, 21, 0.2));
      z-index: 0;
    }

    .path-step.done:not(:last-child)::after {
      background: linear-gradient(90deg, var(--yellow), var(--yellow));
    }

    .path-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      z-index: 1;
      position: relative;
      border: 2px solid;
    }

    .path-dot.done {
      background: var(--yellow);
      border-color: var(--yellow);
      color: #0f172a;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.4);
    }

    .path-dot.progress {
      background: rgba(250, 204, 21, 0.15);
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .path-dot.pending {
      background: rgba(148, 163, 184, 0.1);
      border-color: var(--text-muted);
      color: var(--text-muted);
    }

    .path-label {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .path-pct {
      font-size: 11px;
      font-weight: 700;
      color: var(--yellow);
    }

    /* 漏斗 */
    .funnel-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px 0;
    }

    .funnel-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .funnel-bar-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .funnel-bar {
      height: 28px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #0f172a;
      transition: all 0.4s ease;
      position: relative;
    }

    .funnel-bar:hover {
      filter: brightness(1.15);
      transform: scaleX(1.02);
    }

    .funnel-label {
      width: 70px;
      font-size: 11px;
      color: var(--text-secondary);
      text-align: right;
      flex-shrink: 0;
    }

    .funnel-pct {
      width: 42px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      text-align: left;
      flex-shrink: 0;
    }

    /* 滚动动画辅助 */
    .count-up {
      font-variant-numeric: tabular-nums;
    }

    /* 小标签 */
    .tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }

    .tag-yellow { background: rgba(250, 204, 21, 0.15); color: var(--yellow); }
    .tag-green { background: rgba(34, 197, 94, 0.15); color: var(--green); }
    .tag-blue { background: rgba(59, 130, 246, 0.15); color: var(--blue); }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- 标题 -->
    <div class="header">
      <div class="header-title">在线教育数据中心</div>
      <div class="header-clock" id="clock">--</div>
    </div>

    <!-- KPI 胶囊 -->
    <div class="kpi-row">
      <div class="kpi-pill">
        <div class="kpi-icon yellow">&#128101;</div>
        <div class="kpi-info">
          <div class="kpi-label">总学员数</div>
          <div class="kpi-value-wrap">
            <span class="kpi-value count-up" data-target="12480" data-suffix="">0</span>
            <span class="kpi-unit">人</span>
            <span class="kpi-delta up">&#9650;8%</span>
          </div>
        </div>
      </div>
      <div class="kpi-pill">
        <div class="kpi-icon green">&#128293;</div>
        <div class="kpi-info">
          <div class="kpi-label">活跃学员</div>
          <div class="kpi-value-wrap">
            <span class="kpi-value count-up" data-target="3856" data-suffix="">0</span>
            <span class="kpi-unit">人</span>
            <span class="kpi-delta up">&#9650;12%</span>
          </div>
        </div>
      </div>
      <div class="kpi-pill">
        <div class="kpi-icon blue">&#9989;</div>
        <div class="kpi-info">
          <div class="kpi-label">课程完成率</div>
          <div class="kpi-value-wrap">
            <span class="kpi-value count-up" data-target="68" data-suffix="">0</span>
            <span class="kpi-unit">%</span>
            <span class="kpi-delta up">&#9650;5pp</span>
          </div>
        </div>
      </div>
      <div class="kpi-pill">
        <div class="kpi-icon yellow">&#9201;</div>
        <div class="kpi-info">
          <div class="kpi-label">平均学习时长</div>
          <div class="kpi-value-wrap">
            <span class="kpi-value count-up" data-target="4.2" data-suffix="" data-decimal="1">0</span>
            <span class="kpi-unit">h/周</span>
            <span class="kpi-delta up">&#9650;0.3h</span>
          </div>
        </div>
      </div>
      <div class="kpi-pill">
        <div class="kpi-icon green">&#128150;</div>
        <div class="kpi-info">
          <div class="kpi-label">教师满意度</div>
          <div class="kpi-value-wrap">
            <span class="kpi-value count-up" data-target="94.2" data-suffix="" data-decimal="1">0</span>
            <span class="kpi-unit">%</span>
            <span class="kpi-delta up">&#9650;1.5pp</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 主体 -->
    <div class="main-body">
      <!-- 左栏 -->
      <div class="col-left">
        <div class="card" style="flex: 1.2;">
          <div class="card-title">课程分类学习时长</div>
          <div class="card-body"><div id="chart-category" class="chart-container"></div></div>
        </div>
        <div class="card" style="flex: 1.3;">
          <div class="card-title">热门课程排行 TOP10</div>
          <div class="card-body"><div id="chart-ranking" class="chart-container"></div></div>
        </div>
        <div class="card" style="flex: 1;">
          <div class="card-title">学习时段分布</div>
          <div class="card-body"><div id="chart-time-heatmap" class="chart-container"></div></div>
        </div>
      </div>

      <!-- 中栏 -->
      <div class="col-center">
        <div class="card" style="flex: 1.6;">
          <div class="card-title">课程完成率</div>
          <div class="card-body"><div id="chart-gauge" class="chart-container"></div></div>
        </div>
        <div class="card" style="flex: 0.7;">
          <div class="card-title">学习路径阶段</div>
          <div class="card-body">
            <div class="path-flow">
              <div class="path-step done">
                <div class="path-dot done">1</div>
                <div class="path-label">注册</div>
                <div class="path-pct">100%</div>
              </div>
              <div class="path-step done">
                <div class="path-dot done">2</div>
                <div class="path-label">选课</div>
                <div class="path-pct">85%</div>
              </div>
              <div class="path-step progress">
                <div class="path-dot progress">3</div>
                <div class="path-label">学习</div>
                <div class="path-pct">62%</div>
              </div>
              <div class="path-step progress">
                <div class="path-dot progress">4</div>
                <div class="path-label">作业</div>
                <div class="path-pct">55%</div>
              </div>
              <div class="path-step pending">
                <div class="path-dot pending">5</div>
                <div class="path-label">考试</div>
                <div class="path-pct">48%</div>
              </div>
              <div class="path-step pending">
                <div class="path-dot pending">6</div>
                <div class="path-label">证书</div>
                <div class="path-pct">38%</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 右栏 -->
      <div class="col-right">
        <div class="card" style="flex: 1;">
          <div class="card-title">在线人数趋势（24h）</div>
          <div class="card-body"><div id="chart-online" class="chart-container"></div></div>
        </div>
        <div class="card" style="flex: 0.8;">
          <div class="card-title">满意度趋势</div>
          <div class="card-body"><div id="chart-satisfaction" class="chart-container"></div></div>
        </div>
        <div class="card" style="flex: 1;">
          <div class="card-title">学习活跃度七日留存</div>
          <div class="card-body"><div id="chart-retention" class="chart-container"></div></div>
        </div>
        <div class="card" style="flex: 1;">
          <div class="card-title">知识点掌握度热力图</div>
          <div class="card-body"><div id="chart-knowledge" class="chart-container"></div></div>
        </div>
        <div class="card" style="flex: 0.9;">
          <div class="card-title">完课率漏斗</div>
          <div class="card-body">
            <div class="funnel-wrap" id="funnel-html"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===================== 工具函数 =====================
    const chartInstances = [];

    function initChart(domId, option) {
      const el = document.getElementById(domId);
      if (!el) return null;
      const chart = echarts.init(el, 'dark', { renderer: 'canvas' });
      chart.setOption(option);
      chartInstances.push(chart);
      return chart;
    }

    // 暗色主题覆盖
    const darkTheme = {
      backgroundColor: 'transparent',
      textStyle: { color: '#94a3b8' },
      title: { textStyle: { color: '#f1f5f9' } },
      legend: { textStyle: { color: '#94a3b8' } },
      tooltip: {
        backgroundColor: 'rgba(15, 23, 42, 0.95)',
        borderColor: 'rgba(148, 163, 184, 0.2)',
        textStyle: { color: '#f1f5f9' }
      }
    };
    echarts.registerTheme('dark', darkTheme);

    // ===================== 实时时钟 =====================
    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('clock').textContent =
        `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ===================== KPI 数字滚动 =====================
    function animateKPIs() {
      document.querySelectorAll('.count-up').forEach(el => {
        const target = parseFloat(el.dataset.target);
        const decimal = parseInt(el.dataset.decimal || '0');
        const suffix = el.dataset.suffix || '';
        const duration = 1500;
        const start = performance.now();

        function tick(now) {
          const p = Math.min((now - start) / duration, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          const val = target * ease;
          el.textContent = (decimal > 0 ? val.toFixed(decimal) : Math.floor(val).toLocaleString()) + suffix;
          if (p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      });
    }
    setTimeout(animateKPIs, 300);

    // ===================== 1. 课程完成率大仪表盘 =====================
    initChart('chart-gauge', {
      backgroundColor: 'transparent',
      series: [{
        type: 'gauge',
        radius: '90%',
        startAngle: 210,
        endAngle: -30,
        min: 0,
        max: 100,
        splitNumber: 10,
        itemStyle: { color: '#facc15' },
        progress: {
          show: true,
          width: 18,
          roundCap: true
        },
        pointer: {
          show: true,
          length: '60%',
          width: 6,
          itemStyle: { color: '#facc15' }
        },
        axisLine: {
          lineStyle: {
            width: 18,
            color: [
              [0.5, '#ef4444'],
              [0.7, '#facc15'],
              [1, '#22c55e']
            ]
          }
        },
        axisTick: { show: false },
        splitLine: { length: 10, lineStyle: { width: 2, color: '#334155' } },
        axisLabel: { distance: 22, color: '#64748b', fontSize: 10 },
        title: {
          show: true,
          offsetCenter: [0, '30%'],
          fontSize: 14,
          color: '#94a3b8'
        },
        detail: {
          valueAnimation: true,
          fontSize: 42,
          fontWeight: 700,
          offsetCenter: [0, '-10%'],
          formatter: '{value}%',
          color: '#f1f5f9'
        },
        data: [{ value: 68, name: '课程完成率' }]
      }]
    });

    // ===================== 2. 课程分类学习时长（横向条形） =====================
    initChart('chart-category', {
      backgroundColor: 'transparent',
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      grid: { left: 3, right: 30, top: 8, bottom: 3, containLabel: true },
      xAxis: {
        type: 'value',
        axisLabel: { color: '#64748b', fontSize: 10, formatter: '{value}h' },
        splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } }
      },
      yAxis: {
        type: 'category',
        data: ['其他', '商业', '语言', '设计', '编程'],
        axisLabel: { color: '#94a3b8', fontSize: 11 },
        axisLine: { show: false },
        axisTick: { show: false }
      },
      series: [{
        type: 'bar',
        data: [
          { value: 1.8, itemStyle: { color: '#64748b', borderRadius: [0, 4, 4, 0] } },
          { value: 3.2, itemStyle: { color: '#3b82f6', borderRadius: [0, 4, 4, 0] } },
          { value: 4.5, itemStyle: { color: '#22c55e', borderRadius: [0, 4, 4, 0] } },
          { value: 5.1, itemStyle: { color: '#facc15', borderRadius: [0, 4, 4, 0] } },
          { value: 6.8, itemStyle: { color: '#f59e0b', borderRadius: [0, 4, 4, 0] } }
        ],
        barWidth: 14,
        label: { show: true, position: 'right', color: '#f1f5f9', fontSize: 11, formatter: '{c}h' }
      }]
    });

    // ===================== 3. 热门课程排行 TOP10 =====================
    const topCourses = [
      'Python 零基础入门', 'UI/UX 设计实战', '商务英语进阶',
      'React 前端开发', '数据分析与可视化', '产品经理必修课',
      'Java 高并发编程', '短视频运营技巧', '机器学习基础', 'PMP 项目管理'
    ];
    const topValues = [9850, 8720, 8100, 7650, 7200, 6800, 6400, 5900, 5500, 5100];
    initChart('chart-ranking', {
      backgroundColor: 'transparent',
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
      grid: { left: 3, right: 40, top: 4, bottom: 4, containLabel: true },
      xAxis: {
        type: 'value',
        axisLabel: { color: '#64748b', fontSize: 10 },
        splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } }
      },
      yAxis: {
        type: 'category',
        data: topCourses,
        axisLabel: { color: '#94a3b8', fontSize: 10 },
        axisLine: { show: false },
        axisTick: { show: false },
        inverse: true
      },
      series: [{
        type: 'bar',
        data: topValues.map((v, i) => ({
          value: v,
          itemStyle: {
            color: i < 3 ? '#facc15' : (i < 6 ? '#3b82f6' : '#64748b'),
            borderRadius: [0, 4, 4, 0]
          }
        })),
        barWidth: 12,
        label: { show: true, position: 'right', color: '#f1f5f9', fontSize: 10 }
      }]
    });

    // ===================== 4. 在线人数趋势（24h 折线） =====================
    const hours24 = Array.from({ length: 24 }, (_, i) => `${String(i).padStart(2, '0')}:00`);
    const onlineData = [120, 95, 80, 65, 55, 70, 150, 380, 620, 780, 850, 920, 980, 1050, 1120, 1080, 950, 820, 750, 680, 550, 420, 310, 200];
    initChart('chart-online', {
      backgroundColor: 'transparent',
      tooltip: { trigger: 'axis' },
      grid: { left: 8, right: 12, top: 20, bottom: 20, containLabel: true },
      xAxis: {
        type: 'category',
        data: hours24,
        axisLabel: { color: '#64748b', fontSize: 9, interval: 2 },
        axisLine: { lineStyle: { color: 'rgba(148,163,184,0.15)' } }
      },
      yAxis: {
        type: 'value',
        axisLabel: { color: '#64748b', fontSize: 10 },
        splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } }
      },
      series: [{
        type: 'line',
        data: onlineData,
        smooth: true,
        symbol: 'none',
        lineStyle: { color: '#3b82f6', width: 2 },
        areaStyle: {
          color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: 'rgba(59, 130, 246, 0.3)' },
            { offset: 1, color: 'rgba(59, 130, 246, 0.02)' }
          ])
        }
      }]
    });

    // ===================== 5. 满意度趋势（4季度折线） =====================
    initChart('chart-satisfaction', {
      backgroundColor: 'transparent',
      tooltip: { trigger: 'axis' },
      grid: { left: 8, right: 12, top: 20, bottom: 20, containLabel: true },
      xAxis: {
        type: 'category',
        data: ['Q1', 'Q2', 'Q3', 'Q4'],
        axisLabel: { color: '#64748b', fontSize: 11 },
        axisLine: { lineStyle: { color: 'rgba(148,163,184,0.15)' } }
      },
      yAxis: {
        type: 'value',
        min: 85,
        max: 100,
        axisLabel: { color: '#64748b', fontSize: 10, formatter: '{value}%' },
        splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } }
      },
      series: [{
        type: 'line',
        data: [90.5, 91.8, 93.1, 94.2],
        smooth: true,
        symbol: 'circle',
        symbolSize: 8,
        lineStyle: { color: '#22c55e', width: 2.5 },
        itemStyle: { color: '#22c55e', borderColor: '#0f172a', borderWidth: 2 },
        label: { show: true, position: 'top', color: '#f1f5f9', fontSize: 11, formatter: '{c}%' }
      }]
    });

    // ===================== 6. 七日留存热力图 =====================
    const days = ['Day 0', 'Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6'];
    const dates7 = ['05-05', '05-06', '05-07', '05-08', '05-09', '05-10', '05-11'];
    const retentionData = [];
    const retentionValues = [
      [100, 62, 48, 40, 35, 32, 30],
      [100, 65, 50, 42, 37, 34, 31],
      [100, 60, 47, 39, 34, 31, 29],
      [100, 63, 49, 41, 36, 33, 30],
      [100, 61, 46, 38, 33, 30, 28],
      [100, 64, 51, 43, 38, 35, 32],
      [100, 66, 52, 44, 39, 36, 33]
    ];
    for (let i = 0; i < 7; i++) {
      for (let j = 0; j < 7; j++) {
        retentionData.push([j, i, retentionValues[i][j]]);
      }
    }
    initChart('chart-retention', {
      backgroundColor: 'transparent',
      tooltip: {
        position: 'top',
        formatter: p => `${dates7[p.data[0]]} ${days[p.data[1]]}: ${p.data[2]}%`
      },
      grid: { left: 60, right: 10, top: 10, bottom: 30 },
      xAxis: {
        type: 'category',
        data: dates7,
        axisLabel: { color: '#64748b', fontSize: 9 },
        splitArea: { show: true, areaStyle: { color: ['rgba(30,41,59,0.3)', 'rgba(30,41,59,0.5)'] } }
      },
      yAxis: {
        type: 'category',
        data: days,
        axisLabel: { color: '#64748b', fontSize: 9 },
        splitArea: { show: true }
      },
      visualMap: {
        min: 0,
        max: 100,
        calculable: false,
        orient: 'horizontal',
        left: 'center',
        bottom: 0,
        itemWidth: 10,
        itemHeight: 60,
        textStyle: { color: '#64748b', fontSize: 9 },
        inRange: {
          color: ['#1e293b', '#3b82f6', '#22c55e', '#facc15']
        }
      },
      series: [{
        type: 'heatmap',
        data: retentionData,
        label: { show: true, color: '#f1f5f9', fontSize: 9, formatter: '{@score}%' },
        itemStyle: { borderColor: '#0f172a', borderWidth: 1 }
      }]
    });

    // ===================== 7. 知识点掌握度热力图 =====================
    const knowledgeGroups = ['新学员', '成长学员', '高阶学员'];
    const knowledgePoints = [
      '基础语法', '数据结构', '算法', '数据库', '网络协议',
      '框架应用', '性能优化', '安全', '架构设计', 'DevOps'
    ];
    const knowledgeData = [];
    const knowledgeValues = [
      [85, 72, 60, 55, 40, 35, 25, 20, 15, 10],
      [92, 85, 78, 72, 65, 60, 50, 45, 35, 28],
      [98, 95, 92, 88, 85, 82, 78, 75, 70, 65]
    ];
    for (let i = 0; i < 3; i++) {
      for (let j = 0; j < 10; j++) {
        knowledgeData.push([j, i, knowledgeValues[i][j]]);
      }
    }
    initChart('chart-knowledge', {
      backgroundColor: 'transparent',
      tooltip: {
        position: 'top',
        formatter: p => `${knowledgePoints[p.data[0]]} / ${knowledgeGroups[p.data[1]]}: ${p.data[2]}%`
      },
      grid: { left: 70, right: 10, top: 10, bottom: 50 },
      xAxis: {
        type: 'category',
        data: knowledgePoints,
        axisLabel: { color: '#64748b', fontSize: 9, rotate: 30 },
        splitArea: { show: true, areaStyle: { color: ['rgba(30,41,59,0.3)', 'rgba(30,41,59,0.5)'] } }
      },
      yAxis: {
        type: 'category',
        data: knowledgeGroups,
        axisLabel: { color: '#64748b', fontSize: 10 },
        splitArea: { show: true }
      },
      visualMap: {
        min: 0,
        max: 100,
        calculable: false,
        orient: 'horizontal',
        left: 'center',
        bottom: 0,
        itemWidth: 10,
        itemHeight: 60,
        textStyle: { color: '#64748b', fontSize: 9 },
        inRange: {
          color: ['#1e293b', '#3b82f6', '#22c55e', '#facc15']
        }
      },
      series: [{
        type: 'heatmap',
        data: knowledgeData,
        label: { show: true, color: '#f1f5f9', fontSize: 9, formatter: '{@score}%' },
        itemStyle: { borderColor: '#0f172a', borderWidth: 1 }
      }]
    });

    // ===================== 8. 学习时段分布热力图 =====================
    const weekDays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const hourLabels = Array.from({ length: 24 }, (_, i) => String(i));
    const timeData = [];
    const timeValues = [
      [5,3,2,1,1,2,8,25,45,55,60,58,52,50,48,45,42,38,30,22,18,15,12,8],
      [6,4,3,2,1,3,10,28,48,58,62,60,55,52,50,48,45,40,32,25,20,16,13,9],
      [5,3,2,1,1,2,9,26,46,56,60,58,53,51,49,46,43,39,31,23,19,15,12,8],
      [7,5,3,2,2,4,12,30,50,60,65,62,58,55,52,50,47,42,35,28,22,18,14,10],
      [8,6,4,3,2,5,15,35,55,65,70,68,62,58,55,52,50,45,38,30,25,20,16,12],
      [20,15,10,8,5,6,12,20,30,40,50,55,58,60,62,60,55,50,45,40,35,30,25,22],
      [22,18,12,10,8,8,14,22,32,42,52,58,62,65,68,65,60,55,50,45,40,35,30,26]
    ];
    for (let i = 0; i < 7; i++) {
      for (let j = 0; j < 24; j++) {
        timeData.push([j, i, timeValues[i][j]]);
      }
    }
    initChart('chart-time-heatmap', {
      backgroundColor: 'transparent',
      tooltip: {
        position: 'top',
        formatter: p => `${weekDays[p.data[1]]} ${p.data[0]}:00 学习人数: ${p.data[2]}`
      },
      grid: { left: 40, right: 10, top: 10, bottom: 30 },
      xAxis: {
        type: 'category',
        data: hourLabels,
        axisLabel: { color: '#64748b', fontSize: 8, interval: 2 },
        splitArea: { show: true, areaStyle: { color: ['rgba(30,41,59,0.3)', 'rgba(30,41,59,0.5)'] } }
      },
      yAxis: {
        type: 'category',
        data: weekDays,
        axisLabel: { color: '#64748b', fontSize: 9 },
        splitArea: { show: true }
      },
      visualMap: {
        min: 0,
        max: 70,
        calculable: false,
        orient: 'horizontal',
        left: 'center',
        bottom: 0,
        itemWidth: 10,
        itemHeight: 60,
        textStyle: { color: '#64748b', fontSize: 9 },
        inRange: {
          color: ['#1e293b', '#3b82f6', '#22c55e', '#facc15']
        }
      },
      series: [{
        type: 'heatmap',
        data: timeData,
        itemStyle: { borderColor: '#0f172a', borderWidth: 1 }
      }]
    });

    // ===================== 9. 完课率漏斗（HTML） =====================
    const funnelSteps = [
      { label: '报名', pct: 100, color: '#22c55e' },
      { label: '开始', pct: 85, color: '#3b82f6' },
      { label: '完成50%', pct: 62, color: '#facc15' },
      { label: '完成100%', pct: 48, color: '#f59e0b' },
      { label: '获得证书', pct: 38, color: '#ef4444' }
    ];
    const funnelWrap = document.getElementById('funnel-html');
    funnelSteps.forEach((step, idx) => {
      const row = document.createElement('div');
      row.className = 'funnel-row';
      const widthPct = 30 + (step.pct / 100) * 60;
      row.innerHTML = `
        <div class="funnel-label">${step.label}</div>
        <div class="funnel-bar-wrap">
          <div class="funnel-bar" style="width:${widthPct}%;background:${step.color};opacity:0.9;">${step.pct}%</div>
        </div>
        <div class="funnel-pct">${step.pct}%</div>
      `;
      funnelWrap.appendChild(row);
    });

    // ===================== resize 监听 =====================
    window.addEventListener('resize', () => {
      chartInstances.forEach(c => c && c.resize());
    });
  </script>
</body>
</html>
