<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js 'unsafe-inline';
               style-src 'unsafe-inline';
               img-src data: https: blob:;
               font-src https://cdn.jsdelivr.net/;
               connect-src __BEZEL_SERVER_ORIGIN__;
               frame-ancestors 'self';
               base-uri 'none';
               form-action 'none'">
<meta name="__JSON_HASH__" content="sha256:placeholder">
<title>在线教育数据中心</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
:root {
  /* Color palette -- Organic education yellow */
  --bezel-bg-app: #0f172a;
  --bezel-bg-rgb: 15,23,42;
  --bezel-accent-primary: #facc15;
  --bezel-accent-secondary: #3b82f6;
  --bezel-accent-primary-rgb: 250,204,21;
  --bezel-accent-secondary-rgb: 59,130,246;
  --bezel-text-strong: #e2e8f0;
  --bezel-text-muted: #94a3b8;
  --bezel-font-stack: 'PingFang SC','Microsoft YaHei',sans-serif;

  /* Card tokens */
  --card-radius: 18px;
  --card-bg: rgba(15,23,42,0.40);
  --card-border: 1px solid rgba(250,204,21,0.12);
  --card-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.06);
  --card-padding: 20px;
  --card-blur: 14px;

  /* Motion tokens */
  --motion-duration: 500ms;
  --motion-easing: cubic-bezier(0.25,0.1,0.25,1);
  --motion-ambient: breathing 6s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-duration: 0ms;
    --motion-ambient: none;
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: var(--bezel-font-stack);
  color: var(--bezel-text-strong);
  background: var(--bezel-bg-app);
}

body {
  margin: 0; padding: 0;
  background: linear-gradient(135deg, var(--bezel-bg-app) 0%, rgba(250,204,21,0.06) 50%, var(--bezel-bg-app) 100%);
}

/* Background blobs */
.bg-blob {
  position: fixed;
  border-radius: 50%;
  filter: blur(100px);
  pointer-events: none;
  z-index: 0;
  will-change: transform;
}
.blob-1 {
  width: 60vw; height: 60vw;
  top: -15vw; left: -10vw;
  background: radial-gradient(circle, rgba(250,204,21,0.15), transparent 70%);
  animation: drift1 10s ease-in-out infinite alternate;
}
.blob-2 {
  width: 50vw; height: 50vw;
  bottom: -10vw; right: -10vw;
  background: radial-gradient(circle, rgba(59,130,246,0.12), transparent 70%);
  animation: drift2 12s ease-in-out infinite alternate;
}
.blob-3 {
  width: 35vw; height: 35vw;
  top: 40%; left: 55%;
  background: radial-gradient(circle, rgba(250,204,21,0.08), transparent 70%);
  animation: drift3 14s ease-in-out infinite alternate;
}
@keyframes drift1 { to { transform: translate(5vw, 3vw); } }
@keyframes drift2 { to { transform: translate(-4vw, -5vw); } }
@keyframes drift3 { to { transform: translate(-3vw, 4vw); } }
@media (prefers-reduced-motion: reduce) {
  .bg-blob { animation: none; filter: blur(80px); }
}

/* Dashboard layout -- flex-wrap Organic */
.dashboard {
  position: relative;
  z-index: 1;
  width: 100vw;
  height: 100vh;
  padding: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-content: flex-start;
  overflow: hidden;
}

/* Header */
.header {
  width: 100%;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.header h1 {
  font-size: 20px;
  font-weight: 400;
  letter-spacing: 3px;
  color: var(--bezel-text-strong);
}

/* Widgets */
.widget-wide { flex: 2 1 55%; min-width: 300px; }
.widget-narrow { flex: 1 1 30%; min-width: 200px; }
.widget-breathe { margin-top: 12px; }

/* Card */
.card {
  background: var(--card-bg);
  border-radius: var(--card-radius);
  border: 1px solid rgba(250,204,21,0.12);
  backdrop-filter: blur(var(--card-blur));
  padding: var(--card-padding);
  display: flex;
  flex-direction: column;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.06);
  transition: transform var(--motion-duration) var(--motion-easing),
              box-shadow var(--motion-duration) var(--motion-easing);
  height: 100%;
}
.card:hover {
  transform: scale(1.01);
  box-shadow: 0 2px 8px rgba(0,0,0,0.10), 0 12px 32px rgba(0,0,0,0.10);
}

.card-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--bezel-text-strong);
  text-align: left;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.chart-box { flex: 1; min-height: 0; }

/* Breathing animation */
@keyframes breathing {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.008); }
}
.card-breathe {
  animation: breathing 6s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  .card-breathe { animation: none; }
}

/* KPI soft cards */
.kpi-row {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
}
.kpi-soft {
  background: rgba(15,23,42,0.25);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 120px;
  flex: 1;
}
.kpi-soft .icon {
  width: 28px; height: 28px;
  color: var(--bezel-accent-primary);
  margin-bottom: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.kpi-soft .value {
  font-size: 24px;
  font-weight: 700;
  color: var(--bezel-text-strong);
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}
.kpi-soft .label {
  font-size: 12px;
  color: var(--bezel-text-muted);
}
.kpi-soft .description {
  font-size: 11px;
  color: var(--bezel-text-muted);
  opacity: 0.7;
  margin-top: 2px;
}

/* Learning path steps */
.path-flow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 4px;
  gap: 4px;
}
.path-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
  position: relative;
}
.path-step:not(:last-child)::after {
  content: '';
  position: absolute;
  top: 14px;
  right: -50%;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, var(--bezel-accent-primary), rgba(250,204,21,0.2));
  z-index: 0;
}
.path-step.done:not(:last-child)::after {
  background: linear-gradient(90deg, var(--bezel-accent-primary), var(--bezel-accent-primary));
}
.path-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700;
  z-index: 1; position: relative;
  border: 2px solid;
}
.path-dot.done {
  background: var(--bezel-accent-primary);
  border-color: var(--bezel-accent-primary);
  color: #0f172a;
  box-shadow: 0 0 12px rgba(250,204,21,0.4);
}
.path-dot.progress {
  background: rgba(250,204,21,0.15);
  border-color: var(--bezel-accent-primary);
  color: var(--bezel-accent-primary);
}
.path-dot.pending {
  background: rgba(148,163,184,0.1);
  border-color: var(--bezel-text-muted);
  color: var(--bezel-text-muted);
}
.path-label { font-size: 11px; color: var(--bezel-text-muted); white-space: nowrap; }
.path-pct { font-size: 11px; font-weight: 700; color: var(--bezel-accent-primary); }

/* Funnel */
.funnel-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 8px 0;
  flex: 1;
}
.funnel-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}
.funnel-bar-wrap { flex: 1; display: flex; justify-content: center; }
.funnel-bar {
  height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #0f172a;
  transition: all 0.4s var(--motion-easing);
}
.funnel-bar:hover { filter: brightness(1.15); transform: scaleX(1.02); }
.funnel-label { width: 70px; font-size: 11px; color: var(--bezel-text-muted); text-align: right; flex-shrink: 0; }
.funnel-pct { width: 42px; font-size: 12px; font-weight: 700; color: var(--bezel-text-strong); text-align: left; flex-shrink: 0; }
</style>
</head>
<body>
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="bg-blob blob-3"></div>

<div class="dashboard">
  <!-- Header -->
  <div class="header">

  <!-- KPI soft row -->

    <div class="kpi-soft" aria-label="总学员数 12480人 同比增长8%">

<script>
/* ==================== BEZEL CONFIG ==================== */
window.__BEZEL_CONFIG__ = {
  dashboardId: "12-education",
  style: "organic",
  refreshInterval: 30000,
  widgets: [
    { id: "gauge", type: "gauge" },
    { id: "category", type: "bar" },
    { id: "online", type: "line" },
    { id: "satisfaction", type: "line" },
    { id: "retention", type: "heatmap" },
    { id: "ranking", type: "bar" },
    { id: "knowledge", type: "heatmap" },
    { id: "time-heatmap", type: "heatmap" }
  ]
};

/* ==================== POLLING SCHEDULER ==================== */
(function() {
  var cfg = window.__BEZEL_CONFIG__;
  var interval = cfg.refreshInterval || 30000;
  function poll() {
    cfg.widgets.forEach(function(w) {
      var url = "/api/dashboards/" + cfg.dashboardId + "/widgets/" + w.id + "/data";
      fetch(url).then(function(r) { return r.json(); }).then(function(data) {
        window.dispatchEvent(new CustomEvent("bezel:data:" + w.id, { detail: data }));
      }).catch(function() {});
    });
  }
  setInterval(poll, interval);
})();

/* ==================== KPI COUNT-UP ==================== */
function countUp(el, target, duration) {
  duration = duration || 1500;
  var decimal = parseInt(el.dataset.decimal || '0', 10);
  var suffix = el.dataset.suffix || '';
  var startTime = null;
  function tick(ts) {
    if (!startTime) startTime = ts;
    var p = Math.min((ts - startTime) / duration, 1);
    var ease = 1 - Math.pow(1 - p, 3);
    el.textContent = (decimal > 0 ? (target * ease).toFixed(decimal) : Math.round(target * ease).toLocaleString()) + suffix;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

document.querySelectorAll('.kpi-soft .value').forEach(function(el) {
  var target = parseFloat(el.dataset.target);
  countUp(el, target, 1500);
});

/* ==================== ECHARTS ==================== */
var chartInstances = [];

var darkTheme = {
  backgroundColor: 'transparent',
  textStyle: { fontFamily: "'PingFang SC','Microsoft YaHei',sans-serif", color: '#94a3b8' },
  tooltip: { backgroundColor: 'rgba(15,23,42,0.92)', borderColor: 'rgba(250,204,21,0.20)', textStyle: { color: '#e2e8f0' } }
};

function initChart(domId, option) {
  var el = document.getElementById(domId);
  if (!el) return null;
  var chart = echarts.init(el, null, { renderer: 'canvas' });
  chart.setOption(Object.assign({}, darkTheme, option));
  chartInstances.push(chart);
  return chart;
}

/* 1. Course completion gauge */
initChart('chart-gauge', {
  series: [{
    type: 'gauge',
    radius: '90%',
    startAngle: 210,
    endAngle: -30,
    min: 0, max: 100,
    splitNumber: 10,
    itemStyle: { color: '#facc15' },
    progress: { show: true, width: 18, roundCap: true },
    pointer: { show: true, length: '60%', width: 6, itemStyle: { color: '#facc15' } },
    axisLine: {
      lineStyle: {
        width: 18,
        color: [[0.5,'#ef4444'],[0.7,'#facc15'],[1,'#22c55e']]
      }
    },
    axisTick: { show: false },
    splitLine: { length: 10, lineStyle: { width: 2, color: '#334155' } },
    axisLabel: { distance: 22, color: '#64748b', fontSize: 10 },
    title: { show: true, offsetCenter: [0,'30%'], fontSize: 14, color: '#94a3b8' },
    detail: {
      valueAnimation: true, fontSize: 42, fontWeight: 700,
      offsetCenter: [0,'-10%'], formatter: '{value}%', color: '#f1f5f9'
    },
    data: [{ value: 68, name: '课程完成率' }]
  }]
});

/* 2. Category learning hours */
initChart('chart-category', {
  tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
  grid: { left: 3, right: 30, top: 8, bottom: 3, containLabel: true },
  xAxis: {
    type: 'value',
    axisLabel: { color: '#64748b', fontSize: 10, formatter: '{value}h' },
    splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } }
  },
  yAxis: {
    type: 'category',
    data: ['其他','商业','语言','设计','编程'],
    axisLabel: { color: '#94a3b8', fontSize: 11 },
    axisLine: { show: false }, axisTick: { show: false }
  },
  series: [{
    type: 'bar',
    data: [
      { value: 1.8, itemStyle: { color: '#64748b', borderRadius: [0,6,6,0] } },
      { value: 3.2, itemStyle: { color: '#3b82f6', borderRadius: [0,6,6,0] } },
      { value: 4.5, itemStyle: { color: '#22c55e', borderRadius: [0,6,6,0] } },
      { value: 5.1, itemStyle: { color: '#facc15', borderRadius: [0,6,6,0] } },
      { value: 6.8, itemStyle: { color: '#f59e0b', borderRadius: [0,6,6,0] } }
    ],
    barWidth: 14,
    label: { show: true, position: 'right', color: '#f1f5f9', fontSize: 11, formatter: '{c}h' }
  }]
});

/* 3. Online trend 24h (smooth line with area) */
var hours24 = []; for (var h=0;h<24;h++) hours24.push(String(h).padStart(2,'0')+':00');
var visitorData = [120,95,80,65,55,70,150,380,620,780,850,920,980,1050,1120,1080,950,820,750,680,550,420,310,200];
initChart('chart-online', {
  tooltip: { trigger: 'axis' },
  grid: { left: 8, right: 12, top: 20, bottom: 20, containLabel: true },
  xAxis: {
    type: 'category', data: hours24,
    axisLabel: { color: '#64748b', fontSize: 9, interval: 2 },
    axisLine: { lineStyle: { color: 'rgba(148,163,184,0.15)' } }
  },
  yAxis: {
    type: 'value',
    axisLabel: { color: '#64748b', fontSize: 10 },
    splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } }
  },
  series: [{
    type: 'line', data: visitorData, smooth: true, symbol: 'none',
    lineStyle: { color: '#3b82f6', width: 2.5 },
    areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(59,130,246,0.25)'},{offset:1,color:'rgba(59,130,246,0.02)'}]) }
  }]
});

/* 4. Satisfaction trend */
initChart('chart-satisfaction', {
  tooltip: { trigger: 'axis' },
  grid: { left: 8, right: 12, top: 20, bottom: 20, containLabel: true },
  xAxis: {
    type: 'category', data: ['Q1','Q2','Q3','Q4'],
    axisLabel: { color: '#64748b', fontSize: 11 },
    axisLine: { lineStyle: { color: 'rgba(148,163,184,0.15)' } }
  },
  yAxis: {
    type: 'value', min: 85, max: 100,
    axisLabel: { color: '#64748b', fontSize: 10, formatter: '{value}%' },
    splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } }
  },
  series: [{
    type: 'line', data: [90.5,91.8,93.1,94.2], smooth: true, symbol: 'circle', symbolSize: 6,
    lineStyle: { color: '#22c55e', width: 2.5 },
    itemStyle: { color: '#22c55e', borderColor: '#0f172a', borderWidth: 2 },
    label: { show: true, position: 'top', color: '#f1f5f9', fontSize: 11, formatter: '{c}%' }
  }]
});

/* 5. Retention heatmap */
var days = ['Day 0','Day 1','Day 2','Day 3','Day 4','Day 5','Day 6'];
var dates7 = ['05-05','05-06','05-07','05-08','05-09','05-10','05-11'];
var retentionValues = [
  [100,62,48,40,35,32,30],[100,65,50,42,37,34,31],[100,60,47,39,34,31,29],
  [100,63,49,41,36,33,30],[100,61,46,38,33,30,28],[100,64,51,43,38,35,32],[100,66,52,44,39,36,33]
];
var retentionData = [];
for (var i=0;i<7;i++) for (var j=0;j<7;j++) retentionData.push([j,i,retentionValues[i][j]]);
initChart('chart-retention', {

    '<div class="funnel-pct">' + step.pct + '%</div>';
  funnelWrap.appendChild(row);
});
