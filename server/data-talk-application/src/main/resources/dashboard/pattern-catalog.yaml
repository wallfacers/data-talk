  generic.kpi-tile:
    description: "KPI 数值卡片(value/label/delta/trend)"
    renderKind: html
    defaultChartType: null
    supportedChartTypes: []
    defaultColorScheme: brand
    supportedColorSchemes: [brand]
  generic.echarts-card:
    description: "标准卡片包裹的 ECharts 图表"
    renderKind: chart
    defaultChartType: bar
    supportedChartTypes: [bar, line, area, pie, funnel, scatter, radar, map]
    defaultColorScheme: brand
    supportedColorSchemes: [warm, cool, monochrome, brand]
  generic.table:
    description: "可滚动数据表"
    renderKind: html
    defaultChartType: null
    supportedChartTypes: []
    defaultColorScheme: brand
    supportedColorSchemes: [brand]
  generic.markdown:
