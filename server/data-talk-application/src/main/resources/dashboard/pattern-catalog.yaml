# bezel pattern-catalog — 单一真源(SINGLE SOURCE OF TRUTH)
# 运行时由 PatternCatalog 加载并强制执行;构建期由 scripts/generate-bezel-docs.sh 生成 AI 文档。
# 修改本文件后 MUST 运行生成脚本并提交产物,否则 CI `git diff --exit-code` 会失败。

# ---- 配色方案 ----
colorSchemes: [warm, cool, monochrome, brand]

# ---- 图表类型(8 种)----
chartTypes:
  bar:
    defaultOptionFile: echarts-options/bar.json
    semanticFields: [stacked, showLegend, showTooltip, labelPosition, gridGap]
  line:
    defaultOptionFile: echarts-options/line.json
    semanticFields: [stacked, showLegend, showTooltip, showAreaFill, labelPosition, gridGap]
  area:
    defaultOptionFile: echarts-options/area.json
    semanticFields: [stacked, showLegend, showTooltip, labelPosition, gridGap]
  pie:
    defaultOptionFile: echarts-options/pie.json
    semanticFields: [showLegend, showTooltip, labelPosition]
  funnel:
    defaultOptionFile: echarts-options/funnel.json
    semanticFields: [showLegend, showTooltip, labelPosition]
  scatter:
    defaultOptionFile: echarts-options/scatter.json
    semanticFields: [showLegend, showTooltip, gridGap]
  radar:
    defaultOptionFile: echarts-options/radar.json
    semanticFields: [showLegend, showTooltip, showAreaFill]
  map:
    defaultOptionFile: echarts-options/map.json
    semanticFields: [showTooltip]
    needsGeo: true

# ---- 布局模板(6 个,各声明具名 slot:id/kind/capacity)----
# kind: kpi | chart | table | any   capacity: 该 slot 容纳 widget 上限
templates:
  - id: single-focus
    description: "大图表居中 + KPI 环绕"
    style: monument
    slots:
      - { id: hero, kind: chart, capacity: 1 }
      - { id: kpi-ring, kind: kpi, capacity: 4 }
  - id: two-column-left-heavy
    description: "左侧 62% 主图 + 右侧 38% 辅助"
    style: mosaic
    slots:
      - { id: main, kind: chart, capacity: 2 }
      - { id: side, kind: any, capacity: 3 }
  - id: two-column-right-heavy
    description: "左侧 38% 辅助 + 右侧 62% 主图"
    style: mosaic
    slots:
      - { id: side, kind: any, capacity: 3 }
      - { id: main, kind: chart, capacity: 2 }
  - id: three-column-kpi-center
    description: "左 KPI + 中主图 + 右明细"
    style: horizon
    slots:
      - { id: kpi-rail, kind: kpi, capacity: 4 }
      - { id: center-main, kind: chart, capacity: 2 }
      - { id: right-detail, kind: any, capacity: 3 }
  - id: top-kpi-bottom-charts
    description: "顶部 KPI 条 + 下方图表区"
    style: orbital
    slots:
      - { id: kpi-bar, kind: kpi, capacity: 6 }
      - { id: chart-grid, kind: any, capacity: 6 }
  - id: grid-equal
    description: "等分网格 2×3 或 3×2"
    style: organic
    slots:
      - { id: grid, kind: any, capacity: 6 }

# ---- 行业 → 风格 → CSS 主题映射 ----
themes:
  - { slug: multi-screen, style: orbital, css: styles/orbital.css }
  - { slug: ecommerce, style: mosaic, css: styles/ecommerce.css }
  - { slug: manufacturing, style: horizon, css: styles/manufacturing.css }
  - { slug: saas, style: mosaic, css: styles/saas.css }
  - { slug: finance, style: monument, css: styles/finance.css }
  - { slug: logistics, style: horizon, css: styles/logistics.css }
  - { slug: healthcare, style: organic, css: styles/healthcare.css }
  - { slug: hr, style: organic, css: styles/hr.css }
  - { slug: energy, style: terrain, css: styles/energy.css }
  - { slug: cybersecurity, style: orbital, css: styles/cybersecurity.css }
  - { slug: agriculture, style: terrain, css: styles/agriculture.css }
  - { slug: education, style: organic, css: styles/education.css }

# ---- Widget patterns ----
# renderKind: chart → 编译器 echarts.init;html → 纯 DOM,禁止 init
patterns:
