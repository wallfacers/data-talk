action.execute_sql.description=在指定数据源上执行 SELECT 查询，并将结果保存为表格工件。
action.get_data_context.description=返回当前会话的数据上下文，包括连接、数据库和 schema。
action.list_connection_targets.description=列出某个连接下可选择的数据库和 schema。
action.list_connections.description=列出当前已保存的数据源连接。
action.pin_artifact.description=将工件固定在当前会话的客户端时间线中。这是客户端侧时间线动作，不是后端持久化。
action.read_schema.description=返回指定数据源的只读表和列元数据。
action.render_chart.description=渲染 ECharts 配置图表，并可替换先前图表。
action.resolve_use_target.description=将原始 use 目标解析为当前会话可用的连接、数据库或 schema。
action.select_connection.description=把已保存的数据源连接设为当前会话连接。
action.set_data_context.description=更新当前会话的数据上下文。
action.supersede_artifact.description=显式标记一个工件已被另一个工件替代。
action.test_connection.description=测试一个已保存连接的连通性。
action.update_connection_confirmable.description=预览并确认对已保存连接的修改。
action.create_connection.description=创建一个新的已保存连接。
action.ui_read.description=从客户端读取 workspace 或 query_editor 的 state、schema、actions 或完整描述。
action.ui_patch.description=使用 UI Object Protocol 应用客户端侧 query_editor、er_inspector 或 er_designer 补丁。
action.ui_exec.description=在客户端执行 workspace、query_editor、er_inspector 或 er_designer 动作，包括 open_er_inspector、open_er_designer、bind_target、diff_against_db、generate_ddl、refresh、auto_layout、fit_view、add_neighbors、apply_text_edits、run_sql、format_sql 和 focus。仅当数据库相关请求需要数据源时使用 choose_connection。
action.ui_exec.workspace.open_er_inspector.description=Open an ER inspector tab for the given seed tables and direct/indirect neighbors.
action.ui_exec.workspace.open_er_designer.description=Open an ER designer tab for an empty or seeded schema draft.
action.ui_exec.er_inspector.refresh.description=Re-read tables from the connection and update the inspector snapshot.
action.ui_exec.er_inspector.auto_layout.description=Recompute node positions via dagre.
action.ui_exec.er_inspector.fit_view.description=Reset the inspector viewport.
action.ui_exec.er_inspector.add_neighbors.description=Add a table's direct FK neighbors to the inspector selection.
action.ui_exec.er_inspector.fork_to_designer.description=Create a designer tab seeded from this inspector. Implemented in Plan B.
action.ui_exec.er_designer.auto_layout.description=在设计器画布上通过 dagre 重新计算节点位置。
action.ui_exec.er_designer.fit_view.description=重置设计器视口。
action.ui_exec.er_designer.bind_target.description=绑定目标数据源，让 generate_ddl / diff_against_db 能与真实数据库对比。
action.ui_exec.er_designer.unbind_target.description=解除目标数据源绑定，设计器恢复为无连接草稿。
action.ui_exec.er_designer.sync_from_db.description=从已绑定数据源的真实 schema 刷新设计器表。
action.ui_exec.er_designer.diff_against_db.description=返回设计器草稿与已绑定数据库之间的 schema 差异，不生成 DDL。
action.ui_exec.er_designer.generate_ddl.description=计算差异并把 CREATE/ALTER/INDEX 语句写入新的 query_editor 标签页，返回 queryEditorTabId 供用户检查并通过 L2/L3 确认执行。
