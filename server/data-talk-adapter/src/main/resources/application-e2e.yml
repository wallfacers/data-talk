# E2E test profile — NEVER load in production/staging/shared-dev
# Relaxes the *conditional* SSRF deny list so the local mock HTTP server on
# 127.0.0.1 / localhost is reachable. The always-enforced host-deny-always list
# (cloud metadata endpoints) continues to block 169.254.169.254 etc.
# Lowers payload-max-bytes to 1 MB so "payload too large" path can be exercised quickly.
datatalk:
  ingestion:
    ssrf-deny-enabled: false
    fetch-timeout-ms: 5000
    payload-max-bytes: 1048576
spring:
  flyway:
    locations: classpath:db/migration
