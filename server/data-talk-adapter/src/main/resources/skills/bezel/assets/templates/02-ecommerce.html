<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/ https://__BEZEL_SERVER_ORIGIN__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://__BEZEL_SERVER_ORIGIN__;">
<meta name="__JSON_HASH__" content="">
<title>电商运营实时监控中心</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  :root {
    --bg-rgb: 18,14,10;
    --accent-primary-rgb: 255,68,68;
    --accent-secondary-rgb: 255,193,7;
    --bezel-bg-app: #0d0a07;
    --bezel-accent-primary: #ff4444;
    --bezel-accent-secondary: #ffc107;
    --bezel-text-strong: #e0e8f0;
    --bezel-text-muted: #8899aa;
    --bezel-font-stack: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --card-radius: 4px;
    --card-bg: rgba(var(--bg-rgb), 0.85);
    --card-border: none;
    --card-shadow: none;
    --card-padding: 10px;
    --card-blur: 0;
    --motion-duration: 150ms;
    --motion-easing: cubic-bezier(0.4, 0, 0.2, 1);
    --motion-ambient: none;
  }
  @media (prefers-reduced-motion: reduce) {
    :root {
      --motion-duration: 0ms;
      --motion-ambient: none;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh; overflow: hidden;
    background: linear-gradient(135deg, var(--bezel-bg-app) 0%, rgba(var(--accent-primary-rgb), 0.03) 100%);
    font-family: var(--bezel-font-stack);
    color: var(--bezel-text-strong);
  }

  /* Grid layout */
  .dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 80px 1fr 1fr 1fr;
    gap: 6px;
    padding: 6px;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    grid-template-areas:
      "title  kpi1   kpi2   kpi3"
      "funnel funnel channel gauge"
      "treemap treemap cohort cohort"
      "trend    trend  matrix category";
  }

  /* Card base */
  .card {
    background: var(--card-bg);
    border-radius: var(--card-radius);
    border: var(--card-border);
    padding: var(--card-padding);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    transition: transform var(--motion-duration) var(--motion-easing);
  }
  .card:hover {
    transform: translateY(-2px);
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--bezel-text-muted);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .card-body {
    flex: 1;
    min-height: 0;
    position: relative;
  }

  /* Title cell */
  .cell-title {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 12px;
    background: var(--card-bg);
    border-radius: var(--card-radius);
  }
  .cell-title h1 {
    font-size: 18px;
    font-weight: 600;
    color: var(--bezel-accent-secondary);
    letter-spacing: 2px;
  }
  .cell-title .subtitle {
    font-size: 10px;
    color: var(--bezel-text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .cell-title .clock {
    font-size: 12px;
    color: var(--bezel-text-muted);
    font-variant-numeric: tabular-nums;
    margin-top: 4px;
  }

  /* KPI blocks */
  .kpi-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    background: var(--card-bg);
    border-radius: var(--card-radius);
  }
  .kpi-block .value {
    font-size: 32px;
    font-weight: 700;
    color: var(--bezel-text-strong);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .kpi-block .value.highlight {
    color: var(--bezel-accent-primary);
  }
  .kpi-block .value.gold {
    color: var(--bezel-accent-secondary);
  }
  .kpi-block .label {
    font-size: 10px;
    color: var(--bezel-text-muted);
    margin-top: 4px;
  }
  .kpi-block .trend {
    font-size: 10px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .trend.up { color: var(--bezel-accent-primary); }
  .trend.down { color: #00e676; }

  /* Grid area assignments */
  .area-title   { grid-area: title; }
  .area-kpi1    { grid-area: kpi1; }
  .area-kpi2    { grid-area: kpi2; }
  .area-kpi3    { grid-area: kpi3; }
  .area-funnel  { grid-area: funnel; }
  .area-channel { grid-area: channel; }
  .area-gauge   { grid-area: gauge; }
  .area-map     { grid-area: treemap; }
  .area-cohort  { grid-area: cohort; }
  .area-trend   { grid-area: trend; }
  .area-matrix  { grid-area: matrix; }
  .area-category { grid-area: category; }

  /* Funnel */
  .funnel-wrap {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 4px;
    height: 100%;
    padding-bottom: 4px;
  }
  .funnel-step {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    justify-content: flex-end;
  }
  .funnel-bar {
    width: 100%;
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    padding: 6px 2px;
    text-align: center;
    line-height: 1.3;
    background: var(--bezel-accent-primary);
  }
  .funnel-bar small {
    font-size: 9px;
    font-weight: 400;
    opacity: .9;
  }
  .funnel-label {
    font-size: 10px;
    color: var(--bezel-text-muted);
    margin-top: 3px;
  }
  .funnel-pct {
    font-size: 9px;
    color: var(--bezel-accent-secondary);
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="dashboard">
  <!-- Title cell -->
  <div class="area-title cell-title" role="region" aria-label="Dashboard title">
    <h1>电商运营监控</h1>
    <div class="subtitle">E-Commerce Operations</div>
    <div class="clock" id="clock">0000-00-00 00:00:00</div>
  </div>

  <!-- KPI 1: GMV -->
  <div class="area-kpi1 kpi-block" role="region" aria-label="KPI: Today GMV">
    <div class="value highlight" data-target="2847" data-suffix="万" data-decimal="0">0</div>
    <div class="label">今日 GMV</div>
    <div class="trend up">+24.6%</div>
  </div>

  <!-- KPI 2: Orders -->
  <div class="area-kpi2 kpi-block" role="region" aria-label="KPI: Orders">
    <div class="value gold" data-target="156.8" data-suffix="万" data-decimal="1">0</div>
    <div class="label">订单量</div>
    <div class="trend up">+18.3%</div>
  </div>

  <!-- KPI 3: Conversion -->
  <div class="area-kpi3 kpi-block" role="region" aria-label="KPI: Conversion rate">
    <div class="value" data-target="4.8" data-suffix="%" data-decimal="1">0</div>
    <div class="label">转化率</div>

  <!-- Funnel -->
  <div class="area-funnel card" role="region" aria-label="Conversion funnel">
    <div class="card-title">转化漏斗</div>
    <div class="card-body">
      <div class="funnel-wrap">
        <div class="funnel-step">
          <div class="funnel-bar" style="height:90%">
            <div>UV</div>
            <small>286万</small>
          </div>
          <div class="funnel-label">25.2%</div>
        </div>
        <div class="funnel-step">
          <div class="funnel-bar" style="height:72%">
            <div>详情页</div>
            <small>72万</small>
          </div>
          <div class="funnel-label">25.0%</div>
        </div>
        <div class="funnel-step">
          <div class="funnel-bar" style="height:54%">
            <div>加购</div>
            <small>18万</small>
          </div>
          <div class="funnel-label">86.7%</div>
        </div>
        <div class="funnel-step">
          <div class="funnel-bar" style="height:46%">
            <div>支付</div>
            <small>15.6万</small>
          </div>
          <div class="funnel-pct">4.8%总转化</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Channel pie -->
  <div class="area-channel card" role="region" aria-label="Channel GMV distribution">
    <div class="card-title">渠道 GMV 占比</div>
    <div class="card-body" id="chart-channel"></div>
  </div>

  <!-- Gauge -->
  <div class="area-gauge card" role="region" aria-label="Campaign target completion">
    <div class="card-title">大促目标达成率</div>
    <div class="card-body" id="chart-gauge"></div>
  </div>

  <!-- Regional Treemap -->
  <div class="area-map card" role="region" aria-label="Regional sales treemap">
    <div class="card-title">区域销售分布</div>
    <div class="card-body" id="chart-treemap"></div>
  </div>

  <!-- Cohort -->
  <div class="area-cohort card" role="region" aria-label="User retention cohort">
    <div class="card-title">用户留存 Cohort</div>
    <div class="card-body" id="chart-cohort"></div>
  </div>

  <!-- GMV Trend -->
  <div class="area-trend card" role="region" aria-label="Realtime GMV trend and orders">
    <div class="card-title">实时 GMV 趋势 & 订单量</div>
    <div class="card-body" id="chart-trend"></div>
  </div>

  <!-- Matrix -->
  <div class="area-matrix card" role="region" aria-label="Category correlation matrix">
    <div class="card-title">品类关联购买矩阵</div>
    <div class="card-body" id="chart-matrix"></div>
  </div>

  <!-- Category Ranking -->
  <div class="area-category card" role="region" aria-label="Top 10 category sales ranking">
    <div class="card-title">品类销售排行 TOP10</div>
    <div class="card-body" id="chart-category"></div>
  </div>
</div>

<script>
/* ==================== BEZEL CONFIG ==================== */
window.__BEZEL_CONFIG__ = {
  dashboardId: "02-ecommerce",
  style: "mosaic",
  refreshInterval: 30000,
  widgets: [
    { id: "channel", type: "chart", baseOption: {} },
    { id: "gauge", type: "chart", baseOption: {} },
    { id: "treemap", type: "chart", baseOption: {} },
    { id: "cohort", type: "chart", baseOption: {} },
    { id: "trend", type: "chart", baseOption: {} },
    { id: "matrix", type: "chart", baseOption: {} },
    { id: "category", type: "chart", baseOption: {} }
  ]
};

/* ==================== POLLING SCHEDULER ==================== */
(function() {
  var cfg = window.__BEZEL_CONFIG__;
  if (!cfg) return;
  var charts = {};
  var timers = {};
  var paused = false;

  function bindWidget(w) {
    var el = document.getElementById(w.id);
    if (!el) return;
    // Type-aware initialization (BUG-0055 fix):
    // only chart widgets get echarts.init; KPI/table/etc. are HTML-rendered.
    if (w.type === 'chart') {
      var ch = echarts.init(el);
      // First-paint base option so the chart has series/axes before the first poll.
      if (w.baseOption) ch.setOption(w.baseOption);
      charts[w.id] = ch;
    }
    if (w.intervalMs && w.intervalMs > 0) schedule(w);
  }

  function schedule(w) {
    var interval = w.intervalMs || cfg.defaultIntervalMs || 10000;
    timers[w.id] = setTimeout(function tick() {
      if (paused) { timers[w.id] = setTimeout(tick, interval); return; }
      fetch(w.endpoint, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ params: w.params || {} })
      }).then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function(data) {
        applyWidgetData(w, data);
      }).catch(function(e) {
        parent.postMessage({ type: 'error', widgetId: w.id, message: String(e) }, '*');
      });
      timers[w.id] = setTimeout(tick, interval);
    }, interval);
  }

  function applyWidgetData(w, data) {
    if (w.type === 'chart') {
      var ch = charts[w.id];
      if (!ch) return;
      ch.setOption({ dataset: { source: data.rows } }, { lazyUpdate: true });
      return;
    }
    var el = document.getElementById(w.id);
    if (!el) return;
    applyHtmlData(w.type, el, data.rows || []);
  }

  function applyHtmlData(kind, el, rows) {
    if (kind === 'kpi') {
      var row = rows[0] || {};
      var setText = function(sel, v) {
        var t = el.querySelector(sel);
        if (t && v !== undefined && v !== null) t.textContent = String(v);
      };
      setText('.value', row.value);
      setText('.label', row.label);
      setText('.delta', row.delta);
      var trendEl = el.querySelector('.trend');
      if (trendEl && row.trend) {
        trendEl.classList.remove('up', 'down');
        trendEl.classList.add(row.trend === 'down' ? 'down' : 'up');
      }
      return;
    }
    if (kind === 'table') {
      var tbody = el.querySelector('tbody');
      if (!tbody) return;
      var headerCells = el.querySelectorAll('thead th');
      var cols = Array.prototype.slice.call(headerCells).map(function(th) {
        return th.dataset.column || th.textContent.trim();
      });
      var html = rows.map(function(r) {
        var tds = cols.map(function(c) {
          return '<td>' + escapeHtml(String(r[c] == null ? '' : r[c])) + '</td>';
        }).join('');
        return '<tr>' + tds + '</tr>';
      }).join('');
      tbody.innerHTML = html;
      return;
    }
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function(c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  if (cfg.pauseOnHidden !== false) {
    document.addEventListener('visibilitychange', function() { paused = document.hidden; });
  }

  window.addEventListener('message', function(ev) {
    var m = ev.data;
    if (!m || typeof m !== 'object') return;
    if (m.type === 'refresh/pause') paused = true;
    if (m.type === 'refresh/resume') paused = false;
    if (m.type === 'params/update') {
      cfg.widgets.forEach(function(w) {
        w.params = Object.assign({}, w.params || {}, m.params);
      });
    }
  });

  cfg.widgets.forEach(bindWidget);
  var hm = document.querySelector('meta[name="__JSON_HASH__"]');
  parent.postMessage({ type: 'ready', jsonHash: hm ? hm.content : null }, '*');
})();

/* ==================== CLOCK ==================== */
function updateClock() {
  var now = new Date();
  var pad = function(n) { return String(n).padStart(2, '0'); };
  document.getElementById('clock').textContent =
    now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' +
    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
}
setInterval(updateClock, 1000);
updateClock();

/* ==================== KPI COUNT-UP ==================== */
function countUp(el, target, duration) {
  duration = duration || 800;
  var suffix = el.dataset.suffix || '';
  var decimal = parseInt(el.dataset.decimal) || 0;
  var startTime = null;
  function tick(ts) {
    if (!startTime) startTime = ts;
    var p = Math.min((ts - startTime) / duration, 1);
    var ease = 1 - Math.pow(1 - p, 3);
    var val = target * ease;
    el.textContent = (decimal > 0 ? val.toFixed(decimal) : Math.round(val).toLocaleString()) + suffix;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
document.querySelectorAll('.kpi-block .value[data-target]').forEach(function(el) {
  countUp(el, parseFloat(el.dataset.target));
});

/* ==================== ECHARTS COMMON ==================== */
var commonTooltip = {
  backgroundColor: 'rgba(13,10,7,0.92)',
  borderColor: 'rgba(255,68,68,0.35)',
  textStyle: { color: '#e0e8f0', fontSize: 12 },
  padding: [8, 12]
};
var darkSub = '#8899aa';
var charts = [];

/* Safe ECharts init — returns null if element missing, preventing getAttribute crash */
function safeInit(id) {
  var el = document.getElementById(id);
  return el ? echarts.init(el) : null;
}

/* ==================== 1. CHANNEL PIE ==================== */
var chartChannel = safeInit('chart-channel');
chartChannel.setOption({
  tooltip: Object.assign({}, commonTooltip, { trigger: 'item', formatter: '{b}: {c}万 ({d}%)' }),
  legend: { show: false },
  series: [{
    type: 'pie', radius: ['40%', '66%'], center: ['50%', '55%'],
    itemStyle: { borderRadius: 0, borderColor: '#0d0a07', borderWidth: 2 },
    label: { color: darkSub, fontSize: 10, formatter: '{b}\n{d}%' },
    labelLine: { lineStyle: { color: 'rgba(136,153,170,0.3)' } },
    data: [
      { value: 982, name: '淘宝', itemStyle: { color: '#ff4444' } },
      { value: 625, name: '京东', itemStyle: { color: '#ff6b35' } },
      { value: 498, name: '拼多多', itemStyle: { color: '#ffc107' } },
      { value: 512, name: '抖音', itemStyle: { color: '#ff8a65' } },
      { value: 230, name: '其他', itemStyle: { color: '#5c6bc0' } }
    ]
  }]
});
charts.push(chartChannel);

/* ==================== 2. GAUGE ==================== */
var chartGauge = safeInit('chart-gauge');
chartGauge.setOption({
  series: [{
    type: 'gauge', startAngle: 200, endAngle: -20, min: 0, max: 100,
    splitNumber: 10,
    itemStyle: { color: '#ff4444' },
    progress: { show: true, width: 12 },
    pointer: { show: true, length: '60%', width: 4, itemStyle: { color: '#ffc107' } },
    axisLine: { lineStyle: { width: 12, color: [[1, 'rgba(136,153,170,0.15)']] } },
    axisTick: { show: false },
    splitLine: { length: 6, lineStyle: { width: 1, color: '#8899aa' } },
    axisLabel: { distance: 14, color: darkSub, fontSize: 9, formatter: function(v) { return (v === 0 || v === 50 || v === 100) ? v : ''; } },
    anchor: { show: true, showAbove: true, size: 12, itemStyle: { borderColor: '#ff4444', borderWidth: 2, color: '#0d0a07' } },
    title: { show: false },
    detail: { valueAnimation: true, fontSize: 20, color: '#ffc107', fontWeight: 700, offsetCenter: [0, '70%'], formatter: '{value}%' },
    data: [{ value: 78 }]
  }]
});
charts.push(chartGauge);

/* ==================== 3. REGIONAL TREEMAP ==================== */
var chartTreemap = safeInit('chart-treemap');
var regionData = [
  { name: '华东', value: 82500, children: [
    { name: '上海', value: 19500 }, { name: '江苏', value: 21800 },
    { name: '浙江', value: 24200 }, { name: '福建', value: 10800 }, { name: '安徽', value: 8900 }
  ]},
  { name: '华南', value: 43400, children: [
    { name: '广东', value: 28500 }, { name: '湖南', value: 9600 },
    { name: '广西', value: 4800 }
  ]},
  { name: '华北', value: 43200, children: [
    { name: '北京', value: 18200 }, { name: '山东', value: 16800 },
    { name: '河北', value: 8200 }
  ]},
  { name: '西南', value: 28400, children: [
    { name: '四川', value: 14200 }, { name: '重庆', value: 7100 },
    { name: '云南', value: 5800 }, { name: '贵州', value: 3400 }
  ]},
  { name: '华中', value: 18500, children: [
    { name: '河南', value: 12800 }, { name: '湖北', value: 11500 }
  ]},
  { name: '其他', value: 22700, children: [
    { name: '辽宁', value: 6400 }, { name: '陕西', value: 7500 },
    { name: '天津', value: 10500 }
  ]}
];
chartTreemap.setOption({
  tooltip: Object.assign({}, commonTooltip, { formatter: function(p) { return p.name + '<br/>GMV: ' + p.value + '万'; } }),
  series: [{
    type: 'treemap',
    breadcrumb: { show: false },
    roam: false,
    nodeClick: false,
    itemStyle: {
      borderColor: '#0d0a07',
      borderWidth: 2,
      gapWidth: 2
    },
    label: {
      fontSize: 11,
      color: '#e0e8f0',
      formatter: function(p) { return p.name + '\n' + p.value + '万'; }
    },
    levels: [{
      itemStyle: {
        borderColor: '#0d0a07',
        borderWidth: 2,
        gapWidth: 2
      },
      color: ['#ff4444', '#ff6b35', '#ffc107', '#ff8a65', '#5c6bc0', '#e05038']
    }, {
      itemStyle: {
        borderColor: '#0d0a07',
        borderWidth: 1,
        gapWidth: 1
      },
      colorSaturation: [0.3, 0.7]
    }],
    data: regionData
  }]
});
charts.push(chartTreemap);

/* ==================== 4. COHORT HEATMAP ==================== */
var chartCohort = safeInit('chart-cohort');
var cohortDays = ['Day 0', 'Day 1', 'Day 3', 'Day 7', 'Day 14', 'Day 30'];
var cohortDates = ['05-05', '05-06', '05-07', '05-08', '05-09', '05-10', '05-11'];
var cohortRaw = [
  [100, 45, 35, 28, 22, 18], [100, 46, 36, 29, 23, 19],
  [100, 44, 34, 27, 21, 17], [100, 47, 37, 30, 24, 20],
  [100, 43, 33, 26, 20, 16], [100, 48, 38, 31, 25, 21],
  [100, 45, 35, 28, 22, 18]
];
var cohortData = [];
for (var ci = 0; ci < cohortDates.length; ci++)
  for (var cj = 0; cj < cohortDays.length; cj++)
    cohortData.push([ci, cj, cohortRaw[ci][cj]]);
chartCohort.setOption({
  tooltip: Object.assign({}, commonTooltip, { formatter: function(p) { return cohortDates[p.value[0]] + ' ' + cohortDays[p.value[1]] + '<br/>留存率: ' + p.value[2] + '%'; } }),
  grid: { left: 32, right: 8, top: 8, bottom: 24 },
  xAxis: { type: 'category', data: cohortDates, axisLabel: { color: darkSub, fontSize: 9 }, axisLine: { lineStyle: { color: 'rgba(136,153,170,0.15)' } }, axisTick: { show: false } },
  yAxis: { type: 'category', data: cohortDays, axisLabel: { color: darkSub, fontSize: 9 }, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } },
  visualMap: {
    min: 0, max: 100, show: false,
    inRange: { color: ['#1a0f0a', '#3e1a12', '#7a2e1e', '#b83e28', '#e05038', '#ff4444', '#ff6b35', '#ffc107'] }
  },
  series: [{
    type: 'heatmap', data: cohortData,
    label: { show: true, color: '#fff', fontSize: 9, formatter: function(p) { return p.value[2] + '%'; } },
    itemStyle: { borderColor: '#0d0a07', borderWidth: 2, borderRadius: 2 }
  }]
});
charts.push(chartCohort);

/* ==================== 5. GMV TREND (bar + step line) ==================== */
var chartTrend = safeInit('chart-trend');
var hours = [];
for (var hi = 0; hi < 24; hi++) hours.push(String(hi).padStart(2, '0') + ':00');
var gmvData = [45,38,32,28,25,30,42,68,95,128,156,182,210,195,178,165,188,215,245,268,285,240,180,120];
var orderData = [1.2,1.0,0.8,0.7,0.6,0.9,1.5,2.8,4.2,6.1,7.8,9.5,11.2,10.5,9.2,8.5,9.8,11.5,13.2,14.8,15.6,12.8,9.2,6.1];
chartTrend.setOption({
  tooltip: Object.assign({}, commonTooltip, { trigger: 'axis', axisPointer: { type: 'shadow' } }),
  legend: { data: ['GMV', '订单量'], textStyle: { color: darkSub, fontSize: 10 }, top: 0, right: 8 },
  grid: { left: 32, right: 40, top: 28, bottom: 20 },
  xAxis: { type: 'category', data: hours, axisLabel: { color: darkSub, fontSize: 9, interval: 3 }, axisLine: { lineStyle: { color: 'rgba(136,153,170,0.15)' } }, axisTick: { show: false } },
  yAxis: [
    { type: 'value', name: 'GMV(万)', nameTextStyle: { color: darkSub, fontSize: 9 }, axisLabel: { color: darkSub, fontSize: 9 }, splitLine: { lineStyle: { color: 'rgba(136,153,170,0.08)' } }, axisLine: { show: false }, axisTick: { show: false } },
    { type: 'value', name: '订单(万)', nameTextStyle: { color: darkSub, fontSize: 9 }, axisLabel: { color: darkSub, fontSize: 9 }, splitLine: { show: false }, axisLine: { show: false }, axisTick: { show: false } }
  ],
  series: [
    { name: 'GMV', type: 'bar', data: gmvData, barWidth: '50%',
      itemStyle: { color: '#ff4444', borderRadius: [0, 0, 0, 0] },
      emphasis: { itemStyle: { color: '#ffc107' } } },
    { name: '订单量', type: 'line', yAxisIndex: 1, data: orderData, smooth: false, step: 'end', symbol: 'none',
      lineStyle: { color: '#ffc107', width: 1.5 },
      areaStyle: { color: 'rgba(255,193,7,0.08)' } }
  ]
});
charts.push(chartTrend);

/* ==================== 6. MATRIX HEATMAP ==================== */
var chartMatrix = safeInit('chart-matrix');
var matrixCats = ['手机', '美妆', '家电', '服装', '食品', '母婴', '运动', '家居'];
var matrixData = [];
for (var mi = 0; mi < matrixCats.length; mi++)
  for (var mj = 0; mj < matrixCats.length; mj++) {
    var mv = Math.random() * 0.6 + 0.1;
    if (mi === mj) mv = 1.0;
    if (Math.abs(mi - mj) === 1) mv = Math.random() * 0.25 + 0.55;
    matrixData.push([mj, mi, parseFloat(mv.toFixed(2))]);
  }
chartMatrix.setOption({
  tooltip: Object.assign({}, commonTooltip, { formatter: function(p) { return matrixCats[p.value[1]] + ' x ' + matrixCats[p.value[0]] + '<br/>关联度: ' + p.value[2]; } }),
  grid: { left: 32, right: 8, top: 8, bottom: 24 },
  xAxis: { type: 'category', data: matrixCats, axisLabel: { color: darkSub, fontSize: 8, rotate: 30 }, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } },
  yAxis: { type: 'category', data: matrixCats, axisLabel: { color: darkSub, fontSize: 8 }, axisLine: { show: false }, axisTick: { show: false }, splitLine: { show: false } },
  visualMap: {
    min: 0, max: 1, show: false,
    inRange: { color: ['#1a0f0a', '#3e1a12', '#7a2e1e', '#b83e28', '#e05038', '#ff4444', '#ff6b35', '#ffc107'] }
  },
  series: [{
    type: 'heatmap', data: matrixData,
    itemStyle: { borderColor: '#0d0a07', borderWidth: 2, borderRadius: 2 }
  }]
});
charts.push(chartMatrix);

/* ==================== 7. CATEGORY RANKING ==================== */
var chartCategory = safeInit('chart-category');
var catData = [
  { n: '手机数码', v: 520 }, { n: '美妆护肤', v: 410 }, { n: '家用电器', v: 385 },
  { n: '服装鞋包', v: 340 }, { n: '食品饮料', v: 290 }, { n: '母婴用品', v: 245 },
  { n: '运动户外', v: 210 }, { n: '家居家装', v: 185 }, { n: '图书文具', v: 140 },
  { n: '汽车用品', v: 95 }
];
chartCategory.setOption({
  tooltip: commonTooltip,
  grid: { left: 32, right: 8, top: 8, bottom: 8, containLabel: true },
  xAxis: { type: 'value', axisLabel: { color: darkSub, fontSize: 9 }, splitLine: { lineStyle: { color: 'rgba(136,153,170,0.08)' } }, axisLine: { show: false }, axisTick: { show: false } },
  yAxis: { type: 'category', data: catData.map(function(d) { return d.n; }).reverse(), axisLabel: { color: darkSub, fontSize: 9 }, axisLine: { show: false }, axisTick: { show: false } },
  series: [{
    type: 'bar', data: catData.map(function(d) { return d.v; }).reverse(),
    itemStyle: { color: '#ff4444', borderRadius: [0, 0, 0, 0] },
    barWidth: '55%',
    label: { show: true, position: 'right', color: darkSub, fontSize: 9, formatter: '{c}万' },
    emphasis: { itemStyle: { color: '#ffc107' } }
  }]
});
charts.push(chartCategory);

/* ==================== RESIZE ==================== */
window.addEventListener('resize', function() {
  charts.forEach(function(c) { c && c.resize(); });
});
</script>
