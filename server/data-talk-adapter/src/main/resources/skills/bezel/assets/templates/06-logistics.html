<style>
:root {
  /* Color palette — Logistics sky blue */
  --bezel-bg-app: #0a0e1a;
  --bezel-bg-rgb: 10,14,26;
  --bezel-accent-primary: #0ea5e9;
  --bezel-accent-secondary: #38bdf8;
  --bezel-accent-primary-rgb: 14,165,233;
  --bezel-accent-secondary-rgb: 56,189,248;
  --bezel-text-strong: #e2e8f0;
  --bezel-text-muted: #94a3b8;
  --bezel-font-stack: 'PingFang SC','Microsoft YaHei',sans-serif;

  /* Card tokens */
  --card-radius: 8px;
  --card-bg: rgba(10,14,26,0.50);
  --card-border: none;
  --card-border-bottom: 1px solid rgba(14,165,233,0.30);
  --card-shadow: none;
  --card-padding: 12px 20px;
  --card-blur: 8px;

  /* Motion tokens */
  --motion-duration: 250ms;
  --motion-easing: ease-out;
  --motion-ambient: scan 4s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-duration: 0ms;
    --motion-ambient: none;
  }
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  font-family: var(--bezel-font-stack);
  color: var(--bezel-text-strong);
  background: var(--bezel-bg-app);
}

/* ── Background layers ── */
.bg-contour {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    repeating-linear-gradient(
      0deg,
      transparent, transparent 59px,
      rgba(14,165,233,0.06) 59px,
      rgba(14,165,233,0.06) 60px
    ),
    linear-gradient(
      180deg,
      #0a0e1a 0%,
      rgba(14,165,233,0.04) 40%,
      rgba(14,165,233,0.08) 60%,
      #0a0e1a 100%
    );
}
.bg-scan {
  position: fixed; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(14,165,233,0.25), transparent);
  z-index: 0; pointer-events: none;
  will-change: top, opacity;
  animation: var(--motion-ambient);
}
@keyframes scan {
  0%   { top: 0; opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { top: 100vh; opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .bg-scan { animation: none; display: none; }
}

/* ── Dashboard layout ── */
.dashboard {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  width: 100vw; height: 100vh;
  overflow: hidden; gap: 0;
}

/* ── Band separator ── */
.band-separator {
  height: 1px; flex-shrink: 0;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(14,165,233,0.30) 20%,
    rgba(14,165,233,0.30) 80%,
    transparent 100%
  );
  margin: 0 20px;
}

/* ── Band 1: Strategy / header ── */
.band-strategy {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 8px;
}
.band-strategy h1 {
  font-size: 20px; font-weight: 500;
  letter-spacing: 2px;
  color: var(--bezel-text-strong);
  border-bottom: 2px solid var(--bezel-accent-primary);
  padding-bottom: 4px;
}
.clock {
  font-family: 'Consolas', monospace;
  font-size: 14px; color: var(--bezel-text-muted);
  letter-spacing: 1px;
}

/* ── Story bar ── */
.band-story {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  padding: 4px 20px 6px;
  font-size: 13px; color: #cbd5e1;
  gap: 24px;
}
.band-story span { display: flex; align-items: center; gap: 6px; }
.highlight-o { color: #f97316; font-weight: 700; }
.highlight-g { color: #22c55e; font-weight: 700; }
.highlight-r { color: #ef4444; font-weight: 700; }

/* ── Band 2: KPI row ── */
.band-kpi {
  flex: 0 0 auto;
  display: flex; flex-direction: row;
  gap: 10px; padding: 6px 20px 10px;
}
.kpi-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  background: rgba(10,14,26,0.35);
  border-bottom: 1px solid rgba(14,165,233,0.20);
  border-radius: 6px;
  min-width: 180px; flex: 1;
  transition: border-bottom-color var(--motion-duration) var(--motion-easing);
}
.kpi-bar:hover { border-bottom-color: rgba(14,165,233,0.50); }
.kpi-bar .label {
  font-size: 12px; color: var(--bezel-text-muted);
  white-space: nowrap;
}
.kpi-bar .separator {
  width: 1px; height: 24px;
  background: rgba(14,165,233,0.20);
  margin: 0 12px;
}
.kpi-bar .value {
  font-size: 22px; font-weight: 700;
  color: var(--bezel-text-strong);
  font-variant-numeric: tabular-nums;
  font-family: 'Consolas', monospace;
}

/* ── Band 3: Main charts ── */
.band-charts {
  flex: 3;
  display: flex; gap: 12px;
  padding: 0 20px 8px;
  min-height: 0;
}

/* ── Band 4: Detail row ── */
.band-detail {
  flex: 2;
  display: flex; gap: 12px;
  padding: 0 20px 8px;
  min-height: 0;
}

/* ── Card ── */
.card {
  background: var(--card-bg);
  border-radius: var(--card-radius);
  border: none;
  border-bottom: var(--card-border-bottom);
  backdrop-filter: blur(var(--card-blur));
  padding: var(--card-padding);
  display: flex; flex-direction: column;
  position: relative;
  transition: border-bottom-color var(--motion-duration) var(--motion-easing);
}
.card:hover {
  border-bottom-color: rgba(14,165,233,0.60);
}
.card-title {
  font-size: 13px; font-weight: 500;
  color: var(--bezel-text-strong);
  text-align: left; letter-spacing: 1px;
  margin-bottom: 8px; padding-bottom: 4px;
  border-bottom: 1px solid rgba(14,165,233,0.20);
  flex-shrink: 0;
}
.chart-wrap { flex: 1; min-height: 0; }
</style>
</head>

  ]
};

(function() {
  var cfg = window.__BEZEL_CONFIG__;
  if (!cfg) return;
  var charts = {};
  var timers = {};
  var paused = false;

  function bindWidget(w) {
    var el = document.getElementById(w.id);
    if (!el) return;

/* Safe ECharts init — returns null if element missing, preventing getAttribute crash */
function safeInit(id) {
  var el = document.getElementById(id);
  return el ? echarts.init(el) : null;
}
    charts[w.id] = echarts.init(el);
    schedule(w);
  }

  function schedule(w) {
    var interval = w.intervalMs || cfg.defaultIntervalMs || 10000;
    timers[w.id] = setTimeout(function tick() {
      if (paused) { timers[w.id] = setTimeout(tick, interval); return; }
      fetch(w.endpoint, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ params: w.params || {} })
      }).then(function(res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }).then(function(data) {
        var ch = charts[w.id];
        if (ch) ch.setOption({ dataset: { source: data.rows } }, { lazyUpdate: true });
      }).catch(function(e) {
        parent.postMessage({ type: "error", widgetId: w.id, message: String(e) }, "*");
      });
      timers[w.id] = setTimeout(tick, interval);
    }, interval);
  }

  if (cfg.pauseOnHidden !== false) {
    document.addEventListener("visibilitychange", function() { paused = document.hidden; });
  }

  window.addEventListener("message", function(ev) {
    var m = ev.data;
    if (!m || typeof m !== "object") return;
    if (m.type === "refresh/pause") paused = true;
    if (m.type === "refresh/resume") paused = false;
    if (m.type === "params/update") {
      cfg.widgets.forEach(function(w) { w.params = Object.assign({}, w.params || {}, m.params); });
    }
  });

  cfg.widgets.forEach(bindWidget);
  parent.postMessage({ type: "ready", jsonHash: document.querySelector('meta[name="__JSON_HASH__"]') ? document.querySelector('meta[name="__JSON_HASH__"]').content : null }, "*");
})();
</script>

function updateClock() {
  var now = new Date();
  var pad = function(n) { return String(n).padStart(2, "0"); };
  document.getElementById("clock").textContent =
    now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " +
    pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
}
updateClock();

/* ── KPI count-up ── */
function countUp(el, target, duration) {
  duration = duration || 1500;
  var decimal = parseInt(el.dataset.decimal, 10) || 0;
  var suffix = el.dataset.suffix || "";
  var startTime = null;
  function tick(ts) {
    if (!startTime) startTime = ts;
    var p = Math.min((ts - startTime) / duration, 1);
    var ease = 1 - Math.pow(1 - p, 3);
    var val = target * ease;
    var text = decimal > 0 ? val.toFixed(decimal) : Math.round(val).toLocaleString();
    el.textContent = text + suffix;
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
document.querySelectorAll(".kpi-bar .value").forEach(function(el) {
  var target = parseFloat(el.dataset.target);
  setTimeout(function() { countUp(el, target, 1500); }, 300);
});
