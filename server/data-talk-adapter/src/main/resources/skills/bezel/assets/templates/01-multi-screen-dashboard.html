<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/ https://__BEZEL_SERVER_ORIGIN__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://__BEZEL_SERVER_ORIGIN__;">
  <meta name="__JSON_HASH__" content="">
  <title>企业级数据大屏监控系统</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg-rgb: 6,11,20;
      --accent-primary-rgb: 0,212,255;
      --accent-secondary-rgb: 16,232,115;
      --bezel-bg-app: #060b14;
      --bezel-accent-primary: #00d4ff;
      --bezel-accent-secondary: #10e873;
      --bezel-text-strong: #e2e8f0;
      --bezel-text-muted: #94a3b8;
      --card-radius: 24px;
      --card-bg: rgba(var(--bg-rgb), 0.35);
      --card-border: 1px dashed rgba(var(--accent-primary-rgb), 0.30);
      --card-shadow: none;
      --card-padding: 16px;
      --card-blur: 6px;
      --motion-duration: 400ms;
      --motion-easing: ease-in-out;
      --motion-ambient: orbit 12s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      :root {
        --motion-duration: 0ms;
        --motion-ambient: none;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: var(--bezel-bg-app);
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--bezel-text-strong);
    }

    /* Background canvas */
    #bg-radar {
      position: fixed; inset: 0;
      z-index: 0; pointer-events: none;
    }

    /* Orbit arcs */
    .orbit-arc {
      position: fixed;
      border-radius: 50%;
      border: 1px solid rgba(var(--accent-primary-rgb), 0.08);
      pointer-events: none;
      z-index: 0;
      will-change: transform;
    }
    .arc-1 {
      width: 50vw; height: 50vw;
      top: calc(50% - 25vw); left: calc(50% - 25vw);
      animation: var(--motion-ambient);
      animation-duration: 15s;
    }
    .arc-2 {
      width: 70vw; height: 70vw;
      top: calc(50% - 35vw); left: calc(50% - 35vw);
      animation: var(--motion-ambient);
      animation-duration: 22s;
      animation-direction: reverse;
    }
    @keyframes orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit-arc { animation: none; }
    }

    /* Dashboard container */
    .dashboard {
      position: relative;
      width: 100vw; height: 100vh;
      z-index: 1;
      overflow: hidden;
    }

    /* Header */
    .header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: rgba(var(--bg-rgb), 0.60);
      backdrop-filter: blur(8px);
    }
    .header h1 {
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 4px;
      color: var(--bezel-text-strong);
    }
    .header .clock {
      position: absolute;
      right: 24px;
      font-size: 13px;
      color: var(--bezel-accent-primary);
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border: var(--card-border);
      border-radius: var(--card-radius);
      backdrop-filter: blur(var(--card-blur));
      padding: var(--card-padding);
      display: flex;
      flex-direction: column;
      position: absolute;
      transition: border var(--motion-duration) var(--motion-easing),
                  box-shadow var(--motion-duration) var(--motion-easing);
    }
    .card:hover {
      border-style: solid;
      border-color: rgba(var(--accent-primary-rgb), 0.55);
      box-shadow: 0 0 20px rgba(var(--accent-primary-rgb), 0.15);
    }
    .card-title {
      font-size: 13px;
      font-weight: 400;
      color: var(--bezel-accent-primary);
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .card-body {
      flex: 1;
      min-height: 0;
    }

    /* Core widget - centered */
    .widget-core {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 36%; height: 42%;
    }

    /* KPI ring gauges */
    .kpi-ring {
      width: 80px; height: 80px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Scene grid inside core */
    .scene-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 8px;
      width: 100%; height: 100%;
    }
    .scene-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed rgba(var(--accent-primary-rgb), 0.15);
      border-radius: 12px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: border var(--motion-duration) var(--motion-ease);
    }
    .scene-card:hover {
      border-style: solid;
      border-color: currentColor;
      box-shadow: 0 0 12px currentColor;
    }
    .scene-thumb {
      width: 32px; height: 32px;
      border-radius: 8px;
      margin-bottom: 4px;
      opacity: 0.9;
    }
    .scene-name {
      font-size: 11px; font-weight: 600;
      color: var(--bezel-text-strong);
      letter-spacing: 1px;
    }
    .scene-activity {
      font-size: 10px; color: var(--bezel-text-muted);
      margin-top: 2px;
    }
    .scene-activity span {
      color: var(--bezel-accent-secondary);
      font-weight: 600;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(var(--accent-primary-rgb), 0.2); border-radius: 2px; }
  </style>
</head>
<body>
  <canvas id="bg-radar"></canvas>
  <div class="orbit-arc arc-1"></div>
  <div class="orbit-arc arc-2"></div>

  <div class="dashboard">
    <!-- Header -->
    <div class="header">
      <h1>企业级数据大屏监控系统</h1>
      <div class="clock" id="clock">--:--:--</div>
    </div>

    <!-- KPI ring: top-left of center -->
    <div class="card kpi-ring" style="top:10%; left:4%; width:110px; height:110px;" aria-label="总数据量 2400 PB">
      <div id="kpi-data"></div>
    </div>

    <!-- KPI ring: top-right of center -->
    <div class="card kpi-ring" style="top:10%; right:4%; width:110px; height:110px;" aria-label="API QPS 2847">
      <div id="kpi-qps"></div>
    </div>

    <!-- KPI ring: bottom-left of center -->
    <div class="card kpi-ring" style="bottom:10%; left:4%; width:110px; height:110px;" aria-label="服务健康度 99.97%">
      <div id="kpi-health"></div>
    </div>

    <!-- KPI ring: bottom-right of center -->
    <div class="card kpi-ring" style="bottom:10%; right:4%; width:110px; height:110px;" aria-label="在线用户数 12480">
      <div id="kpi-users"></div>
    </div>

    <!-- Radar: left of center -->
    <div class="card" style="top:20%; left:1%; width:22%; height:50%;">
      <div class="card-title">跨行业数据对比</div>
      <div class="card-body" id="radarChart"></div>
    </div>

    <!-- Core: Scene Grid -->
    <div class="card widget-core">
      <div class="card-title">场景监控矩阵</div>
      <div class="card-body">
        <div class="scene-grid" id="sceneGrid"></div>
      </div>
    </div>

    <!-- Gauge: right of center -->
    <div class="card" style="top:18%; right:1%; width:22%; height:32%;">
      <div class="card-title">系统资源监控</div>
      <div class="card-body" id="gaugeChart"></div>
    </div>

    <!-- Heatmap: left-bottom -->
    <div class="card" style="bottom:2%; left:1%; width:22%; height:30%;">
      <div class="card-title">24h 服务可用性</div>
      <div class="card-body" id="heatmapChart"></div>
    </div>

    <!-- API Dist: right-bottom -->
    <div class="card" style="bottom:2%; right:1%; width:22%; height:30%;">
      <div class="card-title">API 响应分布</div>
      <div class="card-body" id="apiChart"></div>
    </div>

    <!-- Load Trend: bottom-center -->
    <div class="card" style="bottom:2%; left:28%; width:44%; height:16%;">
      <div class="card-title">系统负载趋势</div>
      <div class="card-body" id="loadChart"></div>
    </div>
  </div>

  <script>
    /* ==================== BEZEL CONFIG ==================== */
    window.__BEZEL_CONFIG__ = {
      dashboardId: "01-multi-screen",
      style: "orbital",
      refreshInterval: 30000,
      widgets: [
        { id: "radar", type: "chart", baseOption: {} },
        { id: "gauge", type: "chart", baseOption: {} },
        { id: "heatmap", type: "chart", baseOption: {} },
        { id: "api-dist", type: "chart", baseOption: {} },
        { id: "load-trend", type: "chart", baseOption: {} }
      ]
    };

    /* ==================== POLLING SCHEDULER ==================== */
    (function() {
      var cfg = window.__BEZEL_CONFIG__;
      if (!cfg) return;
      var charts = {};
      var timers = {};
      var paused = false;

      function bindWidget(w) {
        var el = document.getElementById(w.id);
        if (!el) return;
        // Type-aware initialization (BUG-0055 fix):
        // only chart widgets get echarts.init; KPI/table/etc. are HTML-rendered.
        if (w.type === 'chart') {
          var ch = echarts.init(el);
          // First-paint base option so the chart has series/axes before the first poll.
          if (w.baseOption) ch.setOption(w.baseOption);
          charts[w.id] = ch;
        }
        if (w.intervalMs && w.intervalMs > 0) schedule(w);
      }

      function schedule(w) {
        var interval = w.intervalMs || cfg.defaultIntervalMs || 10000;
        timers[w.id] = setTimeout(function tick() {
          if (paused) { timers[w.id] = setTimeout(tick, interval); return; }
          fetch(w.endpoint, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ params: w.params || {} })
          }).then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          }).then(function(data) {
            applyWidgetData(w, data);
          }).catch(function(e) {
            parent.postMessage({ type: 'error', widgetId: w.id, message: String(e) }, '*');
          });
          timers[w.id] = setTimeout(tick, interval);
        }, interval);
      }

      function applyWidgetData(w, data) {
        if (w.type === 'chart') {
          var ch = charts[w.id];
          if (!ch) return;
          ch.setOption({ dataset: { source: data.rows } }, { lazyUpdate: true });
          return;
        }
        var el = document.getElementById(w.id);
        if (!el) return;
        applyHtmlData(w.type, el, data.rows || []);
      }

      function applyHtmlData(kind, el, rows) {
        if (kind === 'kpi') {
          var row = rows[0] || {};
          var setText = function(sel, v) {
            var t = el.querySelector(sel);
            if (t && v !== undefined && v !== null) t.textContent = String(v);
          };
          setText('.value', row.value);
          setText('.label', row.label);
          setText('.delta', row.delta);
          var trendEl = el.querySelector('.trend');
          if (trendEl && row.trend) {
            trendEl.classList.remove('up', 'down');
            trendEl.classList.add(row.trend === 'down' ? 'down' : 'up');
          }
          return;
        }
        if (kind === 'table') {
          var tbody = el.querySelector('tbody');
          if (!tbody) return;
          var headerCells = el.querySelectorAll('thead th');
          var cols = Array.prototype.slice.call(headerCells).map(function(th) {
            return th.dataset.column || th.textContent.trim();
          });
          var html = rows.map(function(r) {
            var tds = cols.map(function(c) {
              return '<td>' + escapeHtml(String(r[c] == null ? '' : r[c])) + '</td>';
            }).join('');
            return '<tr>' + tds + '</tr>';
          }).join('');
          tbody.innerHTML = html;
          return;
        }
      }

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, function(c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      }

      if (cfg.pauseOnHidden !== false) {
        document.addEventListener('visibilitychange', function() { paused = document.hidden; });
      }

      window.addEventListener('message', function(ev) {
        var m = ev.data;
        if (!m || typeof m !== 'object') return;
        if (m.type === 'refresh/pause') paused = true;
        if (m.type === 'refresh/resume') paused = false;
        if (m.type === 'params/update') {
          cfg.widgets.forEach(function(w) {
            w.params = Object.assign({}, w.params || {}, m.params);
          });
        }
      });

      cfg.widgets.forEach(bindWidget);
      var hm = document.querySelector('meta[name="__JSON_HASH__"]');
      parent.postMessage({ type: 'ready', jsonHash: hm ? hm.content : null }, '*');
    })();

    /* ==================== BG CONCENTRIC CIRCLES ==================== */
    (function() {
      var c = document.getElementById("bg-radar");
      var ctx = c.getContext("2d", { alpha: false });
      function draw() {
        c.width = window.innerWidth;
        c.height = window.innerHeight;
        var cx = c.width / 2, cy = c.height / 2;
        var maxR = Math.max(cx, cy) * 1.2;
        ctx.fillStyle = "#060b14";
        ctx.fillRect(0, 0, c.width, c.height);
        for (var r = 60; r < maxR; r += 60) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(0,212,255,0.06)";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
      draw();
      window.addEventListener("resize", draw);
    })();

    /* ==================== CLOCK ==================== */
    function updateClock() {
      var now = new Date();
      document.getElementById("clock").textContent =
        now.toLocaleTimeString("zh-CN", { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ==================== SCENE GRID ==================== */
    var scenes = [
      { name: "电商", color: "#ff4444", activity: 92 },
      { name: "制造", color: "#f97316", activity: 78 },
      { name: "SaaS", color: "#14b8a6", activity: 85 },
      { name: "金融", color: "#c9a84c", activity: 88 },
      { name: "物流", color: "#0ea5e9", activity: 74 },
      { name: "医疗", color: "#10b981", activity: 81 },
      { name: "人力", color: "#f97316", activity: 66 },
      { name: "能源", color: "#22c55e", activity: 71 },
      { name: "网络安全", color: "#00ff41", activity: 95 },
      { name: "农业", color: "#f59e0b", activity: 58 },
      { name: "教育", color: "#facc15", activity: 63 },
      { name: "监控中心", color: "#00d4ff", activity: 99 }
    ];
    var gridEl = document.getElementById("sceneGrid");
    scenes.forEach(function(s) {
      var card = document.createElement("div");
      card.className = "scene-card";
      card.style.color = s.color;
      card.innerHTML =
        '<div class="scene-thumb" style="background:' + s.color + '22;border:1px dashed ' + s.color + '44;border-radius:50%;"></div>' +
        '<div class="scene-name">' + s.name + '</div>' +
        '<div class="scene-activity">活跃度<span>' + s.activity + '%</span></div>';
      gridEl.appendChild(card);
    });

    /* ==================== KPI RING GAUGES ==================== */
    function makeKPIGauge(el, value, max, label, color) {

/* Safe ECharts init — returns null if element missing, preventing getAttribute crash */
function safeInit(id) {
  var el = document.getElementById(id);
  return el ? echarts.init(el) : null;
}
      var chart = echarts.init(el);
      chart.setOption({
        backgroundColor: "transparent",
        series: [{
          type: "gauge",
          startAngle: 90,
          endAngle: -270,
          min: 0, max: max,
          radius: "90%",
          center: ["50%", "55%"],
          axisLine: {
            lineStyle: {
              width: 4,
              color: [[value / max, color], [1, "rgba(0,212,255,0.12)"]]
            }
          },
          pointer: { show: false },
          axisTick: { show: false },
          splitLine: { show: false },
          axisLabel: { show: false },
          detail: {
            valueAnimation: true,
            fontSize: 14,
            fontWeight: "bold",
            color: "#e2e8f0",
            offsetCenter: [0, "-5%"],
            formatter: function(v) {
              if (max >= 1000) return (v / 1000).toFixed(1) + "K";
              return v + "%";
            }
          },
          title: {
            show: true,
            fontSize: 9,
            color: "#94a3b8",
            offsetCenter: [0, "25%"]
          },
          data: [{ value: value, name: label }]
        }]
      });
      return chart;
    }
    var kpiCharts = [
      makeKPIGauge(document.getElementById("kpi-data"), 2400, 3000, "数据量 PB", "#00d4ff"),
      makeKPIGauge(document.getElementById("kpi-qps"), 2847, 5000, "API QPS", "#10e873"),
      makeKPIGauge(document.getElementById("kpi-health"), 99.97, 100, "健康度", "#00d4ff"),
      makeKPIGauge(document.getElementById("kpi-users"), 12480, 15000, "在线用户", "#10e873")
    ];

    /* ==================== ECHARTS COMMON ==================== */
    var darkTheme = {
      backgroundColor: "transparent",
      textStyle: { fontFamily: "PingFang SC, Microsoft YaHei, sans-serif" },
      title: { textStyle: { color: "#e2e8f0" } },
      legend: { textStyle: { color: "#94a3b8" } },
      tooltip: {
        backgroundColor: "rgba(6,11,20,0.95)",
        borderColor: "rgba(0,212,255,0.3)",
        textStyle: { color: "#e2e8f0" }
      }
    };

    /* ==================== RADAR CHART ==================== */
    var radarChart = safeInit('radarChart');
    radarChart.setOption(Object.assign({}, darkTheme, {
      tooltip: {},
      radar: {
        indicator: scenes.map(function(s) { return { name: s.name, max: 100 }; }),
        center: ["50%", "55%"], radius: "65%",
        axisName: { color: "#94a3b8", fontSize: 10 },
        splitArea: { show: false },
        splitLine: { lineStyle: { color: "rgba(0,212,255,0.10)" } },
        axisLine: { lineStyle: { color: "rgba(0,212,255,0.20)" } }
      },
      series: [{
        type: "radar",
        data: [{
          value: scenes.map(function(s) { return s.activity; }),
          name: "综合评分",
          areaStyle: { color: "rgba(0,212,255,0.20)" },
          lineStyle: { color: "#00d4ff", width: 2 },
          itemStyle: { color: "#00d4ff" }
        }]
      }]
    }));

    /* ==================== GAUGE CHART ==================== */
    var gaugeChart = safeInit('gaugeChart');
    function makeGauge(name, value, color, offsetX) {
      return {
        type: "gauge",
        center: [offsetX + "%", "55%"],
        radius: "50%",
        startAngle: 90, endAngle: -270,
        min: 0, max: 100,
        axisLine: {
          lineStyle: {
            width: 6,
            color: [[value / 100, color], [1, "rgba(0,212,255,0.12)"]]
          }
        },
        pointer: { show: false },
        axisTick: { show: false },
        splitLine: { show: false },
        axisLabel: { show: false },
        detail: {
          valueAnimation: true,
          formatter: "{value}%",
          color: color, fontSize: 14, fontWeight: "bold",
          offsetCenter: [0, "10%"]
        },
        title: { offsetCenter: [0, "30%"], fontSize: 10, color: "#94a3b8" },
        data: [{ value: value, name: name }]
      };
    }
    gaugeChart.setOption(Object.assign({}, darkTheme, {
      series: [
        makeGauge("CPU", 67, "#00d4ff", 18),
        makeGauge("内存", 58, "#10e873", 50),
        makeGauge("网络", 42, "#a855f7", 82)
      ]
    }));

    /* ==================== HEATMAP ==================== */
    var heatmapChart = safeInit('heatmapChart');
    var services = ["API网关", "订单服务", "支付服务", "用户中心", "消息队列", "数据仓库"];
    var hours = []; for (var h = 0; h < 24; h++) hours.push(h + "h");
    var heatData = [];
    for (var i = 0; i < services.length; i++) {
      for (var j = 0; j < 24; j++) {
        var v = 100;
        if (Math.random() < 0.05) v = 98 + Math.random() * 1.5;
        if (Math.random() < 0.02) v = 95 + Math.random() * 3;
        heatData.push([j, i, parseFloat(v.toFixed(2))]);
      }
    }
    heatmapChart.setOption(Object.assign({}, darkTheme, {
      tooltip: { position: "top" },
      grid: { top: 5, bottom: 20, left: 60, right: 10 },
      xAxis: {
        type: "category", data: hours,
        axisLabel: { color: "#64748b", fontSize: 8, interval: 3 }
      },
      yAxis: {
        type: "category", data: services,
        axisLabel: { color: "#94a3b8", fontSize: 9 }
      },
      visualMap: {
        min: 95, max: 100, calculable: false,
        orient: "horizontal", left: "center", bottom: 0,
        itemWidth: 10, itemHeight: 50,
        inRange: { color: ["#ef4444", "#f59e0b", "#10e873"] },
        textStyle: { color: "#64748b", fontSize: 8 }
      },
      series: [{
        type: "heatmap", data: heatData,
        label: { show: false },
        itemStyle: { borderColor: "#060b14", borderWidth: 1 }
      }]
    }));

    /* ==================== API RESPONSE DISTRIBUTION (DONUT) ==================== */
    var apiChart = safeInit('apiChart');
    apiChart.setOption(Object.assign({}, darkTheme, {
      tooltip: { trigger: "item" },
      series: [{
        type: "pie",
        radius: ["30%", "65%"],
        center: ["50%", "55%"],
        avoidLabelOverlap: true,
        itemStyle: { borderRadius: 6, borderColor: "#060b14", borderWidth: 2 },
        label: { color: "#e2e8f0", fontSize: 11 },
        labelLine: { lineStyle: { color: "rgba(0,212,255,0.3)" } },
        data: [
          { value: 12, name: "P50 (12ms)", itemStyle: { color: "#10e873" } },
          { value: 45, name: "P95 (45ms)", itemStyle: { color: "#f59e0b" } },
          { value: 89, name: "P99 (89ms)", itemStyle: { color: "#ef4444" } }
        ]
      }]
    }));

    /* ==================== LOAD TREND (POLAR BAR) ==================== */
    var loadChart = safeInit('loadChart');
    var loadHours = []; for (var lh = 0; lh < 24; lh++) loadHours.push(lh + ":00");
    var cpuData = loadHours.map(function(_, i) { return 30 + Math.sin(i / 3) * 15 + Math.random() * 10; });
    var memData = loadHours.map(function(_, i) { return 40 + Math.cos(i / 4) * 12 + Math.random() * 8; });
    loadChart.setOption(Object.assign({}, darkTheme, {
      tooltip: { trigger: "axis" },
      legend: { data: ["CPU", "内存"], textStyle: { color: "#94a3b8", fontSize: 10 }, top: 0 },
      grid: { top: 22, bottom: 10, left: 40, right: 15 },
      xAxis: {
        type: "category", boundaryGap: false, data: loadHours,
        axisLabel: { color: "#64748b", fontSize: 8, interval: 4 }
      },
      yAxis: {
        type: "value", max: 100,
        axisLabel: { color: "#64748b", fontSize: 8 },
        splitLine: { lineStyle: { color: "rgba(148,163,184,0.08)" } }
      },
      series: [
        {
          name: "CPU", type: "line", smooth: true, data: cpuData,
          lineStyle: { color: "#00d4ff", width: 2 },
          areaStyle: { color: "rgba(0,212,255,0.15)" },
          showSymbol: false
        },
        {
          name: "内存", type: "line", smooth: true, data: memData,
          lineStyle: { color: "#10e873", width: 2 },
          areaStyle: { color: "rgba(16,232,115,0.15)" },
          showSymbol: false
        }
      ]
    }));

    /* ==================== RESIZE ==================== */
    var allCharts = [radarChart, gaugeChart, heatmapChart, apiChart, loadChart].concat(kpiCharts);
    window.addEventListener("resize", function() {
      allCharts.forEach(function(c) { c && c.resize(); });
    });
  </script>
</body>
</html>
