<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/ https://__BEZEL_SERVER_ORIGIN__; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://__BEZEL_SERVER_ORIGIN__;">
  <meta name="__JSON_HASH__" content="">
  <title>网络安全态势感知中心</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg-rgb: 0,10,0;
      --accent-primary-rgb: 0,255,65;
      --accent-secondary-rgb: 255,0,64;
      --bezel-bg-app: #000a00;
      --bezel-accent-primary: #00ff41;
      --bezel-accent-secondary: #ff0040;
      --bezel-text-strong: #00ff41;
      --bezel-text-muted: rgba(0,255,65,0.5);
      --card-radius: 24px;
      --card-bg: rgba(var(--bg-rgb), 0.35);
      --card-border: 1px dashed rgba(var(--accent-primary-rgb), 0.30);
      --card-shadow: none;
      --card-padding: 16px;
      --card-blur: 6px;
      --motion-duration: 400ms;
      --motion-easing: ease-in-out;
      --motion-ambient: orbit 12s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      :root {
        --motion-duration: 0ms;
        --motion-ambient: none;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: var(--bezel-bg-app);
      font-family: 'Courier New', Courier, monospace;
      color: var(--bezel-accent-primary);
    }

    /* Background canvas */
    #bg-radar {
      position: fixed; inset: 0;
      z-index: 0; pointer-events: none;
    }

    /* Orbit arcs */
    .orbit-arc {
      position: fixed;
      border-radius: 50%;
      border: 1px solid rgba(var(--accent-primary-rgb), 0.08);
      pointer-events: none;
      z-index: 0;
      will-change: transform;
    }
    .arc-1 {
      width: 50vw; height: 50vw;
      top: calc(50% - 25vw); left: calc(50% - 25vw);
      animation: var(--motion-ambient);
      animation-duration: 15s;
    }
    .arc-2 {
      width: 70vw; height: 70vw;
      top: calc(50% - 35vw); left: calc(50% - 35vw);
      animation: var(--motion-ambient);
      animation-duration: 22s;
      animation-direction: reverse;
    }
    @keyframes orbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit-arc { animation: none; }
    }

    /* Dashboard */
    .dashboard {
      position: relative;
      width: 100vw; height: 100vh;
      z-index: 1;
      overflow: hidden;
    }

    /* Header */
    .header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background: rgba(var(--bg-rgb), 0.60);
      backdrop-filter: blur(8px);
    }
    .header h1 {
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 4px;
      color: var(--bezel-accent-primary);
      text-shadow: 0 0 8px rgba(0,255,65,0.3);
    }
    .header .threat-level {
      position: absolute;
      left: 24px;
      font-size: 12px;
      color: #ff0040;
      font-weight: bold;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .header .clock {
      position: absolute;
      right: 24px;
      font-size: 13px;
      color: var(--bezel-accent-primary);
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 6px rgba(0,255,65,0.3);
    }

    /* Card */
    .card {
      background: var(--card-bg);
      border: var(--card-border);
      border-radius: var(--card-radius);
      backdrop-filter: blur(var(--card-blur));
      padding: var(--card-padding);
      display: flex;
      flex-direction: column;
      position: absolute;
      transition: border var(--motion-duration) var(--motion-easing),
                  box-shadow var(--motion-duration) var(--motion-easing);
    }
    .card:hover {
      border-style: solid;
      border-color: rgba(var(--accent-primary-rgb), 0.55);
      box-shadow: 0 0 20px rgba(var(--accent-primary-rgb), 0.15);
    }
    .card-title {
      font-size: 13px;
      font-weight: 400;
      color: var(--bezel-accent-primary);
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .card-body {
      flex: 1;
      min-height: 0;
    }

    /* Core widget - centered */
    .widget-core {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 32%; height: 38%;
    }

    /* KPI ring */
    .kpi-ring {
      width: 80px; height: 80px;
    }

    /* Log bar */
    .log-bar {
      position: absolute;
      bottom: 0; left: 1%; right: 1%;
      height: 5rem;
      background: rgba(var(--bg-rgb), 0.35);
      border: 1px dashed rgba(var(--accent-primary-rgb), 0.30);
      border-radius: 24px;
      backdrop-filter: blur(var(--card-blur));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px 16px;
    }
    .log-header {
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(0,255,65,0.7);
      margin-bottom: 4px;
      text-align: center;
    }
    .log-content {
      flex: 1;
      overflow-y: auto;
      font-size: 11px;
      line-height: 1.5;
    }
    .log-line { display: flex; gap: 8px; }
    .log-time { color: rgba(0,255,65,0.5); min-width: 5.5rem; }
    .log-level-info { color: #00bfff; }
    .log-level-warn { color: #ffd700; }
    .log-level-alert { color: #ff0040; }
    .log-msg { color: rgba(0,255,65,0.85); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,255,65,0.3); border-radius: 2px; }
  </style>
</head>
<body>
  <canvas id="bg-radar"></canvas>
  <div class="orbit-arc arc-1"></div>
  <div class="orbit-arc arc-2"></div>

  <div class="dashboard">
    <!-- Header -->
    <div class="header">
      <span class="threat-level">THREAT LEVEL: HIGH</span>
      <h1>网络安全态势感知中心</h1>
      <div class="clock" id="clock">00:00:00</div>
    </div>

    <!-- KPI ring: top-left -->
    <div class="card kpi-ring" style="top:8%; left:3%; width:110px; height:110px;" aria-label="攻击次数 2847">
      <div id="kpi-attacks"></div>
    </div>

    <!-- KPI ring: top-right -->
    <div class="card kpi-ring" style="top:8%; right:3%; width:110px; height:110px;" aria-label="拦截率 99.8%">
      <div id="kpi-block"></div>
    </div>

    <!-- KPI ring: mid-left -->
    <div class="card kpi-ring" style="top:28%; left:1%; width:110px; height:110px;" aria-label="待修复漏洞 34">
      <div id="kpi-vuln"></div>
    </div>

    <!-- KPI ring: mid-right -->
    <div class="card kpi-ring" style="top:28%; right:1%; width:110px; height:110px;" aria-label="安全评分 91">
      <div id="kpi-score"></div>
    </div>

    <!-- Attack Type: left side -->
    <div class="card" style="top:52%; left:1%; width:22%; height:30%;">
      <div class="card-title">攻击类型分布</div>
      <div class="card-body" id="chart-type"></div>
    </div>

    <!-- Core: 24H Attack Trend (Radar) -->
    <div class="card widget-core">
      <div class="card-title">ATT&CK 覆盖矩阵</div>
      <div class="card-body" id="chart-attack"></div>
    </div>

    <!-- Attack Source: right side -->
    <div class="card" style="top:16%; right:14%; width:20%; height:32%;">
      <div class="card-title">TOP 攻击源</div>
      <div class="card-body" id="chart-source"></div>
    </div>

    <!-- Vuln Status: right-bottom -->
    <div class="card" style="top:52%; right:1%; width:22%; height:30%;">
      <div class="card-title">漏洞修复状态</div>
      <div class="card-body" id="chart-vuln"></div>
    </div>

    <!-- Kill Chain: bottom-center-left -->
    <div class="card" style="top:52%; left:25%; width:24%; height:30%;">
      <div class="card-title">Kill Chain</div>
      <div class="card-body" id="chart-kill"></div>
    </div>

    <!-- 24H trend: bottom-center-right -->
    <div class="card" style="top:52%; right:25%; width:24%; height:30%;">
      <div class="card-title">24H 攻击趋势</div>
      <div class="card-body" id="chart-trend"></div>
    </div>

    <!-- Log bar -->
    <div class="log-bar">
      <div class="log-header">SYSTEM LOG</div>
      <div class="log-content" id="log-content"></div>
    </div>
  </div>

  <script>
    /* ==================== BEZEL CONFIG ==================== */
    window.__BEZEL_CONFIG__ = {
      dashboardId: "10-cybersecurity",
      style: "orbital",
      refreshInterval: 30000,
      widgets: [
        { id: "attack-trend", type: "chart", baseOption: {} },
        { id: "attack-type", type: "chart", baseOption: {} },
        { id: "attack-source", type: "chart", baseOption: {} },
        { id: "vuln-status", type: "chart", baseOption: {} },
        { id: "attack-matrix", type: "chart", baseOption: {} },
        { id: "kill-chain", type: "chart", baseOption: {} }
      ]
    };

    /* ==================== POLLING SCHEDULER ==================== */
    (function() {
      var cfg = window.__BEZEL_CONFIG__;
      if (!cfg) return;
      var charts = {};
      var timers = {};
      var paused = false;

      function bindWidget(w) {
        var el = document.getElementById(w.id);
        if (!el) return;
        // Type-aware initialization (BUG-0055 fix):
        // only chart widgets get echarts.init; KPI/table/etc. are HTML-rendered.
        if (w.type === 'chart') {
          var ch = echarts.init(el);
          // First-paint base option so the chart has series/axes before the first poll.
          if (w.baseOption) ch.setOption(w.baseOption);
          charts[w.id] = ch;
        }
        if (w.intervalMs && w.intervalMs > 0) schedule(w);
      }

      function schedule(w) {
        var interval = w.intervalMs || cfg.defaultIntervalMs || 10000;
        timers[w.id] = setTimeout(function tick() {
          if (paused) { timers[w.id] = setTimeout(tick, interval); return; }
          fetch(w.endpoint, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ params: w.params || {} })
          }).then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          }).then(function(data) {
            applyWidgetData(w, data);
          }).catch(function(e) {
            parent.postMessage({ type: 'error', widgetId: w.id, message: String(e) }, '*');
          });
          timers[w.id] = setTimeout(tick, interval);
        }, interval);
      }

      function applyWidgetData(w, data) {
        if (w.type === 'chart') {
          var ch = charts[w.id];
          if (!ch) return;
          ch.setOption({ dataset: { source: data.rows } }, { lazyUpdate: true });
          return;
        }
        var el = document.getElementById(w.id);
        if (!el) return;
        applyHtmlData(w.type, el, data.rows || []);
      }

      function applyHtmlData(kind, el, rows) {
        if (kind === 'kpi') {
          var row = rows[0] || {};
          var setText = function(sel, v) {
            var t = el.querySelector(sel);
            if (t && v !== undefined && v !== null) t.textContent = String(v);
          };
          setText('.value', row.value);
          setText('.label', row.label);
          setText('.delta', row.delta);
          var trendEl = el.querySelector('.trend');
          if (trendEl && row.trend) {
            trendEl.classList.remove('up', 'down');
            trendEl.classList.add(row.trend === 'down' ? 'down' : 'up');
          }
          return;
        }
        if (kind === 'table') {
          var tbody = el.querySelector('tbody');
          if (!tbody) return;
          var headerCells = el.querySelectorAll('thead th');
          var cols = Array.prototype.slice.call(headerCells).map(function(th) {
            return th.dataset.column || th.textContent.trim();
          });
          var html = rows.map(function(r) {
            var tds = cols.map(function(c) {
              return '<td>' + escapeHtml(String(r[c] == null ? '' : r[c])) + '</td>';
            }).join('');
            return '<tr>' + tds + '</tr>';
          }).join('');
          tbody.innerHTML = html;
          return;
        }
      }

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, function(c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      }

      if (cfg.pauseOnHidden !== false) {
        document.addEventListener('visibilitychange', function() { paused = document.hidden; });
      }

      window.addEventListener('message', function(ev) {
        var m = ev.data;
        if (!m || typeof m !== 'object') return;
        if (m.type === 'refresh/pause') paused = true;
        if (m.type === 'refresh/resume') paused = false;
        if (m.type === 'params/update') {
          cfg.widgets.forEach(function(w) {
            w.params = Object.assign({}, w.params || {}, m.params);
          });
        }
      });

      cfg.widgets.forEach(bindWidget);
      var hm = document.querySelector('meta[name="__JSON_HASH__"]');
      parent.postMessage({ type: 'ready', jsonHash: hm ? hm.content : null }, '*');
    })();

    /* ==================== BG CONCENTRIC CIRCLES ==================== */
    (function() {
      var c = document.getElementById("bg-radar");
      var ctx = c.getContext("2d", { alpha: false });
      function draw() {
        c.width = window.innerWidth;
        c.height = window.innerHeight;
        var cx = c.width / 2, cy = c.height / 2;
        var maxR = Math.max(cx, cy) * 1.2;
        ctx.fillStyle = "#000a00";
        ctx.fillRect(0, 0, c.width, c.height);
        for (var r = 60; r < maxR; r += 60) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(0,255,65,0.06)";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
      draw();
      window.addEventListener("resize", draw);
    })();

    /* ==================== CLOCK ==================== */
    function updateClock() {
      var now = new Date();
      var pad = function(n) { return String(n).padStart(2, "0"); };
      document.getElementById("clock").textContent =
        pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    }
    setInterval(updateClock, 1000);
    updateClock();

    /* ==================== KPI RING GAUGES ==================== */
    function makeKPIGauge(el, value, max, label, color) {

/* Safe ECharts init — returns null if element missing, preventing getAttribute crash */
function safeInit(id) {
  var el = document.getElementById(id);
  return el ? echarts.init(el) : null;
}
      var chart = echarts.init(el);
      chart.setOption({
        backgroundColor: "transparent",
        series: [{
          type: "gauge",
          startAngle: 90,
          endAngle: -270,
          min: 0, max: max,
          radius: "90%",
          center: ["50%", "55%"],
          axisLine: {
            lineStyle: {
              width: 4,
              color: [[value / max, color], [1, "rgba(0,255,65,0.12)"]]
            }
          },
          pointer: { show: false },
          axisTick: { show: false },
          splitLine: { show: false },
          axisLabel: { show: false },
          detail: {
            valueAnimation: true,
            fontSize: 14,
            fontWeight: "bold",
            color: "#00ff41",
            offsetCenter: [0, "-5%"],
            formatter: function(v) { return String(v); }
          },
          title: {
            show: true,
            fontSize: 9,
            color: "rgba(0,255,65,0.5)",
            offsetCenter: [0, "25%"]
          },
          data: [{ value: value, name: label }]
        }]
      });
      return chart;
    }
    var kpiCharts = [
      makeKPIGauge(document.getElementById("kpi-attacks"), 2847, 5000, "攻击次数", "#ff0040"),
      makeKPIGauge(document.getElementById("kpi-block"), 99.8, 100, "拦截率%", "#00ff41"),
      makeKPIGauge(document.getElementById("kpi-vuln"), 34, 100, "待修复漏洞", "#ffd700"),
      makeKPIGauge(document.getElementById("kpi-score"), 91, 100, "安全评分", "#00bfff")
    ];

    /* ==================== ECHARTS COMMON ==================== */
    var chartFont = "'Courier New', monospace";
    var chartText = "#00ff41";
    var chartTextDim = "rgba(0,255,65,0.5)";

    function commonOption() {
      return {
        backgroundColor: "transparent",
        textStyle: { fontFamily: chartFont },
        tooltip: {
          backgroundColor: "rgba(0,10,0,0.9)",
          borderColor: "#00ff41",
          textStyle: { color: "#00ff41", fontFamily: chartFont }
        },
        legend: {
          textStyle: { color: chartTextDim, fontFamily: chartFont },
          bottom: 2,
          itemWidth: 12, itemHeight: 8
        },
        grid: { left: 45, right: 15, top: 30, bottom: 30 }
      };
    }

    /* ==================== 24H ATTACK TREND ==================== */
    var chartTrend = safeInit('chart-trend');
    var trendHours = []; for (var th = 0; th < 24; th++) trendHours.push(String(th).padStart(2, "0") + ":00");
    var trendData = [45,38,32,28,25,30,55,120,210,340,520,680,590,480,390,420,560,740,920,850,620,410,280,150];
    chartTrend.setOption(Object.assign({}, commonOption(), {
      grid: { left: 40, right: 10, top: 15, bottom: 20 },
      xAxis: {
        type: "category", data: trendHours,
        axisLine: { lineStyle: { color: "rgba(0,255,65,0.2)" } },
        axisLabel: { color: chartTextDim, fontFamily: chartFont, fontSize: 8, interval: 4 },
        axisTick: { show: false }
      },
      yAxis: {
        type: "value",
        splitLine: { lineStyle: { color: "rgba(0,255,65,0.08)" } },
        axisLine: { show: false },
        axisLabel: { color: chartTextDim, fontFamily: chartFont, fontSize: 9 }
      },
      series: [{
        type: "line", data: trendData, smooth: true,
        symbol: "none",
        lineStyle: { color: "#ff0040", width: 2 },
        areaStyle: { color: "rgba(255,0,64,0.15)" }
      }]
    }));

    /* ==================== ATTACK TYPE DISTRIBUTION (DONUT) ==================== */
    var chartType = safeInit('chart-type');
    chartType.setOption(Object.assign({}, commonOption(), {
      legend: Object.assign({}, commonOption().legend, { orient: "vertical", right: 5, top: "center", itemGap: 6 }),
      series: [{
        type: "pie",
        radius: ["20%", "65%"],
        center: ["38%", "50%"],
        avoidLabelOverlap: true,
        itemStyle: { borderRadius: 4, borderColor: "#000a00", borderWidth: 2 },
        label: { color: chartText, fontFamily: chartFont, fontSize: 9 },
        labelLine: { lineStyle: { color: "rgba(0,255,65,0.3)" } },
        data: [
          { value: 820, name: "DDoS", itemStyle: { color: "#ff0040" } },
          { value: 640, name: "SQL注入", itemStyle: { color: "#ff3366" } },
          { value: 480, name: "XSS", itemStyle: { color: "#ffd700" } },
          { value: 390, name: "钓鱼", itemStyle: { color: "#00bfff" } },
          { value: 310, name: "恶意软件", itemStyle: { color: "#00ff41" } },
          { value: 207, name: "其他", itemStyle: { color: "rgba(0,255,65,0.4)" } }
        ]
      }]
    }));

    /* ==================== TOP ATTACK SOURCES (POLAR BAR) ==================== */
    var chartSource = safeInit('chart-source');
    var sourceCountries = ["印度", "巴西", "俄罗斯", "美国", "中国"];
    var sourceValues = [320, 480, 650, 890, 1240];
    chartSource.setOption(Object.assign({}, commonOption(), {
      polar: { radius: ["15%", "70%"], center: ["50%", "55%"] },
      angleAxis: { max: 1300, startAngle: 90,
        axisLine: { lineStyle: { color: "rgba(0,255,65,0.15)" } },
        axisLabel: { color: chartTextDim, fontFamily: chartFont, fontSize: 8 },
        splitLine: { lineStyle: { color: "rgba(0,255,65,0.08)" } }
      },
      radiusAxis: {
        type: "category", data: sourceCountries,
        axisLine: { lineStyle: { color: "rgba(0,255,65,0.15)" } },
        axisLabel: { color: chartTextDim, fontFamily: chartFont, fontSize: 9 }
      },
      series: [{
        type: "bar",
        coordinateSystem: "polar",
        data: sourceValues,
        itemStyle: { color: "#ff0040" }
      }]
    }));

    /* ==================== VULNERABILITY STATUS ==================== */
    var chartVuln = safeInit('chart-vuln');
    var vulnCats = ["操作系统", "中间件", "数据库", "Web应用", "网络设备", "容器平台"];
    chartVuln.setOption(Object.assign({}, commonOption(), {
      grid: { left: 60, right: 10, top: 20, bottom: 25 },
      legend: Object.assign({}, commonOption().legend, { data: ["已修复", "修复中", "待修复"] }),
      xAxis: {
        type: "category", data: vulnCats,
        axisLine: { lineStyle: { color: "rgba(0,255,65,0.2)" } },
        axisLabel: { color: chartTextDim, fontFamily: chartFont, fontSize: 8 },
        axisTick: { show: false }
      },
      yAxis: {
        type: "value",
        splitLine: { lineStyle: { color: "rgba(0,255,65,0.08)" } },
        axisLabel: { color: chartTextDim, fontFamily: chartFont, fontSize: 9 }
      },
      series: [
        { name: "已修复", type: "bar", stack: "total", barWidth: 14,
          data: [42,28,19,35,14,8],
          itemStyle: { color: "#00ff41" } },
        { name: "修复中", type: "bar", stack: "total",
          data: [8,5,3,10,4,2],
          itemStyle: { color: "#00bfff" } },
        { name: "待修复", type: "bar", stack: "total",
          data: [5,4,2,12,6,5],
          itemStyle: { color: "#ffd700" } }
      ]
    }));

    /* ==================== ATT&CK MATRIX (HEATMAP) ==================== */
    var chartAttack = safeInit('chart-attack');
    var tactics = ["初始访问", "执行", "持久化", "权限提升", "防御规避", "凭证访问", "发现", "横向移动", "收集", "C2", "数据窃取", "影响"];
    var techniques = ["T1", "T2", "T3", "T4", "T5", "T6", "T7", "T8"];
    var heatData = [];
