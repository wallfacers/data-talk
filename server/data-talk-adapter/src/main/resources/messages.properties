action.execute_sql.description=Run a SELECT query on the given connection and persist the result as a table artifact. Requires sql; connection context may inherit from the session.
action.get_data_context.description=Return the current session data context including connection, database, and schema.
action.list_connection_targets.description=List databases and schemas that can be selected for a connection.
action.list_connections.description=List available saved data source connections.
action.pin_artifact.description=Pin an artifact in the client timeline for the current session. Requires artifactId. This is a client-side timeline action, not durable server persistence.
action.read_schema.description=Return read-only table and column metadata for the given connection.
action.render_chart.description=Render an ECharts option chart and optionally supersede a previous chart. Requires echartsOption.
action.resolve_use_target.description=Resolve a raw use target into a connection, database, or schema for the current session. Requires target.
action.select_connection.description=Select a saved connection as the current session connection. Requires connectionId.
action.set_data_context.description=Update the current session data context. Requires connectionId and selectedLevel; for use-target switches copy the full matched_target returned by datatalk_resolve_use_target.
action.archive_artifact.description=Mark a file in the current session subdir as an archive candidate, signaling the user that this output is worth preserving as a long-term asset for the active database connection.
action.supersede_artifact.description=Explicitly mark one artifact as superseded by another. Requires newArtifactId and oldArtifactId.
action.test_connection.description=Test whether a saved connection is reachable. Requires connectionId.
action.update_connection_confirmable.description=Preview and confirm updates to an existing saved connection. When confirm=true, confirmationToken from the preview response is required.
action.create_connection.description=Create a new saved connection. Requires name, kind, host, port, username, and password.
action.ui_read.description=Read workspace, query_editor, er_inspector, or er_designer state, schema, actions, or the full descriptor from the client.
action.ui_patch.description=Apply client-side query_editor, er_inspector, or er_designer patches using the UI Object Protocol. add/replace ops require value; ER designer structural patches require baseVersion.
action.ui_exec.description=Execute workspace, query_editor, er_inspector, or er_designer actions on the client, including open_er_inspector, open_er_designer, bind_target, diff_against_db, generate_ddl, refresh, auto_layout, fit_view, add_neighbors, apply_text_edits, run_sql, format_sql, and focus. Include each action's required params from the input schema on the first call. Use choose_connection only when a database-related request needs a data source.
action.ui_exec.workspace.open_er_inspector.description=Open an ER inspector tab for the given seed tables and direct/indirect neighbors.
action.ui_exec.workspace.open_er_designer.description=Open an ER designer tab for an empty or seeded schema draft.
action.ui_exec.er_inspector.refresh.description=Re-read tables from the connection and update the inspector snapshot.
action.ui_exec.er_inspector.auto_layout.description=Recompute node positions via dagre.
action.ui_exec.er_inspector.fit_view.description=Reset the inspector viewport.
action.ui_exec.er_inspector.add_neighbors.description=Add a table's direct FK neighbors to the inspector selection.
action.ui_exec.er_inspector.fork_to_designer.description=Create a designer tab seeded from this inspector. Implemented in Plan B.
action.ui_exec.er_designer.auto_layout.description=Recompute node positions via dagre on the designer canvas.
action.ui_exec.er_designer.fit_view.description=Reset the designer viewport.
action.ui_exec.er_designer.bind_target.description=Bind a target connection so generate_ddl / diff_against_db can compare against the real DB.
action.ui_exec.er_designer.unbind_target.description=Unbind the target connection. Designer reverts to a connection-less draft.
action.ui_exec.er_designer.sync_from_db.description=Refresh designer tables from the bound connection's real schema.
action.ui_exec.er_designer.diff_against_db.description=Return the schema diff between the designer draft and the bound DB without generating DDL.
action.ui_exec.er_designer.generate_ddl.description=Compute the diff and write CREATE/ALTER/INDEX statements into a new query_editor tab. Returns queryEditorTabId for the user to review and run via L2/L3 confirmation.
