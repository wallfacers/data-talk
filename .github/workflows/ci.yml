name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Bezel docs anti-drift gate
  # ─────────────────────────────────────────────
  bezel-docs-drift:
    name: Bezel docs drift check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate bezel docs
        run: bash scripts/generate-bezel-docs.sh

      - name: Check for drift
        run: |
          if ! git diff --exit-code -- \
            server/data-talk-adapter/src/main/resources/skills/bezel/references/patterns-catalog.md \
            server/data-talk-adapter/src/main/resources/skills/bezel/references/layout-templates.md; then
            echo "::error::Bezel docs are out of date. Run: bash scripts/generate-bezel-docs.sh"
            exit 1
          fi
          echo "Bezel docs are up to date."

  # ─────────────────────────────────────────────
  # Job 2: Backend build + test
  # ─────────────────────────────────────────────
  backend:
    name: Backend build & test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & test
        run: cd server && mvn clean verify -B

  # ─────────────────────────────────────────────
  # Job 3: Frontend type check
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend type check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: client
        run: npx tsc --noEmit
