<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>data-talk</title>
    <style>
      /* Pre-React boot loader. Painted before the bundle parses so the window
         never shows a blank/white frame; React's WelcomeScreen replaces #root
         content on mount. Uses raw values (globals.css is not loaded yet) that
         mirror the app's bg.canvas + accent.primary tokens in both themes. */
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(0.995 0.002 80);
      }
      #boot-loader > span {
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 9999px;
        border: 2px solid oklch(0.53 0.2 262 / 0.25);
        border-top-color: oklch(0.53 0.2 262);
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        #boot-loader { background: oklch(0.21 0.01 255); }
        #boot-loader > span {
          border-color: oklch(0.72 0.14 258 / 0.25);
          border-top-color: oklch(0.72 0.14 258);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader > span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
